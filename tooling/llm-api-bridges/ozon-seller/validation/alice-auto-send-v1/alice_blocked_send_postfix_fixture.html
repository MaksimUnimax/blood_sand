<!doctype html><html><head><meta charset="utf-8"><title>ALICE_BLOCKED_SEND_POSTFIX_PENDING</title><style>
.Standalone-Input,.StandaloneInput-Container,.StandaloneInput-Field,.AliceInput,.StandaloneRichInput-Controls{display:block}textarea{width:500px;height:90px}button{display:block;width:44px;height:44px}
</style></head><body>
<div class="Standalone-Input"><div class="StandaloneInput-Container"><div class="StandaloneInput-Field" data-testid="standalone-input-field"><div class="AliceInput" data-highlight-id="alice-input">
<textarea data-testid="inputbase-textarea"></textarea>
<div class="StandaloneRichInput-Controls" data-testid="input-controls-root">
<button data-testid="InputControls-Plus-Button" aria-label="Добавить файл" aria-haspopup="dialog">+</button>
<button id="oknyx-button" data-highlight-id="alice-oknyx-button" data-testid="oknyx" aria-label="Отправить" class="StandaloneOknyx StandaloneOknyx_error StandaloneOknyx_arrow" type="button">→</button>
</div></div></div></div></div>
<pre id="result">PENDING</pre>
<script src="../../dist-step7-candidate/shared/ai_adapters.js"></script>
<script src="../../dist-step7-candidate/shared/composer_send.js"></script>
<script>
(async()=>{
 const out=document.querySelector('#result');
 try{
  const alice=OzonAIAdapters.ADAPTERS.alice;
  const marker='OZON_BATCH_RESULT_V1\n{"delivery_id":"postfix-blocked-guard"}';
  const ctx=alice.composerContext(); if(!ctx) throw new Error('context missing');
  alice.setComposerText(ctx.composer,marker);
  const button=document.querySelector('#oknyx-button');

  const blocked=alice.classifyComposerControl(ctx,OzonAIAdapters.visible);
  if(blocked.kind!=='send_disabled') throw new Error('blocked Alice control must classify send_disabled:'+blocked.kind);
  if(alice.sendButton(ctx)!==null) throw new Error('blocked Alice control must not be a Send target');

  let clickCount=0; button.addEventListener('click',()=>clickCount++);
  let sleepCount=0;
  const deps={
    resolveContext:()=>alice.composerContext(),
    resolveButton:(c)=>alice.sendButton(c),
    candidateButtons:(c)=>alice.sendButtonCandidates(c),
    visible:OzonAIAdapters.visible,
    readComposerText:(c)=>alice.readComposerText(c),
    fingerprint:(b)=>alice.sendButtonFingerprint(b),
    sleep:async()=>{ sleepCount++; if(sleepCount===2) button.classList.remove('StandaloneOknyx_error'); }
  };
  const target=await BB2ComposerSend.waitForValidatedTarget({expectedText:marker,timeoutMs:1000,sampleIntervalMs:0,requiredStableSamples:3,deps});
  if(!target) throw new Error('transient blocked control did not become stable after unblock');
  if(clickCount!==0) throw new Error('click happened before SEND commit/click phase');
  if(alice.classifyComposerControl(alice.composerContext(),OzonAIAdapters.visible).kind!=='send_active') throw new Error('unblocked Alice control did not become send_active');
  const receipt=BB2ComposerSend.clickSynchronously({target,expectedText:marker,deps});
  if(receipt.click_event_observed!==true||clickCount!==1) throw new Error('unblocked target must click exactly once');

  button.classList.add('StandaloneOknyx_error');
  let persistentSleeps=0;
  const persistentDeps={...deps,sleep:async()=>{persistentSleeps++;}};
  const none=await BB2ComposerSend.waitForValidatedTarget({expectedText:marker,timeoutMs:2,sampleIntervalMs:1,requiredStableSamples:3,deps:persistentDeps});
  if(none!==null) throw new Error('persistent blocked Alice state must time out fail-closed');
  if(clickCount!==1) throw new Error('persistent blocked state caused an extra click');

  button.classList.remove('StandaloneOknyx_error'); button.disabled=true;
  if(alice.sendButton(alice.composerContext())!==null) throw new Error('native disabled target accepted');
  button.disabled=false; button.setAttribute('aria-label','Алиса, начни слушать');
  if(alice.sendButton(alice.composerContext())!==null) throw new Error('ready/mic target accepted');
  button.setAttribute('aria-label','Алиса, стоп');
  if(alice.sendButton(alice.composerContext())!==null) throw new Error('stop target accepted');

  document.title='ALICE_BLOCKED_SEND_POSTFIX_PASS'; document.documentElement.dataset.ozonTest='PASS';
  out.textContent='ALICE_BLOCKED_SEND_POSTFIX_PASS';
 }catch(e){document.title='ALICE_BLOCKED_SEND_POSTFIX_FAIL';out.textContent='FAIL:'+(e?.stack||e);}
})();
</script></body></html>
