name: Ozon mixed HELP API targeted regression diagnostic 2026-09-10

on:
  push:
    branches:
      - repair/ozon-mixed-help-api-startup-prompt-2026-09-10
    paths:
      - '.github/workflows/ozon-mixed-help-api-targeted-diagnostic-2026-09-10.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
      - name: Materialize then capture exact targeted regression output
        shell: bash
        run: |
          set -u
          ROOT='tooling/llm-api-bridges/ozon-seller'
          REPORT="$ROOT/validation/reports/OZON_MIXED_HELP_API_TARGETED_DIAGNOSTIC_2026-09-10.txt"
          mkdir -p "$ROOT/validation/reports"
          set +e
          python3 "$ROOT/development/mixed-help-api-startup-prompt-2026-09-10/materialize_mixed_help_api_patch_v3.py" > "$RUNNER_TEMP/materializer.log" 2>&1
          MAT_CODE=$?
          if [ "$MAT_CODE" -eq 0 ]; then
            node "$ROOT/validation/mixed-help-api-v2/run_mixed_help_api_gate_v2.mjs" . > "$RUNNER_TEMP/targeted.log" 2>&1
            TEST_CODE=$?
          else
            echo 'targeted regression not run because materialization failed' > "$RUNNER_TEMP/targeted.log"
            TEST_CODE=99
          fi
          set -e
          {
            echo "workflow_input_sha=$GITHUB_SHA"
            echo "materializer_exit_code=$MAT_CODE"
            echo "targeted_exit_code=$TEST_CODE"
            echo '--- materializer stdout+stderr ---'
            cat "$RUNNER_TEMP/materializer.log"
            echo '--- targeted stdout+stderr ---'
            cat "$RUNNER_TEMP/targeted.log"
            echo '--- workspace changed paths (runtime changes NOT committed) ---'
            git status --short
          } > "$REPORT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$REPORT"
          git commit -m 'diagnostic(ozon): persist exact mixed targeted regression failure'
          git push origin HEAD:repair/ozon-mixed-help-api-startup-prompt-2026-09-10
          echo "TARGETED_DIAGNOSTIC_MATERIALIZER_EXIT=$MAT_CODE"
          echo "TARGETED_DIAGNOSTIC_TEST_EXIT=$TEST_CODE"
          echo TARGETED_DIAGNOSTIC_RECORDED
