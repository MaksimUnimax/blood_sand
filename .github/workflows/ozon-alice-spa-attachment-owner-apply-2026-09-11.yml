name: Ozon Alice SPA attachment owner apply
run-name: Ozon Alice SPA attachment owner apply · ${{ github.ref_name }} · ${{ github.sha }}

on:
  push:
    branches: [repair/ozon-alice-spa-attachment-owner-2026-09-11]
    paths:
      - '.github/workflows/ozon-alice-spa-attachment-owner-apply-2026-09-11.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '24.12.0'}
      - name: Apply exact SPA owner repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('tooling/llm-api-bridges/ozon-seller/dist-step7-candidate')
          content = root / 'attachment_delivery_port_content.js'
          s = content.read_text()
          old = '''  function request(type, payload = {}, timeoutMs = PORT_REQUEST_TIMEOUT_MS) {\n    return new Promise((resolve) => {\n      const port = ensurePort();\n      if (!port) { resolve({ ok: false, code: "ATTACHMENT_PORT_UNAVAILABLE", error: "Attachment delivery port is unavailable." }); return; }\n      const requestId = `${runtime.id}:${++runtime.request_seq}`;\n      const timer = setTimeout(() => {\n        if (!runtime.pending.has(requestId)) return;\n        runtime.pending.delete(requestId);\n        resolve({ ok: false, code: "ATTACHMENT_PORT_TIMEOUT", error: `Attachment port request timed out: ${type}` });\n      }, timeoutMs);\n      runtime.pending.set(requestId, { resolve, timer });\n      try { port.postMessage({ request_id: requestId, type, ...payload }); }\n      catch (error) {\n        runtime.pending.delete(requestId);\n        clearTimeout(timer);\n        resolve({ ok: false, code: "ATTACHMENT_PORT_POST_FAILED", error: String(error?.message || error) });\n      }\n    });\n  }\n'''
          new = '''  function liveOwnerBinding() {\n    const here = identity();\n    if (here.status !== "confirmed" || !here.conversation_id || !here.origin) return null;\n    return {\n      origin: String(here.origin).toLowerCase(),\n      conversation_id: String(here.conversation_id).toLowerCase()\n    };\n  }\n\n  function request(type, payload = {}, timeoutMs = PORT_REQUEST_TIMEOUT_MS) {\n    return new Promise((resolve) => {\n      const port = ensurePort();\n      if (!port) { resolve({ ok: false, code: "ATTACHMENT_PORT_UNAVAILABLE", error: "Attachment delivery port is unavailable." }); return; }\n      const liveOwner = liveOwnerBinding();\n      if (!liveOwner) { resolve({ ok: false, code: "ATTACHMENT_LIVE_OWNER_UNAVAILABLE", error: "Current AI conversation identity is unavailable." }); return; }\n      const requestId = `${runtime.id}:${++runtime.request_seq}`;\n      const timer = setTimeout(() => {\n        if (!runtime.pending.has(requestId)) return;\n        runtime.pending.delete(requestId);\n        resolve({ ok: false, code: "ATTACHMENT_PORT_TIMEOUT", error: `Attachment port request timed out: ${type}` });\n      }, timeoutMs);\n      runtime.pending.set(requestId, { resolve, timer });\n      try { port.postMessage({ request_id: requestId, type, ...payload, live_owner: liveOwner }); }\n      catch (error) {\n        runtime.pending.delete(requestId);\n        clearTimeout(timer);\n        resolve({ ok: false, code: "ATTACHMENT_PORT_POST_FAILED", error: String(error?.message || error) });\n      }\n    });\n  }\n'''
          if s.count(old) != 1:
              raise SystemExit(f'content request anchor count={s.count(old)}')
          s = s.replace(old, new)
          old = '''  async function queryRecovery() {\n    const key = conversationKey();\n    if (!key) return null;\n    const response = await request("OZ_ATTACHMENT_RECOVERY_GET", { conversation_key: key });\n    return response?.ok ? response.recovery || null : null;\n  }\n\n  async function recoverCurrent() {\n    if (!current()) return { ok: false, code: "ATTACHMENT_RUNTIME_DISPOSED" };\n    const recovery = await queryRecovery();\n    if (recovery) return await processRecovery(recovery);\n    return { ok: true, recovery: null };\n  }\n'''
          new = '''  async function queryRecovery() {\n    const key = conversationKey();\n    if (!key) return null;\n    const response = await request("OZ_ATTACHMENT_RECOVERY_GET", { conversation_key: key });\n    if (!response?.ok) throw Object.assign(new Error(response?.error || "Attachment recovery request failed."), { code: response?.code || "ATTACHMENT_RECOVERY_FAILED" });\n    return response.recovery || null;\n  }\n\n  async function recoverCurrent() {\n    if (!current()) return { ok: false, code: "ATTACHMENT_RUNTIME_DISPOSED" };\n    try {\n      const recovery = await queryRecovery();\n      if (recovery) return await processRecovery(recovery);\n      return { ok: true, recovery: null };\n    } catch (error) {\n      status(`Ozon: ошибка проверки доставки файла (${error?.code || "ATTACHMENT_RECOVERY_FAILED"}).`, "error");\n      return { ok: false, code: error?.code || "ATTACHMENT_RECOVERY_FAILED", error: String(error?.message || error) };\n    }\n  }\n'''
          if s.count(old) != 1:
              raise SystemExit(f'content recovery anchor count={s.count(old)}')
          content.write_text(s.replace(old, new))

          worker = root / 'shared/file_delivery_port_worker.js'
          s = worker.read_text()
          old = '''  function senderIdentity(sender) {\n    const rawUrl = sender?.url || sender?.tab?.url || "";\n    try {\n      const parsed = new URL(rawUrl);\n      return BB2ConversationIdentity.resolve({ origin: parsed.origin, pathname: parsed.pathname, canonicalHref: "" });\n    } catch (_) { return null; }\n  }\n\n  function assertSenderOwner(sender, owner) {\n    const senderTab = Number(sender?.tab?.id || 0);\n    if (!Number.isInteger(senderTab) || senderTab <= 0 || senderTab !== Number(owner?.tab_id || 0)) {\n      throw Object.assign(new Error("Attachment delivery request came from a non-owner tab."), { code: "ATTACHMENT_NON_OWNER_TAB" });\n    }\n    const identity = senderIdentity(sender);\n    if (!identity || identity.status !== "confirmed" || normalizeKey(identity.origin) !== normalizeKey(owner.origin) || normalizeKey(identity.conversation_id) !== normalizeKey(owner.conversation_id)) {\n      throw Object.assign(new Error("Attachment delivery request came from a different AI conversation."), { code: "ATTACHMENT_CONVERSATION_MISMATCH" });\n    }\n  }\n'''
          new = '''  function senderOrigin(sender) {\n    const rawUrl = sender?.url || sender?.tab?.url || "";\n    try { return normalizeKey(new URL(rawUrl).origin); }\n    catch (_) { return ""; }\n  }\n\n  function normalizedLiveOwner(value) {\n    if (!value || typeof value !== "object" || Array.isArray(value)) return null;\n    const origin = normalizeKey(value.origin);\n    const conversationId = normalizeKey(value.conversation_id);\n    if (!origin || !conversationId) return null;\n    try {\n      const parsed = new URL(origin);\n      if (normalizeKey(parsed.origin) !== origin || parsed.protocol !== "https:") return null;\n    } catch (_) { return null; }\n    const provider = BB2ConversationIdentity.providerForOrigin(origin);\n    if (!provider) return null;\n    const syntheticPath = provider === "alice" ? `/chat/${conversationId}` : `/c/${conversationId}`;\n    if (BB2ConversationIdentity.conversationIdFromPath(syntheticPath, provider) !== conversationId) return null;\n    return { origin, conversation_id: conversationId };\n  }\n\n  function assertSenderOwner(sender, owner, liveOwnerValue) {\n    const senderTab = Number(sender?.tab?.id || 0);\n    if (!Number.isInteger(senderTab) || senderTab <= 0 || senderTab !== Number(owner?.tab_id || 0)) {\n      throw Object.assign(new Error("Attachment delivery request came from a non-owner tab."), { code: "ATTACHMENT_NON_OWNER_TAB" });\n    }\n    const expectedOrigin = normalizeKey(owner?.origin);\n    if (!expectedOrigin || senderOrigin(sender) !== expectedOrigin) {\n      throw Object.assign(new Error("Attachment delivery request came from a different AI origin."), { code: "ATTACHMENT_ORIGIN_MISMATCH" });\n    }\n    const liveOwner = normalizedLiveOwner(liveOwnerValue);\n    if (!liveOwner) {\n      throw Object.assign(new Error("Attachment delivery request is missing a confirmed live conversation owner."), { code: "ATTACHMENT_LIVE_OWNER_REQUIRED" });\n    }\n    if (liveOwner.origin !== expectedOrigin || liveOwner.conversation_id !== normalizeKey(owner?.conversation_id)) {\n      throw Object.assign(new Error("Attachment delivery request came from a different live AI conversation."), { code: "ATTACHMENT_CONVERSATION_MISMATCH" });\n    }\n  }\n'''
          if s.count(old) != 1:
              raise SystemExit(f'worker owner anchor count={s.count(old)}')
          s = s.replace(old, new)
          if s.count('assertSenderOwner(sender, found.owner);') != 2:
              raise SystemExit('worker assert call anchor count mismatch')
          s = s.replace('assertSenderOwner(sender, found.owner);', 'assertSenderOwner(sender, found.owner, message.live_owner);')
          worker.write_text(s)
          PY
      - name: Syntax and defect regression
        run: |
          node --check tooling/llm-api-bridges/ozon-seller/dist-step7-candidate/attachment_delivery_port_content.js
          node --check tooling/llm-api-bridges/ozon-seller/dist-step7-candidate/shared/file_delivery_port_worker.js
          node tooling/llm-api-bridges/ozon-seller/validation/alice-spa-attachment-owner-v1/run_prefx_spa_owner_gate.mjs .
          git diff --check
      - name: Existing attachment regressions
        run: |
          node tooling/llm-api-bridges/ozon-seller/validation/regression/run_file_delivery_adapter_gate_policy.mjs
          node tooling/llm-api-bridges/ozon-seller/validation/regression/run_file_delivery_capture_accounting.mjs
          node tooling/llm-api-bridges/ozon-seller/validation/regression/run_file_delivery_port_worker_state_machine.mjs
          node tooling/llm-api-bridges/ozon-seller/validation/regression/run_file_delivery_mixed_batch_policy.mjs
          node tooling/llm-api-bridges/ozon-seller/validation/regression/run_file_delivery_wake_lifecycle.mjs
      - name: Commit executable repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tooling/llm-api-bridges/ozon-seller/dist-step7-candidate/attachment_delivery_port_content.js tooling/llm-api-bridges/ozon-seller/dist-step7-candidate/shared/file_delivery_port_worker.js
          git diff --cached --quiet && { echo 'No production diff to commit'; exit 1; }
          git commit -m 'fix(ozon): bind attachment ownership to live SPA conversation'
          git push origin HEAD:repair/ozon-alice-spa-attachment-owner-2026-09-11
