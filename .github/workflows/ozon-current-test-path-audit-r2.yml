name: Ozon current browser path audit R3

on:
  push:
    branches:
      - dev/ozon-v0.1.19-manual-delivery-composer-wait-2026-08-18
    paths:
      - '.github/workflows/ozon-current-test-path-audit-r2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ozon-current-test-path-audit-r2
  cancel-in-progress: true

env:
  FROZEN_ZIP: tooling/llm-api-bridges/ozon-seller/artifacts/OZON_BRIDGE_v0.1.19_TESTED_FROZEN_REPAIR_66bc4ac.zip
  FROZEN_ZIP_SHA256: d794e9fe8550dcf20d76d63abf7832d9b28853ad6d7c8e94faa22a3c08a46a2c
  PATCH_0_BLOB: 4b4578995156cafd60221f8d57f678b99b0b00ff
  PATCH_1_BLOB: 98feec99e459332df60aae879fa8f2530856c2d0
  PATCH_SHA256: bd0119212a21c63fbbc2a6d0067c0c19abcf31896007e8f8d3e19efa8255019d
  FINAL_WORKER_SHA256: dfc101f6d1840af89b7dc48b6082f43b26c8143ed96086bc19ab0dfd36c21fac
  FINAL_CONTENT_SHA256: ab3408a2637153fa324f0b679ac5452b9b7ae0182f5ccf4f0397ccd960857dda
  TEST_SOURCE_COMMIT: 5049fe6d579b41f94069d7f2d2a8d3f5d1198c62

jobs:
  browser:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'

      - name: Reconstruct exact candidate
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $w=Join-Path $env:RUNNER_TEMP 'r3'; $c=Join-Path $w 'candidate'; $p=Join-Path $w 'repair.patch'
          if(Test-Path $w){Remove-Item -Recurse -Force $w}; New-Item -ItemType Directory -Force $c|Out-Null
          if((Get-FileHash -Algorithm SHA256 $env:FROZEN_ZIP).Hash.ToLowerInvariant() -ne $env:FROZEN_ZIP_SHA256){throw 'frozen zip sha mismatch'}
          $a=Join-Path $w '00'; $b=Join-Path $w '01'
          cmd /c "git cat-file blob $env:PATCH_0_BLOB > `"$a`""; if($LASTEXITCODE){throw 'part0'}
          cmd /c "git cat-file blob $env:PATCH_1_BLOB > `"$b`""; if($LASTEXITCODE){throw 'part1'}
          $x=[IO.File]::ReadAllBytes($a);$y=[IO.File]::ReadAllBytes($b);$z=New-Object byte[] ($x.Length+$y.Length)
          [Array]::Copy($x,0,$z,0,$x.Length);[Array]::Copy($y,0,$z,$x.Length,$y.Length);[IO.File]::WriteAllBytes($p,$z)
          if($z.Length-ne 13648){throw 'patch bytes'}
          if((Get-FileHash -Algorithm SHA256 $p).Hash.ToLowerInvariant()-ne$env:PATCH_SHA256){throw 'patch sha'}
          Expand-Archive $env:FROZEN_ZIP $c -Force
          Push-Location $c; git init -q; git config core.autocrlf false; git apply --check $p; git apply $p
          if((Get-FileHash -Algorithm SHA256 service_worker.js).Hash.ToLowerInvariant()-ne$env:FINAL_WORKER_SHA256){throw 'worker sha'}
          if((Get-FileHash -Algorithm SHA256 content_script.js).Hash.ToLowerInvariant()-ne$env:FINAL_CONTENT_SHA256){throw 'content sha'}
          Pop-Location
          "CANDIDATE=$c"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare exact browser environment and corrected fixture
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $proj=Join-Path $env:RUNNER_TEMP 'r3-puppeteer';New-Item -ItemType Directory -Force $proj|Out-Null
          Push-Location $proj; npm init -y|Out-Null; $env:PUPPETEER_SKIP_DOWNLOAD='true'; npm install --no-save --no-audit --no-fund puppeteer@25.4.0; Pop-Location
          git fetch --no-tags origin $env:TEST_SOURCE_COMMIT
          $test=Join-Path $proj 'B10_B13_B15_BROWSER_CURRENT.mjs'
          cmd /c "git cat-file blob e3ea01ff6518626aa1fc9c96398b486cbb584b01 > `"$test`"";if($LASTEXITCODE){throw 'browser blob'}

          $src=Get-Content -LiteralPath $test -Raw
          $old=@'
  const samples=[sec(firstA)];await new Promise(r=>setTimeout(r,1100));samples.push(sec(await toastText(pageA)));await new Promise(r=>setTimeout(r,1100));samples.push(sec(await toastText(pageA)));
  assert(samples.every(Number.isFinite)&&samples[0]>samples[1]&&samples[1]>samples[2],`countdown did not decrease: ${samples}`);
'@
          $new=@'
  const samples=[sec(firstA)],sampleDeadline=Date.now()+5000;
  while(samples.length<3&&Date.now()<sampleDeadline){await new Promise(r=>setTimeout(r,250));const next=sec(await toastText(pageA));if(Number.isFinite(next)&&next<samples[samples.length-1])samples.push(next)}
  assert(samples.length===3&&samples.every(Number.isFinite)&&samples[0]>samples[1]&&samples[1]>samples[2],`countdown did not expose three decreasing values: ${samples}`);
'@
          if(-not $src.Contains($old)){throw 'countdown fixture source not found'}
          $utf8NoBom=New-Object System.Text.UTF8Encoding($false)
          [IO.File]::WriteAllText($test,$src.Replace($old,$new),$utf8NoBom)
          node --check $test

          $zip=Join-Path $env:RUNNER_TEMP 'cft.zip';$root=Join-Path $env:RUNNER_TEMP 'cft'
          Invoke-WebRequest 'https://storage.googleapis.com/chrome-for-testing-public/151.0.7922.47/win64/chrome-win64.zip' -OutFile $zip
          Expand-Archive $zip $root -Force
          $chrome=Get-ChildItem $root -Filter chrome.exe -File -Recurse|Select-Object -First 1
          if(-not $chrome){throw 'chrome missing'}
          $version=(Get-Item $chrome.FullName).VersionInfo.ProductVersion
          if($version -notlike '151.0.7922.47*'){throw "cft version $version"}
          "BROWSER_TEST=$test"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CFT_CHROME=$($chrome.FullName)"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "CFT_VERSION=$version"

      - name: Execute corrected browser path
        id: execute
        continue-on-error: true
        shell: pwsh
        run: |
          $l=Join-Path $env:RUNNER_TEMP 'browser-r3.log'
          node $env:BROWSER_TEST $env:CANDIDATE $env:CFT_CHROME 2>&1|Tee-Object $l
          $rc=$LASTEXITCODE;"BROWSER_EXIT_CODE=$rc"|Tee-Object $l -Append;if($rc){exit $rc}

      - name: Save result
        if: always()
        shell: pwsh
        run: |
          $o=Join-Path $env:RUNNER_TEMP 'browser-r3-result.txt'
          @("trigger_sha=$env:GITHUB_SHA","execute=${{ steps.execute.outcome }}")|Set-Content $o -Encoding utf8NoBOM
          $l=Join-Path $env:RUNNER_TEMP 'browser-r3.log';if(Test-Path $l){Get-Content $l|Add-Content $o -Encoding utf8}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ozon-r3-browser
          path: ${{ runner.temp }}/browser-r3-result.txt
          retention-days: 7

  publish:
    if: always()
    needs:
      - browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/ozon-v0.1.19-manual-delivery-composer-wait-2026-08-18
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: ozon-r3-browser
          path: ${{ runner.temp }}/r3-result
      - name: Append browser R3 evidence
        shell: bash
        run: |
          set -euo pipefail
          F='tooling/llm-api-bridges/ozon-seller/validation/engineering-preflight/CURRENT_TEST_PATH_AUDIT_2026-08-19.md'
          R="$RUNNER_TEMP/r3-result/browser-r3-result.txt"
          cat >> "$F" <<EOF
          
          ## Engineering follow-up R3 — browser countdown fixture correction
          
          Trigger commit: \`$GITHUB_SHA\`
          
          \`\`\`text
          $(cat "$R" 2>/dev/null || echo BROWSER_R3_RESULT_MISSING)
          \`\`\`
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$F"
          git commit -m 'test: append Ozon browser path audit R3 evidence [skip ci]'
          git push origin HEAD:dev/ozon-v0.1.19-manual-delivery-composer-wait-2026-08-18
