name: Ozon mixed HELP API materializer diagnostic 2026-09-10

on:
  push:
    branches:
      - repair/ozon-mixed-help-api-startup-prompt-2026-09-10
    paths:
      - '.github/workflows/ozon-mixed-help-api-materializer-diagnostic-2026-09-10.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
      - name: Capture exact materializer stdout stderr and exit code
        shell: bash
        run: |
          set -u
          ROOT='tooling/llm-api-bridges/ozon-seller'
          REPORT="$ROOT/validation/reports/OZON_MIXED_HELP_API_MATERIALIZER_DIAGNOSTIC_2026-09-10.txt"
          mkdir -p "$ROOT/validation/reports"
          set +e
          python3 "$ROOT/development/mixed-help-api-startup-prompt-2026-09-10/materialize_mixed_help_api_patch_v3.py" > "$RUNNER_TEMP/materializer.log" 2>&1
          CODE=$?
          set -e
          {
            echo "workflow_input_sha=$GITHUB_SHA"
            echo "exit_code=$CODE"
            echo "--- materializer stdout+stderr ---"
            cat "$RUNNER_TEMP/materializer.log"
            echo "--- workspace changed paths (NOT committed except this diagnostic) ---"
            git status --short
          } > "$REPORT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$REPORT"
          git commit -m 'diagnostic(ozon): persist exact mixed materializer failure'
          git push origin HEAD:repair/ozon-mixed-help-api-startup-prompt-2026-09-10
          echo "MATERIALIZER_DIAGNOSTIC_EXIT_CODE=$CODE"
          echo "MATERIALIZER_DIAGNOSTIC_RECORDED"
