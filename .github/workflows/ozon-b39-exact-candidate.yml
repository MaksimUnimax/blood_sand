name: Ozon B39 FBS Pickup Geography Reads exact candidate
on:
  push:
    branches: [feature/ozon-b39-fbs-pickup-geography-reads-2026-08-28]
    paths:
      - .github/workflows/ozon-b39-exact-candidate.yml
      - tooling/llm-api-bridges/ozon-seller/validation/PATCH_B39_FBS_PICKUP_GEOGRAPHY_READS_2026-08-28.patch.gz
      - tooling/llm-api-bridges/ozon-seller/validation/materialize_patch_b39_fbs_pickup_geography_reads_candidate.py
      - tooling/llm-api-bridges/ozon-seller/validation/PATCH_B39_FBS_PICKUP_GEOGRAPHY_READS_REGRESSION_2026-08-28.mjs
      - tooling/llm-api-bridges/ozon-seller/validation/PATCH_B39_FBS_PICKUP_GEOGRAPHY_READS_CANDIDATE_EVIDENCE_2026-08-28.md
      - tooling/llm-api-bridges/ozon-seller/validation/PATCH_B39_FBS_PICKUP_GEOGRAPHY_READS_CANDIDATE_MANIFEST_2026-08-28.md
permissions: {contents: read}
jobs:
  linux-materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify B39 patch transport identity
        run: python3 -c "import gzip,hashlib,pathlib;p=pathlib.Path('tooling/llm-api-bridges/ozon-seller/validation/PATCH_B39_FBS_PICKUP_GEOGRAPHY_READS_2026-08-28.patch.gz');c=p.read_bytes();assert hashlib.sha256(c).hexdigest()=='f8529b340ecddcd3b7775858fefa2d60f8d3df0f5f30c41b1b1b15790a5ed65f';assert hashlib.sha256(gzip.decompress(c)).hexdigest()=='1cc3c40c57857c3b323533f00af1b484bf65c401d906127f03b783eb76d4a5eb'"
      - name: Materialize exact B39 candidate
        run: python3 tooling/llm-api-bridges/ozon-seller/validation/materialize_patch_b39_fbs_pickup_geography_reads_candidate.py --repo-root . --work-root /tmp/ozon-b39-work --out /tmp/ozon-b39-exact
      - name: Verify B38 base and B39 gates
        run: |
          node tooling/llm-api-bridges/ozon-seller/validation/PATCH_B38_FINANCE_LEDGER_READS_REGRESSION_2026-08-28.mjs /tmp/ozon-b39-work/b38-base
          node tooling/llm-api-bridges/ozon-seller/validation/PATCH_B39_FBS_PICKUP_GEOGRAPHY_READS_REGRESSION_2026-08-28.mjs /tmp/ozon-b39-exact
          find /tmp/ozon-b39-exact -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - uses: actions/upload-artifact@v4
        with: {name: ozon-b39-fbs-pickup-geography-reads-candidate, path: /tmp/ozon-b39-exact, if-no-files-found: error, retention-days: 3}
  windows-materialize:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable Git long paths
        shell: pwsh
        run: git config --global core.longpaths true
      - name: Verify B39 patch transport identity
        shell: pwsh
        run: python -c "import gzip,hashlib,pathlib;p=pathlib.Path('tooling/llm-api-bridges/ozon-seller/validation/PATCH_B39_FBS_PICKUP_GEOGRAPHY_READS_2026-08-28.patch.gz');c=p.read_bytes();assert hashlib.sha256(c).hexdigest()=='f8529b340ecddcd3b7775858fefa2d60f8d3df0f5f30c41b1b1b15790a5ed65f';assert hashlib.sha256(gzip.decompress(c)).hexdigest()=='1cc3c40c57857c3b323533f00af1b484bf65c401d906127f03b783eb76d4a5eb'"
      - name: Materialize exact B39 candidate
        shell: pwsh
        run: |
          $work='C:\b39w'; $out='C:\b39o'
          python tooling/llm-api-bridges/ozon-seller/validation/materialize_patch_b39_fbs_pickup_geography_reads_candidate.py --repo-root . --work-root $work --out $out
      - name: Verify B38 base and B39 gates
        shell: pwsh
        run: |
          $work='C:\b39w'; $out='C:\b39o'; $b38=Join-Path $work 'b38-base'
          node tooling/llm-api-bridges/ozon-seller/validation/PATCH_B38_FINANCE_LEDGER_READS_REGRESSION_2026-08-28.mjs $b38; if($LASTEXITCODE-ne 0){exit $LASTEXITCODE}
          node tooling/llm-api-bridges/ozon-seller/validation/PATCH_B39_FBS_PICKUP_GEOGRAPHY_READS_REGRESSION_2026-08-28.mjs $out; if($LASTEXITCODE-ne 0){exit $LASTEXITCODE}
          Get-ChildItem $out -Recurse -Filter *.js | ForEach-Object {node --check $_.FullName;if($LASTEXITCODE-ne 0){exit $LASTEXITCODE}}
