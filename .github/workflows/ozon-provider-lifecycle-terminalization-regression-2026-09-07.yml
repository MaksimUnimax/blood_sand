name: Ozon provider lifecycle terminalization regression 2026-09-07

on:
  push:
    branches:
      - repair/ozon-provider-lifecycle-terminalization-2026-09-07
  workflow_dispatch:

permissions:
  contents: read

env:
  DIST: tooling/llm-api-bridges/ozon-seller/dist-step7-candidate
  VALIDATION: tooling/llm-api-bridges/ozon-seller/validation/read-effect-repair-v1
  REGRESSION: tooling/llm-api-bridges/ozon-seller/validation/provider-lifecycle-terminalization-v1/run_provider_lifecycle_terminalization_gate.mjs

jobs:
  linux-full-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Syntax and exact lifecycle regression
        shell: bash
        run: |
          set -euo pipefail
          node --check "$DIST/service_worker.js"
          node --check "$DIST/shared/provider_transport_core.js"
          node "$REGRESSION"
      - name: Complete available read-effect regression family
        shell: bash
        run: |
          set -euo pipefail
          node "$VALIDATION/run_defect_015_date_repair_gate.mjs" .
          node "$VALIDATION/run_effect_read_repair_gate.mjs" .
          for gate in "$VALIDATION"/run_*.mjs; do node "$gate" .; done
          echo REG_P0_PROVIDER_LIFECYCLE_FINAL_LINUX_FULL_REGRESSION_PASS
      - name: Dependency and package boundary assertions
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(grep -nE 'void[[:space:]]+process(Manual|Auto)Batch' "$DIST/service_worker.js" || true)"
          grep -q '"alarms"' "$DIST/manifest.json"
          grep -q 'https://api-seller.ozon.ru/\*' "$DIST/manifest.json"
          grep -q 'https://api-performance.ozon.ru/\*' "$DIST/manifest.json"
          grep -Eq 'https://(\*\.)?ozon(e)?\.ru/\*' "$DIST/manifest.json"
          echo REG_P0_PROVIDER_LIFECYCLE_DEPENDENCY_BOUNDARY_PASS

  windows-regression:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Windows exact lifecycle regression
        shell: bash
        run: |
          set -euo pipefail
          node --check "$DIST/service_worker.js"
          node --check "$DIST/shared/provider_transport_core.js"
          node "$REGRESSION"
          node "$VALIDATION/run_defect_015_date_repair_gate.mjs" .
          node "$VALIDATION/run_effect_read_repair_gate.mjs" .
          node "$VALIDATION/run_report_file_lifecycle_gate.mjs" .
          node "$VALIDATION/run_report_file_session_fail_closed_gate.mjs" .
          node "$VALIDATION/run_report_file_workflow_gate.mjs" .
          node "$VALIDATION/run_report_xlsx_implicit_cell_ref_regression_2026-09-07.mjs" .
          echo REG_P0_PROVIDER_LIFECYCLE_FINAL_WINDOWS_REGRESSION_PASS

  package-exact-candidate:
    needs: [linux-full-regression, windows-regression]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Build deterministic exact candidate archive
        shell: bash
        run: |
          set -euo pipefail
          SHORT="${GITHUB_SHA:0:8}"
          NAME="OZON_BRIDGE_v0.1.19_PROVIDER_LIFECYCLE_TERMINALIZATION_${SHORT}.zip"
          export NAME
          python - <<'PY'
          import os, pathlib, zipfile, hashlib, shutil
          root = pathlib.Path('tooling/llm-api-bridges/ozon-seller/dist-step7-candidate')
          files = sorted(p for p in root.rglob('*') if p.is_file())
          if len(files) != 21:
              raise SystemExit(f'expected 21 production files, got {len(files)}')
          out = pathlib.Path(os.environ['NAME'])
          with zipfile.ZipFile(out, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for p in files:
                  rel = p.relative_to(root).as_posix()
                  info = zipfile.ZipInfo(rel, date_time=(1980,1,1,0,0,0))
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.external_attr = 0o100644 << 16
                  z.writestr(info, p.read_bytes())
          extract = pathlib.Path('fresh-extract')
          if extract.exists(): shutil.rmtree(extract)
          extract.mkdir()
          with zipfile.ZipFile(out) as z: z.extractall(extract)
          extracted = sorted(p for p in extract.rglob('*') if p.is_file())
          if [p.relative_to(extract).as_posix() for p in extracted] != [p.relative_to(root).as_posix() for p in files]:
              raise SystemExit('fresh extraction tree mismatch')
          for src, dst in zip(files, extracted):
              if src.read_bytes() != dst.read_bytes():
                  raise SystemExit(f'byte mismatch: {src}')
          digest = hashlib.sha256(out.read_bytes()).hexdigest()
          pathlib.Path('PACKAGE_VERIFICATION.txt').write_text(
              f'commit={os.environ["GITHUB_SHA"]}\nfile_count={len(files)}\nbytes={out.stat().st_size}\nsha256={digest}\n'
              'fresh_extract=PASS\nbyte_for_byte=PASS\n', encoding='utf-8')
          print('REG_P0_PROVIDER_LIFECYCLE_EXACT_PACKAGE_TREE_PASS')
          print('REG_P0_PROVIDER_LIFECYCLE_FRESH_EXTRACTION_PASS')
          print('REG_P0_PROVIDER_LIFECYCLE_BYTE_FOR_BYTE_PACKAGE_PASS')
          print(f'ARTIFACT={out}')
          print(f'BYTES={out.stat().st_size}')
          print(f'SHA256={digest}')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ozon-provider-lifecycle-terminalization-${{ github.sha }}
          path: |
            OZON_BRIDGE_v0.1.19_PROVIDER_LIFECYCLE_TERMINALIZATION_*.zip
            PACKAGE_VERIFICATION.txt
          if-no-files-found: error
          retention-days: 30
