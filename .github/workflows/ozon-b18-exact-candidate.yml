name: Ozon B18 Pricing Strategy Extended Reads exact candidate

on:
  push:
    branches:
      - feature/ozon-b18-pricing-strategy-extended-reads-2026-08-27
    paths:
      - .github/workflows/ozon-b18-exact-candidate.yml
      - tooling/llm-api-bridges/ozon-seller/validation/PATCH_B18_PRICING_STRATEGY_EXTENDED_READS_2026-08-27.patch.gz
      - tooling/llm-api-bridges/ozon-seller/validation/materialize_patch_b18_pricing_strategy_extended_reads_candidate.py
      - tooling/llm-api-bridges/ozon-seller/validation/PATCH_B18_PRICING_STRATEGY_EXTENDED_READS_REGRESSION_2026-08-27.mjs
      - tooling/llm-api-bridges/ozon-seller/validation/PATCH_B18_PRICING_STRATEGY_EXTENDED_READS_CANDIDATE_EVIDENCE_2026-08-27.md
      - tooling/llm-api-bridges/ozon-seller/validation/PATCH_B18_PRICING_STRATEGY_EXTENDED_READS_CANDIDATE_MANIFEST_2026-08-27.md

permissions:
  contents: read

jobs:
  linux-materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize exact B18 candidate
        run: python3 tooling/llm-api-bridges/ozon-seller/validation/materialize_patch_b18_pricing_strategy_extended_reads_candidate.py --repo-root . --work-root /tmp/ozon-b18-work --out /tmp/ozon-b18-exact
      - name: Verify exact B17 base and B18 gates
        run: |
          node tooling/llm-api-bridges/ozon-seller/validation/PATCH_B17_REVIEWS_QUESTIONS_EXTENDED_READS_REGRESSION_2026-08-27.mjs /tmp/ozon-b18-work/b17-base
          node tooling/llm-api-bridges/ozon-seller/validation/PATCH_B18_PRICING_STRATEGY_EXTENDED_READS_REGRESSION_2026-08-27.mjs /tmp/ozon-b18-exact
          find /tmp/ozon-b18-exact -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Record exact identities
        run: |
          cd /tmp/ozon-b18-exact
          find . -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/ozon-b18-exact-files.sha256
          sha256sum shared/ozon_operation_registry.js shared/ozon_contract.js shared/ozon_entitlements.js service_worker.js content_script.js > /tmp/ozon-b18-core.sha256
      - name: Upload exact B18 candidate
        uses: actions/upload-artifact@v4
        with:
          name: ozon-b18-pricing-strategy-extended-reads-candidate
          path: |
            /tmp/ozon-b18-exact
            /tmp/ozon-b18-exact-files.sha256
            /tmp/ozon-b18-core.sha256
          if-no-files-found: error
          retention-days: 3

  windows-materialize:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify B18 patch transport identity
        shell: pwsh
        run: |
          python -c "import gzip,hashlib,pathlib; p=pathlib.Path('tooling/llm-api-bridges/ozon-seller/validation/PATCH_B18_PRICING_STRATEGY_EXTENDED_READS_2026-08-27.patch.gz'); c=p.read_bytes(); assert hashlib.sha256(c).hexdigest()=='fa25cda2f81db2fc0a969a40bc6469c4dc645d494be69c4986cef0566e16b834'; b=gzip.decompress(c); assert hashlib.sha256(b).hexdigest()=='5900c5e7d2b4080505ff39d5bfb6d07025592817760635aa3aa813cbddae85a6'"
      - name: Materialize exact B18 candidate on Windows
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP "ozon-b18-work"
          $out = Join-Path $env:RUNNER_TEMP "ozon-b18-exact"
          python tooling/llm-api-bridges/ozon-seller/validation/materialize_patch_b18_pricing_strategy_extended_reads_candidate.py --repo-root . --work-root $work --out $out
      - name: Verify exact B17 base and B18 gates on Windows
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "ozon-b18-exact"
          $work = Join-Path $env:RUNNER_TEMP "ozon-b18-work"
          $b17 = Join-Path $work "b17-base"
          node tooling/llm-api-bridges/ozon-seller/validation/PATCH_B17_REVIEWS_QUESTIONS_EXTENDED_READS_REGRESSION_2026-08-27.mjs $b17; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tooling/llm-api-bridges/ozon-seller/validation/PATCH_B18_PRICING_STRATEGY_EXTENDED_READS_REGRESSION_2026-08-27.mjs $out; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem -Path $out -Recurse -Filter *.js | ForEach-Object { node --check $_.FullName; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
