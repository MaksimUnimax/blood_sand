name: Ozon Step7 exact authority bootstrap

on:
  push:
    branches:
      - repair/ozon-step7-exact-swagger-authority-v2-upload-staging-2026-08-31
    paths:
      - .github/workflows/ozon-step7-authority-bootstrap.yml
      - tooling/llm-api-bridges/ozon-seller/validation/step7-authority-v2/upload-parts/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ozon-step7-authority-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  assemble-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      AUTHORITY_ROOT: tooling/llm-api-bridges/ozon-seller/validation/step7-authority-v2
      EXPECTED_RAW_SHA256: 39e053a147180d1df4ded6ed0272aaaf02dd6a371144d8ebed7113fd218e4b40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assemble exact fragments 30-38
        shell: bash
        run: |
          set -euo pipefail
          root="$AUTHORITY_ROOT"
          fragments="$root/fragments"
          upload="$root/upload-parts"
          for n in $(seq 30 37); do
            id=$(printf '%04d' "$n")
            cat "$upload/part${id}.a" "$upload/part${id}.b" > "$fragments/seller-swagger-2026-08-25.json.xz.b64.part${id}.txt"
          done
          cat "$upload/part0038.a" > "$fragments/seller-swagger-2026-08-25.json.xz.b64.part0038.txt"
          test "$(find "$fragments" -maxdepth 1 -type f -name 'seller-swagger-2026-08-25.json.xz.b64.part*.txt' | wc -l)" = 38
      - name: Require exact 463-operation authority and fail-closed transport
        shell: bash
        run: |
          set -euo pipefail
          root="$AUTHORITY_ROOT"
          out="$RUNNER_TEMP/step7-bootstrap"
          rm -rf "$out"
          mkdir -p "$out"
          python3 "$root/reconstruct_exact_swagger.py" --output "$out/seller-swagger.json" --json-output "$out/authority-report.json"
          python3 "$root/test_fail_closed.py" --root "$root" | tee "$out/fail-closed.log"
          test "$(stat -c%s "$out/seller-swagger.json")" = 3933043
          test "$(sha256sum "$out/seller-swagger.json" | awk '{print $1}')" = "$EXPECTED_RAW_SHA256"
          grep -q '"operation_count": 463' "$out/authority-report.json"
          grep -q '"path_count": 463' "$out/authority-report.json"
      - name: Replace upload parts with verified fragments
        shell: bash
        run: |
          set -euo pipefail
          root="$AUTHORITY_ROOT"
          rm -rf "$root/upload-parts"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A "$root"
          git commit -m 'chore(ozon): assemble exact Step7 authority fragments 30-38'
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo STEP7_AUTHORITY_BOOTSTRAP_PASS
