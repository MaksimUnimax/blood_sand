name: Ozon B37 FBO Removal Report Reads exact candidate
on:
  push:
    branches: [feature/ozon-b37-fbo-removal-report-reads-2026-08-28]
    paths:
      - .github/workflows/ozon-b37-exact-candidate.yml
      - tooling/llm-api-bridges/ozon-seller/validation/PATCH_B37_FBO_REMOVAL_REPORT_READS_2026-08-28.patch.gz
      - tooling/llm-api-bridges/ozon-seller/validation/materialize_patch_b37_fbo_removal_report_reads_candidate.py
      - tooling/llm-api-bridges/ozon-seller/validation/PATCH_B37_FBO_REMOVAL_REPORT_READS_REGRESSION_2026-08-28.mjs
      - tooling/llm-api-bridges/ozon-seller/validation/PATCH_B37_FBO_REMOVAL_REPORT_READS_CANDIDATE_EVIDENCE_2026-08-28.md
      - tooling/llm-api-bridges/ozon-seller/validation/PATCH_B37_FBO_REMOVAL_REPORT_READS_CANDIDATE_MANIFEST_2026-08-28.md
permissions: {contents: read}
jobs:
  linux-materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify B37 patch transport identity
        run: python3 -c "import gzip,hashlib,pathlib;p=pathlib.Path('tooling/llm-api-bridges/ozon-seller/validation/PATCH_B37_FBO_REMOVAL_REPORT_READS_2026-08-28.patch.gz');c=p.read_bytes();assert hashlib.sha256(c).hexdigest()=='6c7729ca9bc6dc08c24658ce728c09ae76dd0d16e167f051eb9f7a867605b773';assert hashlib.sha256(gzip.decompress(c)).hexdigest()=='09e5ca64de77b0b2e3bb9c7f2fb1a434724963ca8fb17d53579f48b6fad67995'"
      - name: Materialize exact B37 candidate
        run: python3 tooling/llm-api-bridges/ozon-seller/validation/materialize_patch_b37_fbo_removal_report_reads_candidate.py --repo-root . --work-root /tmp/ozon-b37-work --out /tmp/ozon-b37-exact
      - name: Verify B36 base and B37 gates
        run: |
          node tooling/llm-api-bridges/ozon-seller/validation/PATCH_B36_FBP_PLANNING_READS_REGRESSION_2026-08-28.mjs /tmp/ozon-b37-work/b36-base
          node tooling/llm-api-bridges/ozon-seller/validation/PATCH_B37_FBO_REMOVAL_REPORT_READS_REGRESSION_2026-08-28.mjs /tmp/ozon-b37-exact
          find /tmp/ozon-b37-exact -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - uses: actions/upload-artifact@v4
        with: {name: ozon-b37-fbo-removal-report-reads-candidate, path: /tmp/ozon-b37-exact, if-no-files-found: error, retention-days: 3}
  windows-materialize:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable Git long paths
        shell: pwsh
        run: git config --global core.longpaths true
      - name: Verify B37 patch transport identity
        shell: pwsh
        run: python -c "import gzip,hashlib,pathlib;p=pathlib.Path('tooling/llm-api-bridges/ozon-seller/validation/PATCH_B37_FBO_REMOVAL_REPORT_READS_2026-08-28.patch.gz');c=p.read_bytes();assert hashlib.sha256(c).hexdigest()=='6c7729ca9bc6dc08c24658ce728c09ae76dd0d16e167f051eb9f7a867605b773';assert hashlib.sha256(gzip.decompress(c)).hexdigest()=='09e5ca64de77b0b2e3bb9c7f2fb1a434724963ca8fb17d53579f48b6fad67995'"
      - name: Materialize exact B37 candidate
        shell: pwsh
        run: |
          $work='C:\b37w'; $out='C:\b37o'
          python tooling/llm-api-bridges/ozon-seller/validation/materialize_patch_b37_fbo_removal_report_reads_candidate.py --repo-root . --work-root $work --out $out
      - name: Verify B36 base and B37 gates
        shell: pwsh
        run: |
          $work='C:\b37w'; $out='C:\b37o'; $b36=Join-Path $work 'b36-base'
          node tooling/llm-api-bridges/ozon-seller/validation/PATCH_B36_FBP_PLANNING_READS_REGRESSION_2026-08-28.mjs $b36; if($LASTEXITCODE-ne 0){exit $LASTEXITCODE}
          node tooling/llm-api-bridges/ozon-seller/validation/PATCH_B37_FBO_REMOVAL_REPORT_READS_REGRESSION_2026-08-28.mjs $out; if($LASTEXITCODE-ne 0){exit $LASTEXITCODE}
          Get-ChildItem $out -Recurse -Filter *.js | ForEach-Object {node --check $_.FullName;if($LASTEXITCODE-ne 0){exit $LASTEXITCODE}}
