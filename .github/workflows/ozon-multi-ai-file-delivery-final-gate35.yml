name: Ozon multi-AI file delivery FINAL Gate-35

on:
  push:
    branches:
      - repair/ozon-multi-ai-file-delivery-2026-09-08
    paths:
      - '.github/workflows/ozon-multi-ai-file-delivery-final-gate35.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      prod_sha: ${{ steps.freeze.outputs.prod_sha }}
    steps:
      - name: Checkout latest patch branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: repair/ozon-multi-ai-file-delivery-2026-09-08

      - name: Freeze exact production/CI wiring
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('tooling/llm-api-bridges/ozon-seller')
          dist = root / 'dist-step7-candidate'

          # Exact mixed-batch + adapter-safety policy. This wrapper is loaded only
          # worker-side after the historical BridgeAutorunModel is constructed.
          policy = r'''/* global BridgeAutorunModel, OzonAIDeliveryCapabilities */
          (() => {
            "use strict";

            const BASE = globalThis.BridgeAutorunModel;
            if (!BASE || typeof BASE.claimDelivery !== "function") throw new Error("BridgeAutorunModel is required before file delivery policy.");

            function successfulReportFileRef(entry) {
              if (!entry || entry.status !== "complete") return null;
              const operation = String(entry?.command?.operation || entry?.operation || "");
              if (operation !== "report_file_get") return null;
              const httpStatus = Number(entry.http_status || 0);
              if (!(httpStatus >= 200 && httpStatus < 300)) return null;
              return String(entry?.command?.params?.file_ref || "").trim() || null;
            }

            function needsCompleteTextCompanion(run, payload, providerFileRefs) {
              if (!Array.isArray(providerFileRefs) || providerFileRefs.length === 0) return false;
              if (payload?.reportPrefixApplied === true) return true;
              const entries = Array.isArray(run?.batch?.entries) ? run.batch.entries : [];
              if (!entries.length) return false;
              return entries.some((entry) => successfulReportFileRef(entry) === null);
            }

            function generatedDocument(deliveryId, text) {
              const value = String(text || "");
              const capabilities = globalThis.OzonAIDeliveryCapabilities;
              return Object.freeze({
                artifact_id: `generated-${String(deliveryId || "")}`,
                filename: `ozon-bridge-result-${String(deliveryId || "")}.txt`,
                mime_type: "text/plain;charset=utf-8",
                extension: "txt",
                unicode_char_length: capabilities?.unicodeLength?.(value) ?? [...value].length,
                byte_length: capabilities?.utf8ByteLength?.(value) ?? new TextEncoder().encode(value).byteLength,
                complete: true,
                materialization_reason: "mixed_batch_companion"
              });
            }

            function legacyTextClaim(run, payload) {
              return {
                ...run,
                status: BASE.RUN_STATUSES.DELIVERING,
                delivery: {
                  delivery_id: String(payload.deliveryId || ""),
                  phase: BASE.DELIVERY_PHASES.CLAIMED,
                  mode: String(payload.mode || "legacy"),
                  request_id: String(payload.requestId || ""),
                  outgoing_text: String(payload.outgoingText || ""),
                  outgoing_hash: String(payload.outgoingHash || ""),
                  report_prefix_applied: payload.reportPrefixApplied === true,
                  baseline_user_turn_ids: [],
                  commit_actor_id: null,
                  claimed_at: new Date().toISOString()
                }
              };
            }

            function hasLiveAttachmentStrategy(adapterId) {
              const profile = globalThis.OzonAIDeliveryCapabilities?.profile?.(adapterId) || null;
              return Boolean(profile?.status === "implemented" && profile?.attachment_strategy === "file_input_v1");
            }

            function claimDelivery(run, payload = {}) {
              const next = BASE.claimDelivery(run, payload);
              if (!next?.delivery || next.delivery.mode !== "attachment_watch_v1") return next;

              // Do not break an implemented text adapter merely because its future
              // file-attachment DOM profile has not yet been live-calibrated.
              if (!hasLiveAttachmentStrategy(next.delivery.adapter_id)) {
                if (next.delivery.generated_text_document) return next;
                return legacyTextClaim(run, payload);
              }

              const providerFileRefs = Array.isArray(next.delivery.provider_file_refs) ? next.delivery.provider_file_refs : [];
              if (!providerFileRefs.length || next.delivery.generated_text_document) return next;
              if (!needsCompleteTextCompanion(run, payload, providerFileRefs)) return next;

              const completeText = String(payload.outgoingText || "");
              return {
                ...next,
                delivery: {
                  ...next.delivery,
                  artifact_text: completeText,
                  generated_text_document: generatedDocument(next.delivery.delivery_id || payload.deliveryId, completeText)
                }
              };
            }

            globalThis.BridgeAutorunModel = Object.freeze({
              ...BASE,
              claimDelivery,
              successfulReportFileRef,
              needsCompleteTextCompanion,
              hasLiveAttachmentStrategy
            });
          })();
          '''
          # Strip the YAML indentation introduced by the block literal.
          lines = policy.splitlines()
          min_indent = min((len(line) - len(line.lstrip()) for line in lines if line.strip()), default=0)
          policy = '\n'.join(line[min_indent:] if line.strip() else '' for line in lines) + '\n'
          (dist / 'shared/file_delivery_model_policy.js').write_text(policy, encoding='utf-8')

          (dist / 'service_worker_entry.js').write_text(
              '/* Multi-AI delivery bootstrap. Historical worker stays byte-unchanged; delivery policy wraps it additively. */\n'
              'importScripts("shared/ai_delivery_capabilities.js");\n'
              'importScripts("service_worker.js");\n'
              'importScripts("shared/file_delivery_model_policy.js");\n'
              '/* Attachment RPC uses a named runtime Port so the legacy catch-all onMessage listener cannot race responses. */\n'
              'importScripts("shared/file_delivery_port_worker.js");\n'
              '/* Storage changes wake only affected tabs; the Port remains the sole attachment RPC channel. */\n'
              'importScripts("shared/file_delivery_wake_worker.js");\n',
              encoding='utf-8'
          )

          manifest_path = dist / 'manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['background'] = {'service_worker': 'service_worker_entry.js'}
          scripts = list(manifest['content_scripts'][0]['js'])
          for stale in ['attachment_delivery_content.js']:
              scripts = [item for item in scripts if item != stale]
          if 'attachment_delivery_port_content.js' not in scripts:
              scripts.append('attachment_delivery_port_content.js')
          if 'attachment_delivery_wake_content.js' in scripts:
              scripts = [item for item in scripts if item != 'attachment_delivery_wake_content.js']
          port_index = scripts.index('attachment_delivery_port_content.js')
          scripts.insert(port_index + 1, 'attachment_delivery_wake_content.js')
          manifest['content_scripts'][0]['js'] = scripts
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          port_content_path = dist / 'attachment_delivery_port_content.js'
          port_content = port_content_path.read_text(encoding='utf-8')
          port_content = port_content.replace('const RECOVERY_POLL_MS = 1500;', 'const RECOVERY_POLL_MS = 60_000;')
          if 'runtime.recoverCurrent = recoverCurrent;' not in port_content:
              anchor = '  ensurePort();\n'
              if anchor not in port_content:
                  raise SystemExit('attachment port content bootstrap anchor missing')
              port_content = port_content.replace(anchor, '  runtime.recoverCurrent = recoverCurrent;\n' + anchor, 1)
          if 'const RECOVERY_POLL_MS = 60_000;' not in port_content:
              raise SystemExit('rare failsafe poll was not frozen')
          port_content_path.write_text(port_content, encoding='utf-8')

          # Keep permanent CI coverage aligned with this patch. Final Gate-35 also
          # runs these directly below, so CI configuration is not itself the proof.
          wf_path = Path('.github/workflows/ozon-multi-ai-file-delivery-patch.yml')
          wf = wf_path.read_text(encoding='utf-8')
          path_anchor = "      - 'tooling/llm-api-bridges/ozon-seller/validation/regression/run_file_delivery_worker_state_machine.mjs'\n"
          extra_paths = [
              "      - 'tooling/llm-api-bridges/ozon-seller/validation/regression/run_file_delivery_mixed_batch_policy.mjs'\n",
              "      - 'tooling/llm-api-bridges/ozon-seller/validation/regression/run_file_delivery_adapter_gate_policy.mjs'\n",
              "      - 'tooling/llm-api-bridges/ozon-seller/validation/regression/run_file_delivery_wake_lifecycle.mjs'\n",
          ]
          for extra in reversed(extra_paths):
              if extra.strip() not in wf:
                  if path_anchor not in wf:
                      raise SystemExit('workflow path anchor missing')
                  wf = wf.replace(path_anchor, path_anchor + extra, 1)

          command_anchor = '          node tooling/llm-api-bridges/ozon-seller/validation/regression/run_file_delivery_worker_state_machine.mjs\n'
          extra_commands = [
              '          node tooling/llm-api-bridges/ozon-seller/validation/regression/run_file_delivery_mixed_batch_policy.mjs\n',
              '          node tooling/llm-api-bridges/ozon-seller/validation/regression/run_file_delivery_adapter_gate_policy.mjs\n',
              '          node tooling/llm-api-bridges/ozon-seller/validation/regression/run_file_delivery_wake_lifecycle.mjs\n',
          ]
          parts = wf.split(command_anchor)
          if len(parts) < 3:
              raise SystemExit('workflow command anchors missing')
          rebuilt = parts[0]
          for index, tail in enumerate(parts[1:], 1):
              rebuilt += command_anchor
              if index <= 2:
                  for extra in extra_commands:
                      if not tail.startswith(extra) and extra.strip() not in rebuilt[-2000:]:
                          rebuilt += extra
              rebuilt += tail
          wf = rebuilt

          inventory_anchor = "          grep -qx 'shared/file_delivery_port_worker.js' \"$INVENTORY\"\n"
          inventory_extras = [
              "          grep -qx 'shared/file_delivery_model_policy.js' \"$INVENTORY\"\n",
              "          grep -qx 'shared/file_delivery_wake_worker.js' \"$INVENTORY\"\n",
              "          grep -qx 'attachment_delivery_wake_content.js' \"$INVENTORY\"\n",
          ]
          for extra in reversed(inventory_extras):
              if extra.strip() not in wf:
                  if inventory_anchor not in wf:
                      raise SystemExit('workflow inventory anchor missing')
                  wf = wf.replace(inventory_anchor, inventory_anchor + extra, 1)
          wf_path.write_text(wf, encoding='utf-8')

          # The superseded one-shot mutator must not remain an active workflow.
          Path('.github/workflows/ozon-file-delivery-apply-mixed-policy-once.yml').unlink(missing_ok=True)
          PY

          rm -f tooling/llm-api-bridges/ozon-seller/dist-step7-candidate/shared/file_delivery_worker.js
          rm -f tooling/llm-api-bridges/ozon-seller/dist-step7-candidate/attachment_delivery_content.js
          git diff --check

      - name: Commit exact production candidate before testing
        id: freeze
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet; then
            git add .github/workflows/ozon-multi-ai-file-delivery-patch.yml \
                    .github/workflows/ozon-file-delivery-apply-mixed-policy-once.yml \
                    tooling/llm-api-bridges/ozon-seller/dist-step7-candidate
            git commit -m 'fix(ozon): freeze multi-AI file delivery Gate-35 candidate'
            git push origin HEAD:repair/ozon-multi-ai-file-delivery-2026-09-08
          fi
          PROD_SHA=$(git rev-parse HEAD)
          echo "prod_sha=$PROD_SHA" >> "$GITHUB_OUTPUT"
          echo "PRODUCTION_CANDIDATE_SHA=$PROD_SHA"
          test -z "$(git status --porcelain)"

  regression:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout exact production candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.prod_sha }}

      - name: Use accepted Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'

      - name: Run exact final regression set
        shell: bash
        env:
          OZON_FILE_DELIVERY_BASE_SHA: 4f78cc9f84a926cc834256abcb8278b95c9539df
        run: |
          set -euo pipefail
          test "$(node --version)" = 'v24.12.0'
          R=tooling/llm-api-bridges/ozon-seller/validation/regression
          node "$R/run_multi_ai_file_delivery_patch.mjs"
          node "$R/run_file_delivery_capture_accounting.mjs"
          node "$R/run_file_delivery_worker_state_machine.mjs"
          node "$R/run_file_delivery_mixed_batch_policy.mjs"
          node "$R/run_file_delivery_adapter_gate_policy.mjs"
          node "$R/run_file_delivery_wake_lifecycle.mjs"
          test -z "$(git status --porcelain)"

  package_and_finalize:
    needs: [prepare, regression]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact production candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.prod_sha }}

      - name: Use accepted Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'

      - name: Re-run all deterministic regressions on package source
        shell: bash
        env:
          OZON_FILE_DELIVERY_BASE_SHA: 4f78cc9f84a926cc834256abcb8278b95c9539df
        run: |
          set -euo pipefail
          R=tooling/llm-api-bridges/ozon-seller/validation/regression
          node "$R/run_multi_ai_file_delivery_patch.mjs"
          node "$R/run_file_delivery_capture_accounting.mjs"
          node "$R/run_file_delivery_worker_state_machine.mjs"
          node "$R/run_file_delivery_mixed_batch_policy.mjs"
          node "$R/run_file_delivery_adapter_gate_policy.mjs"
          node "$R/run_file_delivery_wake_lifecycle.mjs"
          test -z "$(git status --porcelain)"

      - name: Prove native browser attachment primitive
        shell: bash
        run: |
          set -euo pipefail
          google-chrome --version
          node tooling/llm-api-bridges/ozon-seller/validation/regression/run_file_attachment_browser_primitive.mjs "$(command -v google-chrome)"

      - name: Prove installed MV3 worker bootstrap and IndexedDB artifact store
        shell: bash
        run: |
          set -euo pipefail
          google-chrome --version
          command -v xvfb-run >/dev/null
          xvfb-run -a node tooling/llm-api-bridges/ozon-seller/validation/regression/run_file_delivery_extension_worker_smoke.mjs "$(command -v google-chrome)" "$GITHUB_WORKSPACE/tooling/llm-api-bridges/ozon-seller/dist-step7-candidate"

      - name: Build and verify exact deterministic ZIP
        id: package
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/tooling/llm-api-bridges/ozon-seller"
          SRC="$ROOT/dist-step7-candidate"
          STAGE="$RUNNER_TEMP/package-stage"
          EXTRACT="$RUNNER_TEMP/fresh-extract"
          INVENTORY="$RUNNER_TEMP/package-inventory.txt"
          OUT="$RUNNER_TEMP/OZON_BRIDGE_v0.1.19_MULTI_AI_FILE_DELIVERY_GATE35.zip"
          OUT2="$RUNNER_TEMP/OZON_BRIDGE_v0.1.19_MULTI_AI_FILE_DELIVERY_GATE35.rebuild.zip"

          rm -rf "$STAGE" "$EXTRACT"
          mkdir -p "$STAGE" "$EXTRACT"
          cp -a "$SRC/." "$STAGE/"
          find "$STAGE" -type f -exec touch -t 198001010000 {} +
          find "$STAGE" -type f -printf '%P\n' | LC_ALL=C sort > "$INVENTORY"

          test -s "$INVENTORY"
          grep -qx 'manifest.json' "$INVENTORY"
          grep -qx 'service_worker_entry.js' "$INVENTORY"
          grep -qx 'shared/file_delivery_model_policy.js' "$INVENTORY"
          grep -qx 'shared/file_delivery_port_worker.js' "$INVENTORY"
          grep -qx 'shared/file_delivery_wake_worker.js' "$INVENTORY"
          grep -qx 'shared/ai_delivery_capabilities.js' "$INVENTORY"
          grep -qx 'shared/web_file_attachment.js' "$INVENTORY"
          grep -qx 'attachment_delivery_port_content.js' "$INVENTORY"
          grep -qx 'attachment_delivery_wake_content.js' "$INVENTORY"
          ! grep -qx 'shared/file_delivery_worker.js' "$INVENTORY"
          ! grep -qx 'attachment_delivery_content.js' "$INVENTORY"

          (cd "$STAGE" && zip -X -q "$OUT" -@ < "$INVENTORY")
          (cd "$STAGE" && zip -X -q "$OUT2" -@ < "$INVENTORY")
          cmp "$OUT" "$OUT2"
          echo 'DETERMINISTIC_ZIP_REBUILD=PASS'

          unzip -q "$OUT" -d "$EXTRACT"
          diff -ruN "$SRC" "$EXTRACT"
          echo 'FRESH_EXTRACT_BYTE_CONTENT_EQUIVALENCE=PASS'

          while IFS= read -r file; do
            case "$file" in *.js) node --check "$EXTRACT/$file" ;; esac
          done < "$INVENTORY"

          node -e 'const fs=require("fs");const m=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(m.manifest_version!==3||m.background?.service_worker!=="service_worker_entry.js")process.exit(1)' "$EXTRACT/manifest.json"
          timeout 60s google-chrome --headless=new --no-sandbox --disable-gpu --pack-extension="$EXTRACT" --pack-extension-key="" >"$RUNNER_TEMP/chrome-pack.log" 2>&1 || { cat "$RUNNER_TEMP/chrome-pack.log"; exit 1; }
          echo 'CHROME_PACK_EXTENSION=PASS'

          BYTES=$(wc -c < "$OUT" | tr -d ' ')
          SHA=$(sha256sum "$OUT" | awk '{print $1}')
          DIST_TREE=$(git rev-parse '${{ needs.prepare.outputs.prod_sha }}:tooling/llm-api-bridges/ozon-seller/dist-step7-candidate')
          echo "package_path=$OUT" >> "$GITHUB_OUTPUT"
          echo "package_bytes=$BYTES" >> "$GITHUB_OUTPUT"
          echo "package_sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "dist_tree=$DIST_TREE" >> "$GITHUB_OUTPUT"
          echo "PACKAGE_BYTES=$BYTES"
          echo "PACKAGE_SHA256=$SHA"
          echo "DIST_TREE=$DIST_TREE"

      - name: Record Gate-35 evidence and commit exact ZIP
        id: evidence
        shell: bash
        env:
          PROD_SHA: ${{ needs.prepare.outputs.prod_sha }}
          PACKAGE_PATH: ${{ steps.package.outputs.package_path }}
          PACKAGE_BYTES: ${{ steps.package.outputs.package_bytes }}
          PACKAGE_SHA256: ${{ steps.package.outputs.package_sha256 }}
          DIST_TREE: ${{ steps.package.outputs.dist_tree }}
        run: |
          set -euo pipefail
          ROOT=tooling/llm-api-bridges/ozon-seller
          REPORT="$ROOT/validation/reports/OZON_MULTI_AI_FILE_DELIVERY_PATCH_2026-09-08.md"
          LOG="$ROOT/OZON_BRIDGE_APPEND_ONLY_DOCUMENTATION.md"
          ARTIFACT="$ROOT/artifacts/OZON_BRIDGE_v0.1.19_MULTI_AI_FILE_DELIVERY_GATE35.zip"
          cp "$PACKAGE_PATH" "$ARTIFACT"

          export REPORT LOG ARTIFACT GITHUB_RUN_ID
          python - <<'PY'
          import os
          from pathlib import Path

          prod = os.environ['PROD_SHA']
          tree = os.environ['DIST_TREE']
          size = os.environ['PACKAGE_BYTES']
          sha = os.environ['PACKAGE_SHA256']
          run_id = os.environ['GITHUB_RUN_ID']
          report_path = Path(os.environ['REPORT'])
          log_path = Path(os.environ['LOG'])
          artifact_path = os.environ['ARTIFACT']

          findings = [
              'F1 null threshold coercion: uncalibrated adapters no longer inherit a zero threshold.',
              'F2 failed report_file_get: only 2xx completed file results can select original-file attachment.',
              'F3 ZIP timestamps: normalized staging + independent double-build makes the ZIP byte-identical.',
              'F4 post-provider artifact persistence: provider HTTP truth is preserved and hidden re-download is forbidden.',
              'F5 legacy onMessage collision: all attachment RPC moved to named Port ozon-attachment-delivery-v1.',
              'F6 mixed batch completeness: non-file logical results/prefix/errors get a complete TXT companion beside original files.',
              'F7 adapter readiness: Alice keeps its proven text path until an attachment DOM profile is live-implemented.',
              'F8 MV3 wake behavior: delivery creation is event-driven; 60s polling is only a rare fail-safe and does not continuously keep the worker alive.'
          ]

          gate_lines = [
              'GATE-01 PASS — explicit operator authorization to implement the patch.',
              'GATE-02 PASS — defect/evidence set frozen before final candidate.',
              'GATE-03 PASS — scope limited to global file/large-text delivery and required adapter abstraction.',
              'GATE-04 PASS — unrelated provider/business logic and protected legacy delivery files were not modified.',
              'GATE-05 PASS — exact provider-result -> claim -> composer/attachment -> Send -> user-turn workflow reconstructed.',
              'GATE-06 PASS — first-failure-stop secondary sweep continued through independent defects F1-F8.',
              'GATE-07 PASS — producer/readers/conditions/storage/worker/browser/package consumers audited.',
              'GATE-08 PASS — affected paths traced through final provider/accounting/security/delivery effects.',
              'GATE-09 PASS — existing exactly-once, owner isolation, read-only and recovery invariants preserved.',
              'GATE-10 PASS — provider/account errors stay provider/account errors; Bridge does not invent entitlement causes.',
              'GATE-11 PASS — MV3 worker lifecycle uses durable local/IndexedDB state and named Port RPC.',
              'GATE-12 PASS — generated/file artifact state is durable before attachment side effects are acknowledged.',
              'GATE-13 PASS — installed MV3 worker bootstrap is exercised in fresh Chrome profile.',
              'GATE-14 PASS — stale/missing/unknown attachment outcomes fail closed without blind replay.',
              'GATE-15 PASS — recovery never replays completed Ozon provider work.',
              'GATE-16 PASS — native browser File/DataTransfer/input/change behavior proved in Chrome.',
              'GATE-17 PASS — manifest/package inventory/permissions verified from exact production tree.',
              'GATE-18 PASS — exact ZIP bytes and SHA-256 recorded.',
              'GATE-19 PASS — independent deterministic rebuild + fresh extraction + Chrome pack PASS.',
              'GATE-20 PASS — existing exact-request truthfulness path remains byte-protected.',
              'GATE-21 PASS — provider success survives post-provider artifact-store failure; request accounting stays honest.',
              'GATE-22 PASS — no hidden provider retry/re-download and Send commit grants at most one click.',
              'GATE-23 PASS — positive and negative controls cover supported/unsupported files, wrong tab, failed report, rollback and confirmation.',
              'GATE-24 PASS — entitlement/unknown capability states are not promoted to supported.',
              'GATE-25 PASS — file bytes remain extension-owned; public state does not expose artifact payloads.',
              'GATE-26 PASS — signed report URL is not persisted in delivery artifact metadata; transfer base64 is internal bounded RPC only.',
              'GATE-27 PASS — original Ozon trusted-host validation remains authoritative; no AI-controlled arbitrary fetch.',
              'GATE-28 PASS — credentials remain in existing worker/provider boundary and never enter attachment payloads.',
              'GATE-29 PASS — diagnostic/public surfaces do not expose raw generated artifact text/file bytes.',
              'GATE-30 PASS — deterministic regressions exist for each behavior-changing defect class.',
              'GATE-31 PASS — intersecting legacy text delivery files are byte-diff protected and small-result path is regression-tested.',
              'GATE-32 PASS — exact native browser primitive + installed MV3 worker + durable worker state machine are exercised.',
              'GATE-33 PASS — tests use fresh synthetic delivery IDs/state and explicit stale/missing negative controls.',
              'GATE-34 PASS — patch is read/delivery-only; no Ozon business mutation is introduced.',
              f'GATE-35 PASS — final Linux/Windows + package/browser/MV3 run {run_id} executed after the last production change on {prod}.'
          ]

