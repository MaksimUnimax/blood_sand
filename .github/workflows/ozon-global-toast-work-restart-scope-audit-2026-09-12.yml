name: Ozon global plaque + Work restart staged diff scope audit
run-name: Ozon staged diff scope audit · ${{ github.ref_name }} · ${{ github.sha }}

on:
  push:
    branches: [repair/ozon-global-toast-work-restart-2026-09-11]
    paths:
      - '.github/workflows/ozon-global-toast-work-restart-scope-audit-2026-09-12.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ROOT: tooling/llm-api-bridges/ozon-seller
  DIST: tooling/llm-api-bridges/ozon-seller/dist-step7-candidate
  GATE: tooling/llm-api-bridges/ozon-seller/validation/global-toast-work-restart-v1

jobs:
  scope-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Decode exact staged patch and prove file set
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/audit"
          python3 - "$GATE/production.patch.gz.b64" "$RUNNER_TEMP/audit/production.patch" <<'PY'
          import base64, gzip, hashlib, pathlib, sys
          source, target = map(pathlib.Path, sys.argv[1:3])
          raw = b''.join(source.read_bytes().split())
          compressed = base64.b64decode(raw, validate=True)
          decoded = gzip.decompress(compressed)
          target.write_bytes(decoded)
          print(f'PATCH_DECODE_PASS bytes={len(decoded)} sha256={hashlib.sha256(decoded).hexdigest()}')
          PY
          sed -n 's#^+++ b/##p' "$RUNNER_TEMP/audit/production.patch" | sort -u | tee "$RUNNER_TEMP/audit/PATCH_PATHS.txt"
          cat > "$RUNNER_TEMP/audit/EXPECTED_PATHS.txt" <<'EOF'
          attachment_delivery_port_content.js
          attachment_delivery_wake_content.js
          content_script.js
          service_worker.js
          EOF
          diff -u "$RUNNER_TEMP/audit/EXPECTED_PATHS.txt" "$RUNNER_TEMP/audit/PATCH_PATHS.txt"
          git -C "$DIST" apply --check "$RUNNER_TEMP/audit/production.patch"
          git -C "$DIST" apply "$RUNNER_TEMP/audit/production.patch"
          git -C "$DIST" diff --check
          git -C "$DIST" diff -- attachment_delivery_port_content.js > "$RUNNER_TEMP/audit/attachment_delivery_port_content.diff"
          git -C "$DIST" diff -- attachment_delivery_wake_content.js > "$RUNNER_TEMP/audit/attachment_delivery_wake_content.diff"
          git -C "$DIST" diff -- content_script.js > "$RUNNER_TEMP/audit/content_script.diff"
          git -C "$DIST" diff -- service_worker.js > "$RUNNER_TEMP/audit/service_worker.diff"
          echo '--- dependency markers ---'
          grep -E '^\+.*(idle|wake|recovery|ATTACHMENT_PORT|OZ_ATTACHMENT|WORK_START|pending|intent|revision|watch|outcome|ACTIVE_VISIBLE|send_outcome)' "$RUNNER_TEMP/audit/"*.diff || true
          echo 'STAGED_PATCH_FOUR_FILE_SCOPE_AUDIT_READY=YES'
      - uses: actions/upload-artifact@v4
        with:
          name: ozon-global-toast-work-restart-staged-diff-audit
          path: ${{ runner.temp }}/audit
          if-no-files-found: error
          retention-days: 7
