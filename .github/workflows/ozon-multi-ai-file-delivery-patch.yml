name: Ozon multi-AI file delivery patch

on:
  push:
    branches:
      - repair/ozon-multi-ai-file-delivery-2026-09-08
      - repair/ozon-generic-direct-binary-delivery-2026-09-08
    paths:
      - '.github/workflows/ozon-multi-ai-file-delivery-patch.yml'
      - 'tooling/llm-api-bridges/ozon-seller/dist-step7-candidate/**'
      - 'tooling/llm-api-bridges/ozon-seller/validation/regression/run_multi_ai_file_delivery_patch.mjs'
      - 'tooling/llm-api-bridges/ozon-seller/validation/regression/run_file_delivery_*.mjs'
      - 'tooling/llm-api-bridges/ozon-seller/validation/regression/run_direct_binary_provider_attachment_gate.mjs'
      - 'tooling/llm-api-bridges/ozon-seller/validation/regression/run_file_attachment_browser_primitive.mjs'

permissions:
  contents: read

jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use accepted Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'

      - name: Run exact file-delivery regression set
        shell: bash
        env:
          OZON_FILE_DELIVERY_BASE_SHA: 4f78cc9f84a926cc834256abcb8278b95c9539df
        run: |
          set -euo pipefail
          test "$(node --version)" = 'v24.12.0'
          R=tooling/llm-api-bridges/ozon-seller/validation/regression
          node "$R/run_multi_ai_file_delivery_patch.mjs"
          node "$R/run_file_delivery_capture_accounting.mjs"
          node "$R/run_file_delivery_port_worker_state_machine.mjs"
          node "$R/run_file_delivery_mixed_batch_policy.mjs"
          node "$R/run_file_delivery_adapter_gate_policy.mjs"
          node "$R/run_file_delivery_wake_lifecycle.mjs"
          node "$R/run_file_delivery_live_stop_repro.mjs"
          node "$R/run_direct_binary_provider_attachment_gate.mjs"

  package:
    needs: regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use accepted Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'

      - name: Re-run regression on exact package source
        shell: bash
        env:
          OZON_FILE_DELIVERY_BASE_SHA: 4f78cc9f84a926cc834256abcb8278b95c9539df
        run: |
          set -euo pipefail
          R=tooling/llm-api-bridges/ozon-seller/validation/regression
          node "$R/run_multi_ai_file_delivery_patch.mjs"
          node "$R/run_file_delivery_capture_accounting.mjs"
          node "$R/run_file_delivery_port_worker_state_machine.mjs"
          node "$R/run_file_delivery_mixed_batch_policy.mjs"
          node "$R/run_file_delivery_adapter_gate_policy.mjs"
          node "$R/run_file_delivery_wake_lifecycle.mjs"
          node "$R/run_file_delivery_live_stop_repro.mjs"
          node "$R/run_direct_binary_provider_attachment_gate.mjs"

      - name: Install pinned Chrome for Testing
        shell: bash
        run: |
          set -euo pipefail
          CFT_VERSION='152.0.7977.82'
          CFT_URL="https://storage.googleapis.com/chrome-for-testing-public/${CFT_VERSION}/linux64/chrome-linux64.zip"
          CFT_ROOT="$RUNNER_TEMP/chrome-for-testing-${CFT_VERSION}"
          ARCHIVE="$RUNNER_TEMP/chrome-for-testing-${CFT_VERSION}.zip"
          rm -rf "$CFT_ROOT" "$ARCHIVE"
          mkdir -p "$CFT_ROOT"
          curl --fail --location --silent --show-error "$CFT_URL" --output "$ARCHIVE"
          echo "CFT_ARCHIVE_SHA256=$(sha256sum "$ARCHIVE" | awk '{print $1}')"
          unzip -q "$ARCHIVE" -d "$CFT_ROOT"
          CFT_BIN="$CFT_ROOT/chrome-linux64/chrome"
          test -x "$CFT_BIN"
          VERSION_OUT="$($CFT_BIN --version)"
          echo "$VERSION_OUT"
          echo "$VERSION_OUT" | grep -F "$CFT_VERSION"
          echo "CFT_BIN=$CFT_BIN" >> "$GITHUB_ENV"
          echo "CFT_VERSION=$CFT_VERSION" >> "$GITHUB_ENV"
          echo "CFT_SOURCE_URL=$CFT_URL" >> "$GITHUB_ENV"

      - name: Prove native Chrome for Testing File and DataTransfer primitive
        shell: bash
        run: |
          set -euo pipefail
          "$CFT_BIN" --version
          node tooling/llm-api-bridges/ozon-seller/validation/regression/run_file_attachment_browser_primitive.mjs "$CFT_BIN"

      - name: Prove installed MV3 service worker and IndexedDB artifact store with Chrome for Testing
        shell: bash
        run: |
          set -euo pipefail
          "$CFT_BIN" --version
          command -v xvfb-run >/dev/null
          xvfb-run -a node tooling/llm-api-bridges/ozon-seller/validation/regression/run_file_delivery_extension_worker_smoke.mjs "$CFT_BIN" "$GITHUB_WORKSPACE/tooling/llm-api-bridges/ozon-seller/dist-step7-candidate"

      - name: Build deterministic production ZIP and fresh-extract verify
        id: package
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/tooling/llm-api-bridges/ozon-seller"
          SRC="$ROOT/dist-step7-candidate"
          STAGE="$RUNNER_TEMP/package-stage"
          OUT="$RUNNER_TEMP/OZON_BRIDGE_v0.1.19_MULTI_AI_FILE_DELIVERY_${GITHUB_SHA:0:12}.zip"
          OUT2="$RUNNER_TEMP/OZON_BRIDGE_v0.1.19_MULTI_AI_FILE_DELIVERY_${GITHUB_SHA:0:12}.rebuild.zip"
          EXTRACT="$RUNNER_TEMP/fresh-extract"
          INVENTORY="$RUNNER_TEMP/package-inventory.txt"
          rm -rf "$STAGE" "$EXTRACT"
          mkdir -p "$STAGE" "$EXTRACT"
          cp -a "$SRC/." "$STAGE/"
          find "$STAGE" -type f -exec touch -t 198001010000 {} +
          find "$STAGE" -type f -printf '%P\n' | LC_ALL=C sort > "$INVENTORY"
          test -s "$INVENTORY"
          for f in manifest.json service_worker_entry.js shared/ai_delivery_capabilities.js shared/direct_binary_file_delivery_patch.js shared/file_delivery_model_policy.js shared/file_delivery_port_worker.js shared/file_delivery_wake_worker.js shared/web_file_attachment.js attachment_delivery_port_content.js attachment_delivery_wake_content.js; do grep -qx "$f" "$INVENTORY"; done
          ! grep -qx 'attachment_delivery_content.js' "$INVENTORY"
          ! grep -qx 'shared/file_delivery_worker.js' "$INVENTORY"
          rm -f "$OUT" "$OUT2"
          (cd "$STAGE" && zip -X -q "$OUT" -@ < "$INVENTORY")
          (cd "$STAGE" && zip -X -q "$OUT2" -@ < "$INVENTORY")
          cmp "$OUT" "$OUT2"
          echo 'DETERMINISTIC_ZIP_REBUILD=PASS'
          unzip -q "$OUT" -d "$EXTRACT"
          diff -ruN "$SRC" "$EXTRACT"
          echo 'FRESH_EXTRACT_BYTE_CONTENT_EQUIVALENCE=PASS'
          while IFS= read -r file; do case "$file" in *.js) node --check "$EXTRACT/$file";; esac; done < "$INVENTORY"
          BYTES=$(wc -c < "$OUT" | tr -d ' ')
          SHA=$(sha256sum "$OUT" | awk '{print $1}')
          echo "PACKAGE_FILE=$(basename "$OUT")"
          echo "PACKAGE_BYTES=$BYTES"
          echo "PACKAGE_SHA256=$SHA"
          echo "CFT_VERSION=$CFT_VERSION"
          echo "CFT_SOURCE_URL=$CFT_SOURCE_URL"
          echo "package_path=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload exact installable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ozon-multi-ai-file-delivery-${{ github.sha }}
          path: ${{ steps.package.outputs.package_path }}
          if-no-files-found: error
          retention-days: 30
