name: Ozon semantic analysis 2026-09-12

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ozon-semantic-analysis-2026-09-12.yml"
      - "продажи/статистика/ozon/tools/run_semantic_analysis_full.py.gz.b64.part01"
      - "продажи/статистика/ozon/tools/run_semantic_analysis_full.py.gz.b64.part02"
      - "продажи/статистика/ozon/tools/patch_semantic_processor_ready_card_evidence_v3.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Rebuild, patch, and verify processor
        shell: bash
        run: |
          set -euo pipefail
          cat \
            "продажи/статистика/ozon/tools/run_semantic_analysis_full.py.gz.b64.part01" \
            "продажи/статистика/ozon/tools/run_semantic_analysis_full.py.gz.b64.part02" \
            | base64 -d | gzip -d > /tmp/run_semantic_analysis_full.py
          BASE_SHA="$(sha256sum /tmp/run_semantic_analysis_full.py | cut -d' ' -f1)"
          EXPECTED_BASE_SHA="a0a42af85f6624e0047b49156b8b7759703ca9cc4bde48a4544bce6e1848b5c5"
          echo "base_processor_sha256=${BASE_SHA}"
          test "${BASE_SHA}" = "${EXPECTED_BASE_SHA}"
          python "продажи/статистика/ozon/tools/patch_semantic_processor_ready_card_evidence_v3.py"
          PATCHED_SHA="$(sha256sum /tmp/run_semantic_analysis_full.py | cut -d' ' -f1)"
          EXPECTED_PATCHED_SHA="6f0a24fb60ab47dce35589003cc64212d656d2cd746ce56c5bad3a49eb093685"
          echo "patched_processor_sha256=${PATCHED_SHA}"
          test "${PATCHED_SHA}" = "${EXPECTED_PATCHED_SHA}"
          python -m py_compile /tmp/run_semantic_analysis_full.py

      - name: Run full-volume Phase B-L analysis
        id: analysis
        shell: bash
        run: |
          set +e
          python /tmp/run_semantic_analysis_full.py > >(tee /tmp/semantic-analysis-run.log) 2> >(tee -a /tmp/semantic-analysis-run.log >&2)
          RC=$?
          echo "exit_code=${RC}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Persist processor failure log
        if: steps.analysis.outputs.exit_code != '0'
        shell: bash
        run: |
          set -euo pipefail
          OUT="продажи/статистика/ozon/analysis/2026-08-13_2026-09-10"
          mkdir -p "$OUT"
          cp /tmp/semantic-analysis-run.log "$OUT/PROCESSOR_RUN_FAILURE_2026-09-12.log"
          printf '{\n  "QA_STATUS": "PROCESSOR_FAILED",\n  "processor_exit_code": %s\n}\n' "${{ steps.analysis.outputs.exit_code }}" > "$OUT/SEMANTIC_ANALYSIS_STATUS_2026-09-12.json"

      - name: Verify successful QA
        if: steps.analysis.outputs.exit_code == '0'
        shell: bash
        run: |
          set -euo pipefail
          STATUS="продажи/статистика/ozon/analysis/2026-08-13_2026-09-10/SEMANTIC_ANALYSIS_STATUS_2026-09-12.json"
          grep -q '"QA_STATUS": "PASS"' "$STATUS"
          cat "$STATUS"
          cat "продажи/статистика/ozon/analysis/2026-08-13_2026-09-10/12_QA_REPORT.md"

      - name: Upload analytical artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ozon-semantic-analysis-2026-09-12
          path: продажи/статистика/ozon/analysis/2026-08-13_2026-09-10/
          if-no-files-found: error
          retention-days: 30

      - name: Commit derived analytical outputs or failure evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "продажи/статистика/ozon/analysis/2026-08-13_2026-09-10/"
          if git diff --cached --quiet; then
            echo "No analytical changes to commit"
          else
            if [ "${{ steps.analysis.outputs.exit_code }}" = "0" ]; then
              git commit -m "analysis(ozon): publish full semantic analysis phases B-L"
            else
              git commit -m "analysis(ozon): persist semantic processor failure evidence"
            fi
            git push origin HEAD:main
          fi

      - name: Fail job when processor failed
        if: steps.analysis.outputs.exit_code != '0'
        shell: bash
        run: |
          echo "Processor failed with exit code ${{ steps.analysis.outputs.exit_code }}"
          exit 1
