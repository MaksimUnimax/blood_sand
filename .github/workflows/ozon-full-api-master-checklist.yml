name: Ozon full API master checklist

on:
  push:
    branches:
      - repair/ozon-v2-b1-stocks-warehouse-2026-08-29
    paths:
      - .github/workflows/ozon-full-api-master-checklist.yml
      - tooling/llm-api-bridges/ozon-seller/validation/build_ozon_full_api_master_checklist.py

permissions:
  contents: write

jobs:
  build-master-checklist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: repair/ozon-v2-b1-stocks-warehouse-2026-08-29
          fetch-depth: 0

      - name: Fetch pinned audited GitHub operation indexes
        run: |
          set -euo pipefail
          commit=1953152c36955225b459cf55963a2c3a7a234661
          curl -fsSL "https://raw.githubusercontent.com/MissiaL/ozon-api/${commit}/references/index.md" -o /tmp/ozon-seller-index.md
          curl -fsSL "https://raw.githubusercontent.com/MissiaL/ozon-api/${commit}/references/index-performance.md" -o /tmp/ozon-performance-index.md

      - name: Materialize accepted canonical B1
        run: |
          set -euo pipefail
          python3 -c "import gzip,hashlib,pathlib;p=pathlib.Path('tooling/llm-api-bridges/ozon-seller/validation/PATCH_V2_B1_STOCKS_WAREHOUSE_2026-08-29.patch.gz');c=p.read_bytes();assert hashlib.sha256(c).hexdigest()=='e02d68c233067c258b3a115132296a4b25bdd1ab43ed061a030843fbbf475261';assert hashlib.sha256(gzip.decompress(c)).hexdigest()=='5485652cb41ea68d27285ba1678a23a4325037f1909426c933c60bdeabacf11f'"
          python3 tooling/llm-api-bridges/ozon-seller/validation/materialize_patch_v2_b1_stocks_warehouse_candidate.py --repo-root . --work-root /tmp/v2b1-work --out /tmp/v2b1-exact
          node tooling/llm-api-bridges/ozon-seller/validation/PATCH_V2_B1_STOCKS_WAREHOUSE_REGRESSION_2026-08-29.mjs /tmp/v2b1-exact

      - name: Dump current canonical Bridge registry
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' > /tmp/ozon-current-registry.json
          import { pathToFileURL } from 'node:url';
          const root = '/tmp/v2b1-exact';
          await import(pathToFileURL(`${root}/shared/runtime_names.js`).href);
          await import(pathToFileURL(`${root}/shared/ozon_operation_registry.js`).href);
          const operations = globalThis.OzonOperationRegistry?.OPERATIONS;
          if (!operations) throw new Error('OzonOperationRegistry.OPERATIONS unavailable');
          process.stdout.write(JSON.stringify({operations}, null, 2));
          NODE

      - name: Build and verify 463 + 48 inventory
        run: |
          set -euo pipefail
          base=tooling/llm-api-bridges/ozon-seller
          validation="$base/validation"
          python3 "$validation/build_ozon_full_api_master_checklist.py" \
            --seller-index /tmp/ozon-seller-index.md \
            --performance-index /tmp/ozon-performance-index.md \
            --registry-json /tmp/ozon-current-registry.json \
            --out-json "$validation/OZON_FULL_API_MASTER_CHECKLIST_2026-08-29.json" \
            --out-csv "$validation/OZON_FULL_API_MASTER_CHECKLIST_2026-08-29.csv" \
            --out-summary "$validation/OZON_FULL_API_MASTER_CHECKLIST_SUMMARY_2026-08-29.md"
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('tooling/llm-api-bridges/ozon-seller/validation/OZON_FULL_API_MASTER_CHECKLIST_2026-08-29.json')
          x=json.loads(p.read_text(encoding='utf-8'))
          assert x['counts']['seller'] == 463
          assert x['counts']['performance'] == 48
          assert x['counts']['total'] == 511
          assert len(x['rows']) == 511
          assert len({(r['provider'],r['operation_key']) for r in x['rows']}) == 511
          print(json.dumps(x['counts'], sort_keys=True))
          PY

      - name: Commit generated checklist to branch
        run: |
          set -euo pipefail
          validation=tooling/llm-api-bridges/ozon-seller/validation
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            "$validation/OZON_FULL_API_MASTER_CHECKLIST_2026-08-29.json" \
            "$validation/OZON_FULL_API_MASTER_CHECKLIST_2026-08-29.csv" \
            "$validation/OZON_FULL_API_MASTER_CHECKLIST_SUMMARY_2026-08-29.md"
          if git diff --cached --quiet; then
            echo "Checklist unchanged"
            exit 0
          fi
          git commit -m "validation(ozon): generate 463+48 master checklist"
          git push origin HEAD:repair/ozon-v2-b1-stocks-warehouse-2026-08-29
