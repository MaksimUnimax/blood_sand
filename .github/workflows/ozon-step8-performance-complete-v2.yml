name: Ozon Performance Step8 complete acceptance v2
run-name: Ozon Performance Step8 v2 · ${{ github.ref_name }} · ${{ github.sha }}

on:
  push:
    branches:
      - repair/ozon-step8-performance-48-formal-v2-2026-09-01
    paths:
      - .github/workflows/ozon-step8-performance-complete-v2.yml
      - tooling/llm-api-bridges/ozon-seller/validation/step8-performance-v2/**
      - tooling/llm-api-bridges/ozon-seller/validation/OZON_SELLER_STEP7_463_FORMAL_ACCEPTANCE_2026-08-31.md
      - tooling/llm-api-bridges/ozon-seller/validation/OZON_PERFORMANCE_STEP6_EXACT_MATRIX_2026-08-29.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ozon-performance-step8-complete-v2-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
  BRANCH: repair/ozon-step8-performance-48-formal-v2-2026-09-01
  STEP9_BRANCH: repair/ozon-step9-full-integration-266-reads-2026-09-01
  CANONICAL_BRANCH: repair/ozon-v2-b1-stocks-warehouse-2026-08-29
  CANONICAL_SHA: 8ee16f38bf2ec60e4b2e42192c2f41d87021b214
  PARTITION_BUILDER: tooling/llm-api-bridges/ozon-seller/validation/step8-performance-v2/build_partition_v2.py
  V2_GATE: tooling/llm-api-bridges/ozon-seller/validation/step8-performance-v2/run_step8_v2_gate.py
  STABILIZER: tooling/llm-api-bridges/ozon-seller/validation/step8-performance-v2/stabilize_step8_package.py
  FINALIZER: tooling/llm-api-bridges/ozon-seller/validation/step8-performance-v2/finalize_step8.py
  PERF_MATERIALIZER: tooling/llm-api-bridges/ozon-seller/validation/materialize_performance_step6_read_coverage_package.py
  PERF_MATRIX: tooling/llm-api-bridges/ozon-seller/validation/OZON_PERFORMANCE_STEP6_EXACT_MATRIX_2026-08-29.json
  MATRIX_REGRESSION: tooling/llm-api-bridges/ozon-seller/validation/OZON_PERFORMANCE_STEP6_MATRIX_REGRESSION_2026-08-29.mjs
  READ_REGRESSION: tooling/llm-api-bridges/ozon-seller/validation/OZON_PERFORMANCE_STEP6_READ_COVERAGE_REGRESSION_2026-08-29.mjs

jobs:
  platform-gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Disable Git line-ending conversion
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build and verify complete Step 8 surface
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/step8-v2-partition"
          full="$RUNNER_TEMP/step8-v2-full"
          artifact="$RUNNER_TEMP/step8-v2-artifact"
          perf_work="$RUNNER_TEMP/performance-step6-work"
          perf_candidate="$RUNNER_TEMP/performance-step6-candidate"
          rm -rf "$stage" "$full" "$artifact" "$perf_work" "$perf_candidate"
          mkdir -p "$stage" "$full" "$artifact"
          python "$PARTITION_BUILDER" --repo-root "$GITHUB_WORKSPACE" --out "$stage"
          python "$PERF_MATERIALIZER" --repo-root "$GITHUB_WORKSPACE" --work-root "$perf_work" --out "$perf_candidate"
          node "$MATRIX_REGRESSION" "$perf_work/step5-base" "$PERF_MATRIX"
          node "$READ_REGRESSION" "$perf_candidate" "$PERF_MATRIX" "$perf_work/step5-base"
          python "$V2_GATE" --repo-root "$GITHUB_WORKSPACE" --out "$full" --source-commit "$GITHUB_SHA"
          python "$STABILIZER" --output "$full"
          python "$FINALIZER" assemble --stage "$stage" --full "$full" --out "$artifact" --source-commit "$GITHUB_SHA"
          echo "PERFORMANCE_STEP8_${RUNNER_OS^^}_V2_FULL_GATE_PASS"
      - uses: actions/upload-artifact@v4
        with:
          name: ozon-performance-step8-${{ runner.os }}-v2
          path: ${{ runner.temp }}/step8-v2-artifact
          if-no-files-found: error
          retention-days: 14

  compare-cross-platform:
    needs: platform-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: ozon-performance-step8-Linux-v2
          path: ${{ runner.temp }}/linux
      - uses: actions/download-artifact@v4
        with:
          name: ozon-performance-step8-Windows-v2
          path: ${{ runner.temp }}/windows
      - name: Prove Linux and Windows byte identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cross"
          python "$FINALIZER" compare \
            --linux "$RUNNER_TEMP/linux" \
            --windows "$RUNNER_TEMP/windows" \
            --out "$RUNNER_TEMP/cross/OZON_PERFORMANCE_STEP8_CROSS_PLATFORM_PROOF_V2.json" \
            --source-commit "$GITHUB_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@v4
        with:
          name: ozon-performance-step8-cross-platform-v2
          path: ${{ runner.temp }}/cross/OZON_PERFORMANCE_STEP8_CROSS_PLATFORM_PROOF_V2.json
          if-no-files-found: error
          retention-days: 14

  formalize-and-start-step9:
    needs: compare-cross-platform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: ozon-performance-step8-Linux-v2
          path: ${{ runner.temp }}/linux
      - uses: actions/download-artifact@v4
        with:
          name: ozon-performance-step8-Windows-v2
          path: ${{ runner.temp }}/windows
      - uses: actions/download-artifact@v4
        with:
          name: ozon-performance-step8-cross-platform-v2
          path: ${{ runner.temp }}/cross
      - name: Reproduce, freeze, accept and create Step 9 branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          canonical_actual="$(git ls-remote origin "refs/heads/$CANONICAL_BRANCH" | awk '{print $1}')"
          test "$canonical_actual" = "$CANONICAL_SHA"
          stage="$RUNNER_TEMP/step8-v2-fresh-partition"
          full="$RUNNER_TEMP/step8-v2-fresh-full"
          perf_work="$RUNNER_TEMP/performance-step6-work"
          perf_candidate="$RUNNER_TEMP/performance-step6-candidate"
          rm -rf "$stage" "$full" "$perf_work" "$perf_candidate"
          mkdir -p "$stage" "$full"
          python "$PARTITION_BUILDER" --repo-root "$GITHUB_WORKSPACE" --out "$stage"
          python "$PERF_MATERIALIZER" --repo-root "$GITHUB_WORKSPACE" --work-root "$perf_work" --out "$perf_candidate"
          node "$MATRIX_REGRESSION" "$perf_work/step5-base" "$PERF_MATRIX"
          node "$READ_REGRESSION" "$perf_candidate" "$PERF_MATRIX" "$perf_work/step5-base"
          python "$V2_GATE" --repo-root "$GITHUB_WORKSPACE" --out "$full" --source-commit "$GITHUB_SHA"
          python "$STABILIZER" --output "$full"
          python "$FINALIZER" finalize \
            --repo-root "$GITHUB_WORKSPACE" \
            --fresh-stage "$stage" \
            --fresh-full "$full" \
            --linux "$RUNNER_TEMP/linux" \
            --windows "$RUNNER_TEMP/windows" \
            --cross "$RUNNER_TEMP/cross/OZON_PERFORMANCE_STEP8_CROSS_PLATFORM_PROOF_V2.json" \
            --source-commit "$GITHUB_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --canonical-branch "$CANONICAL_BRANCH" \
            --canonical-sha "$CANONICAL_SHA" \
            --step9-branch "$STEP9_BRANCH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tooling/llm-api-bridges/ozon-seller/validation/step8-performance-v1/OZON_STEP8_PERFORMANCE_48_ROADMAP.md \
            tooling/llm-api-bridges/ozon-seller/validation/step8-performance-v2
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git commit -m 'accept(ozon): formally close Performance Step8 48 of 48 v2'
          acceptance_commit="$(git rev-parse HEAD)"
          git push origin HEAD:"$BRANCH"
          if git ls-remote --exit-code --heads origin "$STEP9_BRANCH" >/dev/null 2>&1; then
            existing="$(git ls-remote origin "refs/heads/$STEP9_BRANCH" | awk '{print $1}')"
            test "$existing" = "$acceptance_commit"
          else
            git push origin "$acceptance_commit:refs/heads/$STEP9_BRANCH"
          fi
          test "$(git ls-remote origin "refs/heads/$BRANCH" | awk '{print $1}')" = "$acceptance_commit"
          test "$(git ls-remote origin "refs/heads/$STEP9_BRANCH" | awk '{print $1}')" = "$acceptance_commit"
          test "$(git ls-remote origin "refs/heads/$CANONICAL_BRANCH" | awk '{print $1}')" = "$CANONICAL_SHA"
          echo OZON_PERFORMANCE_STEP8_FORMALLY_ACCEPTED
          echo OZON_STEP9_BRANCH_CREATED_FROM_STEP8_ACCEPTANCE
      - uses: actions/upload-artifact@v4
        with:
          name: ozon-performance-step8-formal-acceptance-v2
          path: |
            tooling/llm-api-bridges/ozon-seller/validation/step8-performance-v2/generated
            tooling/llm-api-bridges/ozon-seller/validation/step8-performance-v2/evidence
            tooling/llm-api-bridges/ozon-seller/validation/step8-performance-v2/OZON_PERFORMANCE_STEP8_V2_MANIFEST.json
            tooling/llm-api-bridges/ozon-seller/validation/step8-performance-v2/README.md
            tooling/llm-api-bridges/ozon-seller/validation/step8-performance-v1/OZON_STEP8_PERFORMANCE_48_ROADMAP.md
          if-no-files-found: error
          retention-days: 14
