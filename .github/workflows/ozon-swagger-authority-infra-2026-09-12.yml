name: "Ozon Swagger source transport 2026-09-12"

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ozon-swagger-authority-infra-2026-09-12.yml"

permissions:
  contents: write

jobs:
  transport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch exact Swagger bytes through browser
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome"
          npm install --no-save puppeteer-core@24 >/dev/null 2>&1
          mkdir -p /tmp/ozon-swagger
          cat >fetch-ozon-swagger.mjs <<'JS'
          import fs from 'fs';
          import puppeteer from 'puppeteer-core';
          const b=await puppeteer.launch({executablePath:process.env.CHROME_BIN,headless:false,args:['--no-sandbox','--disable-dev-shm-usage']});
          const targets=[
            ['https://docs.ozon.ru/api/performance/','https://docs.ozon.ru/api/performance/swagger.json','/tmp/ozon-swagger/performance.json'],
            ['https://docs.ozon.ru/api/seller/','https://docs.ozon.ru/api/seller/swagger.json','/tmp/ozon-swagger/seller.json']
          ];
          try {
            for (const [root,spec,out] of targets) {
              const p=await b.newPage();
              await p.setExtraHTTPHeaders({'Accept-Language':'ru-RU,ru;q=0.9,en;q=0.8'});
              try { await p.goto(root,{waitUntil:'networkidle2',timeout:60000}); } catch {}
              await new Promise(r=>setTimeout(r,2500));
              const r=await p.goto(spec,{waitUntil:'networkidle2',timeout:60000});
              if(!r) throw new Error('no swagger response');
              const buf=await r.buffer();
              JSON.parse(buf.toString('utf8'));
              fs.writeFileSync(out,buf);
              console.log(out,buf.length,p.url());
              await p.close();
            }
          } finally { await b.close(); }
          JS
          CHROME_BIN="$chrome" xvfb-run -a node ./fetch-ozon-swagger.mjs
          rm -f fetch-ozon-swagger.mjs
          test "$(sha256sum /tmp/ozon-swagger/performance.json | awk '{print $1}')" = "ec1adb41f16d145b9a7487b7c7e0995a0db37f54cefed1933d6ad789dd5c2405"
          test "$(sha256sum /tmp/ozon-swagger/seller.json | awk '{print $1}')" = "87f9a1e99fa35c06e3d15567409d688849f6647420ceee5710c7b72769a41d33"

      - name: Install sole current raw authority
        shell: bash
        run: |
          set -euo pipefail
          out="tooling/llm-api-bridges/ozon-seller/swagger-authority/2026-09-12"
          mkdir -p "$out"
          cp /tmp/ozon-swagger/performance.json "$out/OZON_PERFORMANCE_SWAGGER_2026-09-12.json"
          cp /tmp/ozon-swagger/seller.json "$out/OZON_SELLER_SWAGGER_2026-09-12.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$out/OZON_PERFORMANCE_SWAGGER_2026-09-12.json" "$out/OZON_SELLER_SWAGGER_2026-09-12.json"
          git commit -m "infra(ozon): install exact fresh Swagger source bytes"
          git push origin HEAD:main
