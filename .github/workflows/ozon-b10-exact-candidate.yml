name: Ozon B10 Seller Health Ratings exact candidate

on:
  push:
    branches:
      - feature/ozon-b10-seller-health-ratings-2026-08-26
    paths:
      - .github/workflows/ozon-b10-exact-candidate.yml
      - tooling/llm-api-bridges/ozon-seller/validation/PATCH_B10_SELLER_HEALTH_RATINGS_2026-08-26.patch.gz
      - tooling/llm-api-bridges/ozon-seller/validation/materialize_patch_b10_seller_health_ratings_candidate.py
      - tooling/llm-api-bridges/ozon-seller/validation/PATCH_B10_SELLER_HEALTH_RATINGS_REGRESSION_2026-08-26.mjs
      - tooling/llm-api-bridges/ozon-seller/validation/PATCH_B10_SELLER_HEALTH_RATINGS_*_2026-08-26.md
      - tooling/llm-api-bridges/ozon-seller/validation/OZON_IMPLEMENTATION_CONTRACT_QUEUE_V2_2026-08-26.json
      - tooling/llm-api-bridges/ozon-seller/validation/OZON_POST_B9_COVERAGE_AUDIT_2026-08-26.md

permissions:
  contents: read

jobs:
  linux-materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize exact B10 candidate
        run: python3 tooling/llm-api-bridges/ozon-seller/validation/materialize_patch_b10_seller_health_ratings_candidate.py --repo-root . --work-root /tmp/ozon-b10-work --out /tmp/ozon-b10-exact
      - name: Verify B1-B6 carry-forward and exact B7-B9 bases
        run: |
          node tooling/llm-api-bridges/ozon-seller/validation/PATCH_B1_ASSORTMENT_MASTER_REGRESSION_2026-08-26.mjs /tmp/ozon-b10-exact
          node tooling/llm-api-bridges/ozon-seller/validation/PATCH_B2_PRICES_LISTING_STATE_REGRESSION_2026-08-26.mjs /tmp/ozon-b10-exact
          node tooling/llm-api-bridges/ozon-seller/validation/PATCH_B3_WAREHOUSE_STOCK_GEOGRAPHY_REGRESSION_2026-08-26.mjs /tmp/ozon-b10-exact
          node tooling/llm-api-bridges/ozon-seller/validation/PATCH_B4_ORDERS_RETURNS_CANCELLATIONS_REGRESSION_2026-08-26.mjs /tmp/ozon-b10-exact
          node tooling/llm-api-bridges/ozon-seller/validation/PATCH_B5_FINANCE_REALIZATION_REGRESSION_2026-08-26.mjs /tmp/ozon-b10-exact
          node tooling/llm-api-bridges/ozon-seller/validation/PATCH_B6_PERFORMANCE_READ_CORE_REGRESSION_2026-08-26.mjs /tmp/ozon-b10-exact
          node tooling/llm-api-bridges/ozon-seller/validation/PATCH_B7_ANALYTICS_SEARCH_REGRESSION_2026-08-26.mjs /tmp/ozon-b10-work/b9-work/b8-work/b7-base
          node tooling/llm-api-bridges/ozon-seller/validation/PATCH_B8_SUPPLY_REPLENISHMENT_REGRESSION_2026-08-26.mjs /tmp/ozon-b10-work/b9-work/b8-base
          node tooling/llm-api-bridges/ozon-seller/validation/PATCH_B9_REVIEWS_QUESTIONS_REGRESSION_2026-08-26.mjs /tmp/ozon-b10-work/b9-base
      - name: Verify B10 regression and syntax
        run: |
          node --check tooling/llm-api-bridges/ozon-seller/validation/PATCH_B10_SELLER_HEALTH_RATINGS_REGRESSION_2026-08-26.mjs
          node tooling/llm-api-bridges/ozon-seller/validation/PATCH_B10_SELLER_HEALTH_RATINGS_REGRESSION_2026-08-26.mjs /tmp/ozon-b10-exact
          find /tmp/ozon-b10-exact -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Record exact identities
        run: |
          cd /tmp/ozon-b10-exact
          find . -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/ozon-b10-exact-files.sha256
          sha256sum shared/ozon_operation_registry.js shared/ozon_contract.js shared/ozon_entitlements.js service_worker.js content_script.js shared/bridge_autorun_model.js shared/work_session_model.js > /tmp/ozon-b10-core.sha256
      - name: Upload exact B10 candidate
        uses: actions/upload-artifact@v4
        with:
          name: ozon-b10-seller-health-ratings-candidate
          path: |
            /tmp/ozon-b10-exact
            /tmp/ozon-b10-exact-files.sha256
            /tmp/ozon-b10-core.sha256
          if-no-files-found: error
          retention-days: 3

  windows-materialize:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify B10 patch transport identity
        shell: pwsh
        run: |
          python -c "import gzip,hashlib,pathlib; p=pathlib.Path('tooling/llm-api-bridges/ozon-seller/validation/PATCH_B10_SELLER_HEALTH_RATINGS_2026-08-26.patch.gz'); c=p.read_bytes(); assert hashlib.sha256(c).hexdigest()=='c0a1a486c8a28d6ccfed9338eab6f71f258bf2adf3fd1c0e12a77ac124aec4ea'; b=gzip.decompress(c); assert hashlib.sha256(b).hexdigest()=='44b5527e0cbde268c0e4d6cb378def971369f9815d6a633dae86947a6c68bed3'"
      - name: Materialize exact B10 candidate on Windows
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP "ozon-b10-work"
          $out = Join-Path $env:RUNNER_TEMP "ozon-b10-exact"
          python tooling/llm-api-bridges/ozon-seller/validation/materialize_patch_b10_seller_health_ratings_candidate.py --repo-root . --work-root $work --out $out
      - name: Verify B1-B6 on B10, exact B7-B9 bases, and B10 gates on Windows
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "ozon-b10-exact"
          $work = Join-Path $env:RUNNER_TEMP "ozon-b10-work"
          $b7 = Join-Path $work "b9-work/b8-work/b7-base"
          $b8 = Join-Path $work "b9-work/b8-base"
          $b9 = Join-Path $work "b9-base"
          node tooling/llm-api-bridges/ozon-seller/validation/PATCH_B1_ASSORTMENT_MASTER_REGRESSION_2026-08-26.mjs $out; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tooling/llm-api-bridges/ozon-seller/validation/PATCH_B2_PRICES_LISTING_STATE_REGRESSION_2026-08-26.mjs $out; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tooling/llm-api-bridges/ozon-seller/validation/PATCH_B3_WAREHOUSE_STOCK_GEOGRAPHY_REGRESSION_2026-08-26.mjs $out; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tooling/llm-api-bridges/ozon-seller/validation/PATCH_B4_ORDERS_RETURNS_CANCELLATIONS_REGRESSION_2026-08-26.mjs $out; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tooling/llm-api-bridges/ozon-seller/validation/PATCH_B5_FINANCE_REALIZATION_REGRESSION_2026-08-26.mjs $out; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tooling/llm-api-bridges/ozon-seller/validation/PATCH_B6_PERFORMANCE_READ_CORE_REGRESSION_2026-08-26.mjs $out; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tooling/llm-api-bridges/ozon-seller/validation/PATCH_B7_ANALYTICS_SEARCH_REGRESSION_2026-08-26.mjs $b7; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tooling/llm-api-bridges/ozon-seller/validation/PATCH_B8_SUPPLY_REPLENISHMENT_REGRESSION_2026-08-26.mjs $b8; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tooling/llm-api-bridges/ozon-seller/validation/PATCH_B9_REVIEWS_QUESTIONS_REGRESSION_2026-08-26.mjs $b9; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tooling/llm-api-bridges/ozon-seller/validation/PATCH_B10_SELLER_HEALTH_RATINGS_REGRESSION_2026-08-26.mjs $out; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem -Path $out -Recurse -Filter *.js | ForEach-Object { node --check $_.FullName; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
