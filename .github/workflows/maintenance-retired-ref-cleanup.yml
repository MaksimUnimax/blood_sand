name: Maintenance retired ref cleanup

on:
  workflow_run:
    workflows:
      - Ozon composer-wait regression
    types:
      - completed

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.workflow_run.head_sha == 'bb65fc18b2c8ae6dbfb99e536c29b35717ee66de'
    runs-on: ubuntu-latest
    steps:
      - name: Delete retired validation ref via GitHub API
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: 'heads/validation/ozon-resolved-pre-operator-full-gate-2026-08-19'
              });
            } catch (error) {
              if (error.status === 404) {
                core.info('ref already absent');
                return;
              }
              throw error;
            }
