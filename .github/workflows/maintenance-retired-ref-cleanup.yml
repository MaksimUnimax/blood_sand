name: Maintenance retired ref cleanup

on:
  pull_request_target:
    types:
      - opened
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.head.ref == 'dev/ozon-v0.1.19-manual-delivery-composer-wait-2026-08-18'
    runs-on: ubuntu-latest
    steps:
      - name: Delete retired validation ref via GitHub API
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: 'heads/validation/ozon-resolved-pre-operator-full-gate-2026-08-19'
              });
            } catch (error) {
              if (error.status === 404) {
                core.info('ref already absent');
                return;
              }
              throw error;
            }
