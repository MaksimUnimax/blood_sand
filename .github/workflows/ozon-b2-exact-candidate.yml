name: Ozon B2 exact candidate

on:
  push:
    branches:
      - feature/ozon-b2-prices-listing-state-contracts-2026-08-26
    paths:
      - .gitattributes
      - .github/workflows/ozon-b2-exact-candidate.yml
      - tooling/llm-api-bridges/ozon-seller/validation/PATCH_B2_PRICES_LISTING_STATE_2026-08-26.patch
      - tooling/llm-api-bridges/ozon-seller/validation/materialize_patch_b2_prices_listing_state_candidate.py
      - tooling/llm-api-bridges/ozon-seller/validation/PATCH_B2_PRICES_LISTING_STATE_REGRESSION_2026-08-26.mjs
      - tooling/llm-api-bridges/ozon-seller/validation/PATCH_B2_PRICES_LISTING_STATE_CANDIDATE_MANIFEST_2026-08-26.md
      - tooling/llm-api-bridges/ozon-seller/validation/PATCH_B2_PRICES_LISTING_STATE_IMPLEMENTATION_RESULT_2026-08-26.md
      - tooling/llm-api-bridges/ozon-seller/validation/PATCH_B2_PRICES_LISTING_STATE_CONTRACT_RESEARCH_RESULT_2026-08-26.md
      - tooling/llm-api-bridges/ozon-seller/validation/PATCH_B2_PRICES_LISTING_STATE_OPERATOR_SWAGGER_EVIDENCE_2026-08-26.md

permissions:
  contents: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Materialize exact B2 candidate
        run: |
          python3 tooling/llm-api-bridges/ozon-seller/validation/materialize_patch_b2_prices_listing_state_candidate.py . /tmp/ozon-b2-exact

      - name: Verify B1 regression on B2 candidate
        run: |
          node tooling/llm-api-bridges/ozon-seller/validation/PATCH_B1_ASSORTMENT_MASTER_REGRESSION_2026-08-26.mjs /tmp/ozon-b2-exact

      - name: Verify B2 deterministic gate
        run: |
          node --check tooling/llm-api-bridges/ozon-seller/validation/PATCH_B2_PRICES_LISTING_STATE_REGRESSION_2026-08-26.mjs
          node tooling/llm-api-bridges/ozon-seller/validation/PATCH_B2_PRICES_LISTING_STATE_REGRESSION_2026-08-26.mjs /tmp/ozon-b2-exact
          find /tmp/ozon-b2-exact -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Record exact identities
        run: |
          cd /tmp/ozon-b2-exact
          find . -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/ozon-b2-exact-files.sha256
          sha256sum shared/ozon_operation_registry.js shared/ozon_contract.js shared/ozon_entitlements.js service_worker.js content_script.js shared/bridge_autorun_model.js shared/work_session_model.js > /tmp/ozon-b2-core.sha256

      - name: Upload exact B2 candidate
        uses: actions/upload-artifact@v4
        with:
          name: ozon-b2-prices-listing-state-candidate
          path: |
            /tmp/ozon-b2-exact
            /tmp/ozon-b2-exact-files.sha256
            /tmp/ozon-b2-core.sha256
          if-no-files-found: error
          retention-days: 3

  windows-materialize:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record B2 patch identity
        shell: pwsh
        run: |
          $patch = "tooling/llm-api-bridges/ozon-seller/validation/PATCH_B2_PRICES_LISTING_STATE_2026-08-26.patch"
          (Get-FileHash -Algorithm SHA256 $patch).Hash.ToLower()

      - name: Materialize exact B2 candidate on Windows
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "ozon-b2-exact"
          python tooling/llm-api-bridges/ozon-seller/validation/materialize_patch_b2_prices_listing_state_candidate.py . $out

      - name: Verify B1 and B2 deterministic gates on Windows
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "ozon-b2-exact"
          node tooling/llm-api-bridges/ozon-seller/validation/PATCH_B1_ASSORTMENT_MASTER_REGRESSION_2026-08-26.mjs $out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tooling/llm-api-bridges/ozon-seller/validation/PATCH_B2_PRICES_LISTING_STATE_REGRESSION_2026-08-26.mjs $out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem -Path $out -Recurse -Filter *.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
