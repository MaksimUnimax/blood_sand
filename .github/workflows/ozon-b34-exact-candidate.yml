name: Ozon B34 Stock Analytics Extended Reads exact candidate
on:
  push:
    branches: [feature/ozon-b34-stock-analytics-extended-reads-2026-08-28]
    paths:
      - .github/workflows/ozon-b34-exact-candidate.yml
      - tooling/llm-api-bridges/ozon-seller/validation/PATCH_B34_STOCK_ANALYTICS_EXTENDED_READS_2026-08-28.patch.gz
      - tooling/llm-api-bridges/ozon-seller/validation/materialize_patch_b34_stock_analytics_extended_reads_candidate.py
      - tooling/llm-api-bridges/ozon-seller/validation/PATCH_B34_STOCK_ANALYTICS_EXTENDED_READS_REGRESSION_2026-08-28.mjs
      - tooling/llm-api-bridges/ozon-seller/validation/PATCH_B34_STOCK_ANALYTICS_EXTENDED_READS_CANDIDATE_EVIDENCE_2026-08-28.md
      - tooling/llm-api-bridges/ozon-seller/validation/PATCH_B34_STOCK_ANALYTICS_EXTENDED_READS_CANDIDATE_MANIFEST_2026-08-28.md
permissions: {contents: read}
jobs:
  linux-materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify B34 patch transport identity
        run: python3 -c "import gzip,hashlib,pathlib;p=pathlib.Path('tooling/llm-api-bridges/ozon-seller/validation/PATCH_B34_STOCK_ANALYTICS_EXTENDED_READS_2026-08-28.patch.gz');c=p.read_bytes();assert hashlib.sha256(c).hexdigest()=='1de1e979de27d0bd655c9a0d03d7a4f5fe6cd1cb0121545c84b29dda6bb00e8c';assert hashlib.sha256(gzip.decompress(c)).hexdigest()=='f7ef9d455e3b2cf345f6b118d9b05bbb88eded4caeb42e3c4d25d74302d9db66'"
      - name: Materialize exact B34 candidate
        run: python3 tooling/llm-api-bridges/ozon-seller/validation/materialize_patch_b34_stock_analytics_extended_reads_candidate.py --repo-root . --work-root /tmp/ozon-b34-work --out /tmp/ozon-b34-exact
      - name: Verify B33 base and B34 gates
        run: |
          node tooling/llm-api-bridges/ozon-seller/validation/PATCH_B33_OPERATIONAL_STATUS_REFERENCE_READS_REGRESSION_2026-08-28.mjs /tmp/ozon-b34-work/b33-base
          node tooling/llm-api-bridges/ozon-seller/validation/PATCH_B34_STOCK_ANALYTICS_EXTENDED_READS_REGRESSION_2026-08-28.mjs /tmp/ozon-b34-exact
          find /tmp/ozon-b34-exact -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - uses: actions/upload-artifact@v4
        with: {name: ozon-b34-stock-analytics-extended-reads-candidate, path: /tmp/ozon-b34-exact, if-no-files-found: error, retention-days: 3}
  windows-materialize:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable Git long paths
        shell: pwsh
        run: git config --global core.longpaths true
      - name: Verify B34 patch transport identity
        shell: pwsh
        run: python -c "import gzip,hashlib,pathlib;p=pathlib.Path('tooling/llm-api-bridges/ozon-seller/validation/PATCH_B34_STOCK_ANALYTICS_EXTENDED_READS_2026-08-28.patch.gz');c=p.read_bytes();assert hashlib.sha256(c).hexdigest()=='1de1e979de27d0bd655c9a0d03d7a4f5fe6cd1cb0121545c84b29dda6bb00e8c';assert hashlib.sha256(gzip.decompress(c)).hexdigest()=='f7ef9d455e3b2cf345f6b118d9b05bbb88eded4caeb42e3c4d25d74302d9db66'"
      - name: Materialize exact B34 candidate
        shell: pwsh
        run: |
          $work='C:\b34w'; $out='C:\b34o'
          python tooling/llm-api-bridges/ozon-seller/validation/materialize_patch_b34_stock_analytics_extended_reads_candidate.py --repo-root . --work-root $work --out $out
      - name: Verify B33 base and B34 gates
        shell: pwsh
        run: |
          $work='C:\b34w'; $out='C:\b34o'; $b33=Join-Path $work 'b33-base'
          node tooling/llm-api-bridges/ozon-seller/validation/PATCH_B33_OPERATIONAL_STATUS_REFERENCE_READS_REGRESSION_2026-08-28.mjs $b33; if($LASTEXITCODE-ne 0){exit $LASTEXITCODE}
          node tooling/llm-api-bridges/ozon-seller/validation/PATCH_B34_STOCK_ANALYTICS_EXTENDED_READS_REGRESSION_2026-08-28.mjs $out; if($LASTEXITCODE-ne 0){exit $LASTEXITCODE}
          Get-ChildItem $out -Recurse -Filter *.js | ForEach-Object {node --check $_.FullName;if($LASTEXITCODE-ne 0){exit $LASTEXITCODE}}
