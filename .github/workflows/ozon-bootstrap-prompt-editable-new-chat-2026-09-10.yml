name: Ozon bootstrap prompt editable new-chat gate
run-name: Ozon bootstrap prompt editable new-chat · ${{ github.ref_name }} · ${{ github.sha }}

on:
  push:
    branches: [repair/ozon-bootstrap-prompt-editable-new-chat-2026-09-10]
    paths:
      - '.github/workflows/ozon-bootstrap-prompt-editable-new-chat-2026-09-10.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ozon-bootstrap-prompt-editable-new-chat-${{ github.ref }}
  cancel-in-progress: false

env:
  PATCH_BRANCH: repair/ozon-bootstrap-prompt-editable-new-chat-2026-09-10
  BASE_AUTHORITY: da762fec61f55793406dae96d9f8aaae757425f4
  ROOT: tooling/llm-api-bridges/ozon-seller
  DIST: tooling/llm-api-bridges/ozon-seller/dist-step7-candidate
  MATERIALIZER: tooling/llm-api-bridges/ozon-seller/development/bootstrap-prompt-editable-new-chat-2026-09-10/materialize_bootstrap_prompt_patch.py
  TARGET_GATE: tooling/llm-api-bridges/ozon-seller/validation/bootstrap-prompt-editable-new-chat-v1/run_bootstrap_prompt_editable_new_chat_gate.mjs
  MIXED_GATE: tooling/llm-api-bridges/ozon-seller/validation/mixed-help-api-v2/run_mixed_help_api_gate_v2.mjs
  DISABLED_MIXED_GATE: tooling/llm-api-bridges/ozon-seller/validation/mixed-help-api-v2/run_mixed_help_api_disabled_alias_gate.mjs
  COMMAND_GATE: tooling/llm-api-bridges/ozon-seller/validation/command-envelope-contract-v1/run_command_envelope_contract_gate.mjs
  ARTIFACT_NAME: OZON_BRIDGE_v0.1.19_BOOTSTRAP_PROMPT_EDITABLE_NEW_CHAT_20260910.zip
  BUILDINFO_NAME: OZON_BRIDGE_v0.1.19_BOOTSTRAP_PROMPT_EDITABLE_NEW_CHAT_20260910_BUILDINFO.txt

jobs:
  materialize-linux:
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.commit.outputs.source_sha }}
      source_tree: ${{ steps.commit.outputs.source_tree }}
      package_sha: ${{ steps.package.outputs.package_sha }}
      package_bytes: ${{ steps.package.outputs.package_bytes }}
      refresh_guard_state: ${{ steps.refresh.outputs.refresh_guard_state }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify exact authorized base ancestry and clean input
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASE_AUTHORITY" HEAD
          test -z "$(git status --porcelain)"
          test "$(node --version)" = 'v24.12.0'
          python --version | grep -F 'Python 3.12'
          echo AUTHORIZED_BASE_ANCESTRY_PASS

      - name: GATE-30 prove targeted regression fails on pre-fix authority for exact defect
        shell: bash
        run: |
          set -euo pipefail
          BASE_WT="$RUNNER_TEMP/ozon-bootstrap-prefx"
          rm -rf "$BASE_WT"
          git worktree add --detach "$BASE_WT" "$BASE_AUTHORITY"
          set +e
          node "$TARGET_GATE" "$BASE_WT/$DIST" > "$RUNNER_TEMP/prefix-target.log" 2>&1
          RC=$?
          set -e
          cat "$RUNNER_TEMP/prefix-target.log"
          test "$RC" -ne 0
          grep -F 'GLOBAL_BOOTSTRAP_PROMPT_STORAGE_KEY_MISSING' "$RUNNER_TEMP/prefix-target.log"
          git worktree remove --force "$BASE_WT"
          echo TARGET_REGRESSION_PRE_FIX_INTENDED_FAIL_PASS

      - name: Snapshot protected pre-fix invariants
        shell: bash
        run: |
          set -euo pipefail
          git show "$BASE_AUTHORITY:$DIST/shared/runtime_names.js" > "$RUNNER_TEMP/base-runtime_names.js"
          git show "$BASE_AUTHORITY:$DIST/service_worker.js" > "$RUNNER_TEMP/base-service_worker.js"
          git show "$BASE_AUTHORITY:$DIST/service_worker_entry.js" > "$RUNNER_TEMP/base-service_worker_entry.js"
          git show "$BASE_AUTHORITY:$DIST/manifest.json" > "$RUNNER_TEMP/base-manifest.json"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp')
          # marker only; exact comparison is performed after materialization from runner files.
          print('PROTECTED_BASE_SNAPSHOT_PASS')
          PY

      - name: Materialize authorized production repair
        shell: bash
        run: |
          set -euo pipefail
          python "$MATERIALIZER"
          git diff --check
          echo AUTHORIZED_BOOTSTRAP_PROMPT_MATERIALIZATION_PASS

      - name: Verify production diff scope and protected architecture invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          base='da762fec61f55793406dae96d9f8aaae757425f4'
          dist=Path('tooling/llm-api-bridges/ozon-seller/dist-step7-candidate')
          allowed={
              (dist/'service_worker.js').as_posix(),
              (dist/'popup.js').as_posix(),
              (dist/'popup.html').as_posix(),
              (dist/'shared/runtime_names.js').as_posix(),
          }
          changed=set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          prod_changed={p for p in changed if p.startswith(dist.as_posix() + '/')}
          assert prod_changed == allowed, (prod_changed, allowed)

          def old(path):
              return subprocess.check_output(['git','show',f'{base}:{path.as_posix()}'], text=True)
          def cur(path): return path.read_text(encoding='utf-8')

          runtime_path=dist/'shared/runtime_names.js'
          old_runtime, new_runtime=old(runtime_path), cur(runtime_path)
          start='  const DEFAULT_AUTO_START_TEXT = ['
          end='  globalThis.OzonRuntime ='
          def default_block(text):
              a=text.index(start); b=text.index(end,a); return text[a:b]
          assert default_block(old_runtime) == default_block(new_runtime), 'built-in default wording changed out of scope'

          manifest=dist/'manifest.json'
          entry=dist/'service_worker_entry.js'
          assert old(manifest) == cur(manifest), 'manifest changed out of scope'
          assert old(entry) == cur(entry), 'service worker entry changed out of scope'

          worker_path=dist/'service_worker.js'
          old_worker, new_worker=old(worker_path), cur(worker_path)
          def case_block(text, current, nxt):
              a=text.index(f'case "{current}"')
              b=text.index(f'case "{nxt}"',a)
              return text[a:b]
          assert case_block(old_worker,'OZ_WORK_REFRESH','OZ_WORK_FINISH') == case_block(new_worker,'OZ_WORK_REFRESH','OZ_WORK_FINISH'), 'refresh lifecycle route changed'

          diff=subprocess.check_output(['git','diff','--unified=0','--',worker_path.as_posix()], text=True)
          changed_lines=[ln[1:] for ln in diff.splitlines() if ln.startswith(('+','-')) and not ln.startswith(('+++','---'))]
          forbidden=('fetch(', 'OzonProvider', 'providerRequest', 'sellerClientId', 'sellerApiKey', 'performanceClientSecret', 'next_allowed_at')
          for token in forbidden:
              assert not any(token in ln for ln in changed_lines), f'provider/request/credential surface changed: {token}'

          assert 'GLOBAL_AUTO_START_PROMPT: "ozmb_global_auto_start_prompt_v1"' in new_runtime
          assert 'prompt_text: DEFAULT_AUTO_START_TEXT' not in new_worker
          assert 'const bootstrapPrompt = await getGlobalAutoStartPrompt();' in new_worker
          assert 'fakeConversation' not in new_worker and 'syntheticConversation' not in new_worker
          print('PRODUCTION_DIFF_SCOPE_EXACT_PASS')
          print('BUILTIN_DEFAULT_TEXT_UNCHANGED_PASS')
          print('MANIFEST_AND_ENTRY_UNCHANGED_PASS')
          print('WORK_REFRESH_ROUTE_BYTE_SEMANTICS_UNCHANGED_PASS')
          print('PROVIDER_REQUEST_CREDENTIAL_SURFACES_UNCHANGED_PASS')
          PY

      - name: Syntax check every final production JavaScript file
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do node --check "$file" >/dev/null; done < <(find "$DIST" -type f -name '*.js' | LC_ALL=C sort)
          echo ALL_FINAL_PRODUCTION_JS_SYNTAX_PASS

      - name: Run targeted bootstrap-prompt regression on candidate
        shell: bash
        run: |
          set -euo pipefail
          node "$TARGET_GATE" "$DIST"

      - name: Run accepted work-session model and pending-start regressions
        shell: bash
        run: |
          set -euo pipefail
          node "$ROOT/validation/WORK_SESSION_MODEL_REGRESSION_2026-08-21.mjs" "$DIST"
          node "$ROOT/validation/WORK_SESSION_PENDING_START_REGRESSION_2026-08-21.mjs" "$DIST"
          echo WORK_SESSION_MODEL_PENDING_START_REGRESSION_PASS

      - name: Classify historical refresh regression against base and candidate
        id: refresh
        shell: bash
        run: |
          set -euo pipefail
          TEST="$ROOT/validation/WORK_SESSION_REFRESH_REGRESSION_2026-08-23.mjs"
          BASE_WT="$RUNNER_TEMP/ozon-refresh-base"
          rm -rf "$BASE_WT"
          git worktree add --detach "$BASE_WT" "$BASE_AUTHORITY"
          set +e
          node "$TEST" "$BASE_WT/$DIST" > "$RUNNER_TEMP/refresh-base.log" 2>&1; B=$?
          node "$TEST" "$DIST" > "$RUNNER_TEMP/refresh-candidate.log" 2>&1; C=$?
          set -e
          cat "$RUNNER_TEMP/refresh-base.log"
          cat "$RUNNER_TEMP/refresh-candidate.log"
          git worktree remove --force "$BASE_WT"
          if [ "$B" -eq 0 ]; then
            test "$C" -eq 0
            echo 'refresh_guard_state=PASS_CURRENT' >> "$GITHUB_OUTPUT"
            echo HISTORICAL_REFRESH_GUARD_CURRENT_PASS
          else
            test "$C" -ne 0
            echo 'refresh_guard_state=BASELINE_STALE_SAME_RESULT' >> "$GITHUB_OUTPUT"
            echo HISTORICAL_REFRESH_GUARD_BASELINE_STALE_NOT_USED_FOR_FALSE_PASS
          fi

      - name: Run prior mixed HELP/API and command-envelope authority regressions
        shell: bash
        run: |
          set -euo pipefail
          node "$MIXED_GATE" .
          node "$DISABLED_MIXED_GATE" .
          node "$COMMAND_GATE" .
          echo PRIOR_MIXED_AND_COMMAND_ENVELOPE_REGRESSIONS_PASS

      - name: Run intersecting delivery lifecycle accounting regressions
        shell: bash
        run: |
          set -euo pipefail
          R="$ROOT/validation/regression"
          for gate in \
            run_file_delivery_capture_accounting.mjs \
            run_file_delivery_port_worker_state_machine.mjs \
            run_file_delivery_mixed_batch_policy.mjs \
            run_file_delivery_adapter_gate_policy.mjs \
            run_file_delivery_wake_lifecycle.mjs \
            run_file_delivery_live_stop_repro.mjs \
            run_direct_binary_provider_attachment_gate.mjs; do
            node "$R/$gate"
          done
          echo INTERSECTING_DELIVERY_LIFECYCLE_ACCOUNTING_PASS

      - name: Materialize exhaustive dependency-closure evidence
        shell: bash
        run: |
          set -euo pipefail
          OUT="$ROOT/validation/bootstrap-prompt-editable-new-chat-v1/DEPENDENCY_CLOSURE_2026-09-10.md"
          python3 - "$OUT" <<'PY'
          import sys
          from pathlib import Path
          root=Path('tooling/llm-api-bridges/ozon-seller')
          out=Path(sys.argv[1])
          tokens=[
              'DEFAULT_AUTO_START_TEXT','AUTO_START_PROMPTS','GLOBAL_AUTO_START_PROMPT',
              'auto_start_prompt','global_auto_start_prompt','OZ_SAVE_GLOBAL_SETTINGS',
              'OZ_SAVE_SETTINGS','OZ_RESET_AUTO_START_PROMPT','OZ_RESET_GLOBAL_AUTO_START_PROMPT',
              'OZ_WORK_START','getAutoStartPrompt','saveAutoStartPrompt','resetAutoStartPrompt',
              'getGlobalAutoStartPrompt','saveGlobalAutoStartPrompt','resetGlobalAutoStartPrompt'
          ]
          suffixes={'.js','.mjs','.py','.md','.json','.html','.txt','.yml','.yaml'}
          rows=[]
          for p in sorted(root.rglob('*')):
              if not p.is_file() or p.suffix.lower() not in suffixes: continue
              try: lines=p.read_text(encoding='utf-8').splitlines()
              except Exception: continue
              for no,line in enumerate(lines,1):
                  hit=[t for t in tokens if t in line]
                  if hit:
                      rows.append((p.relative_to(root).as_posix(),no,','.join(hit),line.strip()[:240]))
          text=['# Bootstrap prompt editable-new-chat dependency closure','',
                'Patch scope: add an editable global bootstrap prompt source for pre-identity new chats while preserving real conversation identity and per-conversation custom overrides.','',
                '## Producer/consumer search inventory','',
                '| path | line | tokens | excerpt |','|---|---:|---|---|']
          for path,no,hit,line in rows:
              line=line.replace('|','\\|')
              text.append(f'| `{path}` | {no} | `{hit}` | `{line}` |')
          text += ['', '## Closure classification','',
                   '- Production source of truth: `dist-step7-candidate`; historical `reference-*`, design docs, validation fixtures and previous artifacts are not loaded by the final manifest.',
                   '- Built-in `DEFAULT_AUTO_START_TEXT`: unchanged byte-for-byte in its definition block.',
                   '- New durable producer: `GLOBAL_AUTO_START_PROMPT` in existing `chrome.storage.local` wrapper.',
                   '- Global consumers: public/global settings state, popup Save All, global reset, and pre-identity `OZ_WORK_START`.',
                   '- Per-conversation consumers: existing `get/save/resetAutoStartPrompt`; explicit custom records win, legacy default copies migrate to global inheritance.',
                   '- Identity invariant: no temporary/fake conversation key is introduced; pending-start remains tab/origin/adapter/revision correlated.',
                   '- Lifecycle invariant: `OZ_WORK_REFRESH` route is unchanged; work-session model and pending-start regressions are run on the final candidate.',
                   '- Provider/request invariant: no manifest host, service-worker entry, provider request, credential, quota or transport surface is changed.',
                   '- UI invariant: only the new global prompt editor/reset remain available without conversation identity; current-conversation prompt/report/session controls keep the existing identity gate.',
                   '- Security/privacy: prompt text remains local extension configuration; no provider business request is performed by prompt save/reset/bootstrap resolution.',
                   '- Unaccounted changed dependencies: 0.',
                   '- Available-but-unverified pre-handoff dependency paths: 0.']
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text('\n'.join(text)+'\n',encoding='utf-8')
          print(f'DEPENDENCY_INVENTORY_ROWS={len(rows)}')
          print('DEPENDENCY_CLOSURE_MATERIALIZED_PASS')
          PY

      - name: Install pinned Chrome for Testing
        shell: bash
        run: |
          set -euo pipefail
          CFT_VERSION='152.0.7977.82'
          CFT_URL="https://storage.googleapis.com/chrome-for-testing-public/${CFT_VERSION}/linux64/chrome-linux64.zip"
          CFT_ROOT="$RUNNER_TEMP/chrome-for-testing-${CFT_VERSION}"
          ARCHIVE="$RUNNER_TEMP/chrome-for-testing-${CFT_VERSION}.zip"
          mkdir -p "$CFT_ROOT"
          curl --fail --location --silent --show-error "$CFT_URL" --output "$ARCHIVE"
          unzip -q "$ARCHIVE" -d "$CFT_ROOT"
          CFT_BIN="$CFT_ROOT/chrome-linux64/chrome"
          test -x "$CFT_BIN"
          "$CFT_BIN" --version | grep -F "$CFT_VERSION"
          echo "CFT_BIN=$CFT_BIN" >> "$GITHUB_ENV"
          echo PINNED_CHROME_INSTALL_PASS

      - name: Prove packaged architecture can bootstrap as a real MV3 extension
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a node "$ROOT/validation/regression/run_file_delivery_extension_worker_smoke.mjs" "$CFT_BIN" "$GITHUB_WORKSPACE/$DIST"
          echo MV3_CHROME_SERVICE_WORKER_BOOTSTRAP_PASS

      - name: Build deterministic exact ZIP and retest fresh extraction
        id: package
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/$DIST"
          STAGE="$RUNNER_TEMP/bootstrap-prompt-stage"
          EXTRACT="$RUNNER_TEMP/bootstrap-prompt-extract"
          INVENTORY="$RUNNER_TEMP/bootstrap-prompt-inventory.txt"
          OUT_DIR="$GITHUB_WORKSPACE/$ROOT/artifacts"
          OUT="$OUT_DIR/$ARTIFACT_NAME"
          OUT2="$RUNNER_TEMP/$ARTIFACT_NAME.rebuild.zip"
          rm -rf "$STAGE" "$EXTRACT"
          mkdir -p "$STAGE" "$EXTRACT" "$OUT_DIR"
          cp -a "$SRC/." "$STAGE/"
          find "$STAGE" -type f -exec touch -t 198001010000 {} +
          find "$STAGE" -type f -printf '%P\n' | LC_ALL=C sort > "$INVENTORY"
          test -s "$INVENTORY"
          rm -f "$OUT" "$OUT2"
          (cd "$STAGE" && zip -X -q "$OUT" -@ < "$INVENTORY")
          (cd "$STAGE" && zip -X -q "$OUT2" -@ < "$INVENTORY")
          cmp "$OUT" "$OUT2"
          unzip -q "$OUT" -d "$EXTRACT"
          diff -ruN "$SRC" "$EXTRACT"
          while IFS= read -r file; do case "$file" in *.js) node --check "$EXTRACT/$file" >/dev/null;; esac; done < "$INVENTORY"
          node "$TARGET_GATE" "$EXTRACT"
          SHA=$(sha256sum "$OUT" | awk '{print $1}')
          BYTES=$(wc -c < "$OUT" | tr -d ' ')
          printf '%s  %s\n' "$SHA" "$ARTIFACT_NAME" > "$OUT.sha256.txt"
          cat > "$OUT_DIR/$BUILDINFO_NAME" <<EOF
          base_authority=$BASE_AUTHORITY
          workflow_input_sha=$GITHUB_SHA
          runtime_version=0.1.19
          patch_scope=editable_global_bootstrap_prompt_before_conversation_identity
          built_in_default_text_changed=false
          manifest_changed=false
          service_worker_entry_changed=false
          provider_request_surface_changed=false
          credentials_quota_transport_changed=false
          target_prefx_intended_fail=PASS
          target_candidate=PASS
          per_conversation_override_isolation=PASS
          legacy_default_migration=PASS
          work_session_model_pending_start=PASS
          historical_refresh_guard=${{ steps.refresh.outputs.refresh_guard_state }}
          prior_mixed_command_envelope=PASS
          delivery_lifecycle_accounting=PASS
          mv3_chrome_worker_bootstrap=PASS
          deterministic_zip_rebuild=PASS
          fresh_extract_byte_equivalence=PASS
          fresh_extract_target_gate=PASS
          package_file=$ARTIFACT_NAME
          package_bytes=$BYTES
          package_sha256=$SHA
          EOF
          echo "package_sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "package_bytes=$BYTES" >> "$GITHUB_OUTPUT"
          echo "PACKAGE_SHA256=$SHA"
          echo "PACKAGE_BYTES=$BYTES"
          echo DETERMINISTIC_PACKAGE_FRESH_EXTRACT_PASS

      - name: Persist preliminary pre-handoff evidence
        shell: bash
        run: |
          set -euo pipefail
          REPORT="$ROOT/validation/bootstrap-prompt-editable-new-chat-v1/PREHANDOFF_EVIDENCE_2026-09-10.md"
          python3 - "$REPORT" "${{ steps.refresh.outputs.refresh_guard_state }}" "${{ steps.package.outputs.package_sha }}" "${{ steps.package.outputs.package_bytes }}" <<'PY'
          import sys
          from pathlib import Path
          out=Path(sys.argv[1]); refresh=sys.argv[2]; sha=sys.argv[3]; size=sys.argv[4]
          text=f'''# Editable bootstrap prompt before conversation identity — preliminary pre-handoff evidence

- operator authorization: PASS — `Делай патч, следуй правилам`
- base authority: `da762fec61f55793406dae96d9f8aaae757425f4`
- scope: only bootstrap/start-prompt editability before stable conversation identity
- separate Alice wording defect: OUT OF SCOPE
- built-in default wording changed: NO
- exact targeted regression on pre-fix: intended FAIL confirmed
- exact targeted regression on candidate: PASS
- custom per-conversation override isolation: PASS
- legacy default-copy migration to global inheritance: PASS
- work-session model/pending-start regressions: PASS
- historical refresh guard classification: `{refresh}`
- prior mixed HELP/API + command-envelope regressions: PASS
- intersecting delivery/lifecycle/accounting regressions: PASS
- manifest/service-worker entry: unchanged
- provider/request/credential/quota/transport surfaces: unchanged
- Chrome MV3 service-worker bootstrap: PASS
- package fresh-extract targeted regression: PASS
- package SHA-256: `{sha}`
- package bytes: `{size}`
- LIVE-GATE-01..05: PENDING POST-INSTALL

This is PRE-HANDOFF evidence only and is not LIVE certification.
'''
          out.write_text(text,encoding='utf-8')
          PY

      - name: Commit exact materialized candidate and artifact
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$DIST/service_worker.js" \
                  "$DIST/popup.js" \
                  "$DIST/popup.html" \
                  "$DIST/shared/runtime_names.js" \
                  "$ROOT/validation/bootstrap-prompt-editable-new-chat-v1/DEPENDENCY_CLOSURE_2026-09-10.md" \
                  "$ROOT/validation/bootstrap-prompt-editable-new-chat-v1/PREHANDOFF_EVIDENCE_2026-09-10.md" \
                  "$ROOT/artifacts/$ARTIFACT_NAME" \
                  "$ROOT/artifacts/$ARTIFACT_NAME.sha256.txt" \
                  "$ROOT/artifacts/$BUILDINFO_NAME"
          test -n "$(git diff --cached --name-only)"
          git commit -m 'repair(ozon): make bootstrap prompt editable before conversation identity'
          git push origin "HEAD:$PATCH_BRANCH"
          SHA=$(git rev-parse HEAD)
          TREE=$(git rev-parse HEAD^{tree})
          echo "source_sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "source_tree=$TREE" >> "$GITHUB_OUTPUT"
          echo "MATERIALIZED_SOURCE_SHA=$SHA"
          echo "MATERIALIZED_SOURCE_TREE=$TREE"

      - name: Upload exact installable candidate
        uses: actions/upload-artifact@v4
        with:
          name: ozon-bootstrap-prompt-editable-new-chat-${{ steps.commit.outputs.source_sha }}
          path: |
            tooling/llm-api-bridges/ozon-seller/artifacts/OZON_BRIDGE_v0.1.19_BOOTSTRAP_PROMPT_EDITABLE_NEW_CHAT_20260910.zip
            tooling/llm-api-bridges/ozon-seller/artifacts/OZON_BRIDGE_v0.1.19_BOOTSTRAP_PROMPT_EDITABLE_NEW_CHAT_20260910.zip.sha256.txt
            tooling/llm-api-bridges/ozon-seller/artifacts/OZON_BRIDGE_v0.1.19_BOOTSTRAP_PROMPT_EDITABLE_NEW_CHAT_20260910_BUILDINFO.txt
          if-no-files-found: error
          retention-days: 30

  windows-regression:
    needs: materialize-linux
    runs-on: windows-latest
    outputs:
      tested_sha: ${{ steps.identity.outputs.tested_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.materialize-linux.outputs.source_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'

      - name: Prove exact Linux-materialized source identity
        id: identity
        shell: pwsh
        run: |
          $sha = git rev-parse HEAD
          $expected = '${{ needs.materialize-linux.outputs.source_sha }}'
          if ($sha -ne $expected) { throw "source SHA drift: $sha != $expected" }
          "tested_sha=$sha" >> $env:GITHUB_OUTPUT
          Write-Output "WINDOWS_EXACT_SOURCE_SHA=$sha"

      - name: Syntax and targeted bootstrap-prompt regression on Windows
        shell: pwsh
        run: |
          Get-ChildItem -Path $env:DIST -Recurse -Filter *.js | Sort-Object FullName | ForEach-Object { node --check $_.FullName; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          node $env:TARGET_GATE $env:DIST; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node (Join-Path $env:ROOT 'validation/WORK_SESSION_MODEL_REGRESSION_2026-08-21.mjs') $env:DIST; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node (Join-Path $env:ROOT 'validation/WORK_SESSION_PENDING_START_REGRESSION_2026-08-21.mjs') $env:DIST; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output 'WINDOWS_BOOTSTRAP_PROMPT_AND_WORK_SESSION_PASS'

      - name: Run Windows shared-runtime regressions
        shell: pwsh
        run: |
          node $env:MIXED_GATE .; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node $env:DISABLED_MIXED_GATE .; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node $env:COMMAND_GATE .; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $r = Join-Path $env:ROOT 'validation/regression'
          foreach ($name in @(
            'run_file_delivery_capture_accounting.mjs',
            'run_file_delivery_port_worker_state_machine.mjs',
            'run_file_delivery_mixed_batch_policy.mjs',
            'run_file_delivery_adapter_gate_policy.mjs',
            'run_file_delivery_wake_lifecycle.mjs',
            'run_file_delivery_live_stop_repro.mjs',
            'run_direct_binary_provider_attachment_gate.mjs'
          )) {
            node (Join-Path $r $name)
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Write-Output 'WINDOWS_SHARED_RUNTIME_REGRESSIONS_PASS'

      - name: Verify exact committed artifact and fresh extraction on Windows
        shell: pwsh
        run: |
          $artifact = Join-Path (Join-Path $env:ROOT 'artifacts') $env:ARTIFACT_NAME
          $sidecar = "$artifact.sha256.txt"
          if (-not (Test-Path $artifact) -or -not (Test-Path $sidecar)) { throw 'artifact or sidecar missing' }
          $expected = ((Get-Content $sidecar -Raw).Trim() -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash -Algorithm SHA256 $artifact).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "artifact SHA mismatch: $actual != $expected" }
          if ($actual -ne '${{ needs.materialize-linux.outputs.package_sha }}') { throw 'Windows artifact differs from Linux package output' }
          $extract = Join-Path $env:RUNNER_TEMP 'bootstrap-extract'
          Expand-Archive -LiteralPath $artifact -DestinationPath $extract -Force
          node $env:TARGET_GATE $extract; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Output "WINDOWS_ARTIFACT_SHA256=$actual"
          Write-Output 'WINDOWS_EXACT_ARTIFACT_AND_EXTRACT_PASS'

