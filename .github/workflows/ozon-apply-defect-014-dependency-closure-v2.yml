name: Ozon apply DEFECT-014 dependency closure v2

on:
  push:
    branches:
      - research/ozon-product-demand-2026-09-02
    paths:
      - .github/workflows/ozon-apply-defect-014-dependency-closure-v2.yml
      - .github/scripts/apply_defect_014_dependency_closure_v2.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/ozon-product-demand-2026-09-02
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact dependency-closure v2
        shell: bash
        run: python .github/scripts/apply_defect_014_dependency_closure_v2.py
      - name: Verify full dependency closure before commit
        shell: bash
        run: |
          set -euo pipefail
          node --check tooling/llm-api-bridges/ozon-seller/dist-step7-candidate/shared/ozon_entitlements.js
          node --check tooling/llm-api-bridges/ozon-seller/dist-step7-candidate/shared/ozon_provider.js
          node tooling/llm-api-bridges/ozon-seller/validation/read-effect-repair-v1/run_provider_taxonomy_gate.mjs "$GITHUB_WORKSPACE"
          node tooling/llm-api-bridges/ozon-seller/validation/read-effect-repair-v1/run_report_file_workflow_gate.mjs "$GITHUB_WORKSPACE"
          node tooling/llm-api-bridges/ozon-seller/validation/read-effect-repair-v1/run_effect_read_repair_gate.mjs "$GITHUB_WORKSPACE"
      - name: Commit full dependency closure v2
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tooling/llm-api-bridges/ozon-seller/dist-step7-candidate/shared/ozon_entitlements.js \
            tooling/llm-api-bridges/ozon-seller/dist-step7-candidate/shared/ozon_provider.js \
            tooling/llm-api-bridges/ozon-seller/validation/read-effect-repair-v1/run_provider_taxonomy_gate.mjs \
            tooling/llm-api-bridges/ozon-seller/research/product/OZON_AI_WORKER_REPAIRED_26_READS_LIVE_DEFECT_014_2026-09-04.md \
            tooling/llm-api-bridges/ozon-seller/validation/read-effect-repair-v1/DEFECT_014_DEPENDENCY_CLOSURE_2026-09-04.md
          git diff --cached --check
          git commit -m "fix(ozon): finish DEFECT-014 provider dependency closure"
          git push origin HEAD:research/ozon-product-demand-2026-09-02
