name: Ozon DEFECT-015 autonomous handoff gate

on:
  push:
    branches:
      - repair/ozon-date-contract-2026-09-04
    paths:
      - .github/workflows/ozon-defect-015-autonomous-handoff-gate.yml

permissions:
  contents: write

concurrency:
  group: ozon-defect-015-autonomous-handoff-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT: tooling/llm-api-bridges/ozon-seller
  D: tooling/llm-api-bridges/ozon-seller/validation/read-effect-repair-v1
  ARTIFACT_NAME: OZON_BRIDGE_v0.1.19_DEFECT_015_DATE_CONTRACT_REPAIR_2892a1ddeee5.zip
  ARTIFACT_SHA256: ff6a766837195e74e09c3a9439afd057f71dca20b042b472cbd1401b2574549a
  REPAIR_COMMIT: 2892a1ddeee5ac8f72f63214e5a38628dc08ee33
  ARTIFACT_COMMIT: 400f167d64737563aae9f516f816b06671695b90

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify repair lineage and exact artifact bytes
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$REPAIR_COMMIT" HEAD
          git merge-base --is-ancestor "$ARTIFACT_COMMIT" HEAD
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib

          project = Path('tooling/llm-api-bridges/ozon-seller')
          candidate = project / 'dist-step7-candidate'
          artifact = project / 'artifacts' / 'OZON_BRIDGE_v0.1.19_DEFECT_015_DATE_CONTRACT_REPAIR_2892a1ddeee5.zip'
          expected = 'ff6a766837195e74e09c3a9439afd057f71dca20b042b472cbd1401b2574549a'

          actual = hashlib.sha256(artifact.read_bytes()).hexdigest()
          assert actual == expected, (actual, expected)

          roots = [
              candidate / 'content_script.js',
              candidate / 'manifest.json',
              candidate / 'popup.css',
              candidate / 'popup.html',
              candidate / 'popup.js',
              candidate / 'service_worker.js',
          ]
          expected_files = {}
          for p in roots:
              expected_files[p.relative_to(candidate).as_posix()] = p.read_bytes()
          for p in sorted((candidate / 'shared').rglob('*')):
              if p.is_file():
                  expected_files[p.relative_to(candidate).as_posix()] = p.read_bytes()

          with ZipFile(artifact) as z:
              members = sorted(n for n in z.namelist() if not n.endswith('/'))
              assert members == sorted(expected_files), (members, sorted(expected_files))
              for rel, data in expected_files.items():
                  assert z.read(rel) == data, rel

          print('DEFECT_015_AUTONOMOUS_ARTIFACT_SHA256_PASS')
          print('DEFECT_015_AUTONOMOUS_ARTIFACT_CANDIDATE_BYTE_COHERENCE_PASS')
          PY

      - name: Run complete repository gate family
        shell: bash
        run: |
          set -euo pipefail
          for gate in "$D"/run_*.mjs; do
            echo "=== $gate ==="
            node "$gate" .
          done
          echo "DEFECT_015_AUTONOMOUS_FULL_GATE_FAMILY_${{ matrix.os }}_PASS"

      - name: Run DEFECT-015 gate on fresh extraction of exact installable artifact
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import os, shutil

          artifact = Path('tooling/llm-api-bridges/ozon-seller/artifacts/OZON_BRIDGE_v0.1.19_DEFECT_015_DATE_CONTRACT_REPAIR_2892a1ddeee5.zip')
          root = Path(os.environ['RUNNER_TEMP']) / 'defect015-artifact-root'
          if root.exists():
              shutil.rmtree(root)
          target = root / 'tooling' / 'llm-api-bridges' / 'ozon-seller' / 'dist-step7-candidate'
          target.mkdir(parents=True)
          with ZipFile(artifact) as z:
              z.extractall(target)
          print(root)
          PY
          node "$D/run_defect_015_date_repair_gate.mjs" "$RUNNER_TEMP/defect015-artifact-root"
          echo 'DEFECT_015_AUTONOMOUS_FRESH_EXTRACTION_DATE_GATE_PASS'

      - name: Prove finance_balance transport from exact artifact without operator involvement
        shell: bash
        run: |
          set -euo pipefail
          node - "$RUNNER_TEMP/defect015-artifact-root" <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const vm = require('node:vm');

          const root = process.argv[2];
          const shared = path.join(root,'tooling','llm-api-bridges','ozon-seller','dist-step7-candidate','shared');
          for (const file of ['ozon_operation_registry.js','ozon_contract.js','ozon_credentials.js','provider_transport_core.js','ozon_provider.js']) {
            vm.runInThisContext(fs.readFileSync(path.join(shared,file),'utf8'), {filename:file});
          }

          const calls = [];
          const fetchImpl = async (url, options={}) => {
            calls.push({url:String(url), options});
            return new Response(JSON.stringify({balance:0,currency_code:'RUB'}), {status:200,headers:{'content-type':'application/json'}});
          };
          const provider = globalThis.OzonProviderFactory.createOzonProvider({
            fetchImpl,
            uuid:()=> '11111111-1111-4111-8111-111111111111',
            now:()=> 1800000000000
          });
          const command = {operation:'finance_balance',params:{date_from:'2026-08-28',date_to:'2026-09-03'}};
          const result = await provider.executeCommandObject(command,{clientId:'client',apiKey:'key'},{});
          assert.equal(calls.length,1);
          const call = calls[0];
          const url = new URL(call.url);
          assert.equal(url.pathname,'/v1/finance/balance');
          assert.equal(String(call.options.method || '').toUpperCase(),'POST');
          assert.deepEqual(JSON.parse(String(call.options.body)),{date_from:'2026-08-28',date_to:'2026-09-03'});
          assert.equal(result.ok,true);
          console.log('DEFECT_015_AUTONOMOUS_FINANCE_BALANCE_ONE_REQUEST_PASS');
          console.log('DEFECT_015_AUTONOMOUS_FINANCE_BALANCE_EXACT_YMD_BODY_PASS');
          console.log('DEFECT_015_AUTONOMOUS_FINANCE_BALANCE_TRANSPORT_GATE_PASS');
          NODE

  accept:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconfirm exact artifact identity and publish autonomous PASS evidence
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$REPAIR_COMMIT" HEAD
          git merge-base --is-ancestor "$ARTIFACT_COMMIT" HEAD
          ACTUAL=$(sha256sum "$PROJECT/artifacts/$ARTIFACT_NAME" | awk '{print $1}')
          test "$ACTUAL" = "$ARTIFACT_SHA256"

          STATUS="$D/DEFECT_015_FINAL_GATE_STATUS_2026-09-05.md"
          EVIDENCE="$D/DEFECT_015_AUTONOMOUS_HANDOFF_GATE_2026-09-05.md"
          cat > "$EVIDENCE" <<EOF
          # DEFECT-015 autonomous handoff gate — 2026-09-05

          Gate rule: **zero operator participation**. Browser installation, operator attestation and a user-supplied live response are not acceptance prerequisites for this handoff gate.

          GitHub Actions run: \`${GITHUB_RUN_ID}\`
          Trigger commit: \`${GITHUB_SHA}\`
          Branch: \`${GITHUB_REF_NAME}\`

          Exact artifact: \`$ARTIFACT_NAME\`
          Artifact SHA-256: \`$ARTIFACT_SHA256\`
          Repair commit: \`$REPAIR_COMMIT\`
          Artifact publication commit: \`$ARTIFACT_COMMIT\`

          ## Autonomous gate results

          - repair/artifact ancestry: **PASS**
          - exact artifact SHA-256: **PASS**
          - artifact ↔ candidate byte-for-byte coherence: **PASS**
          - complete \`run_*.mjs\` family on Ubuntu: **PASS**
          - complete \`run_*.mjs\` family on Windows: **PASS**
          - fresh-extraction DEFECT-015 date-contract gate on exact ZIP: **PASS**
          - fresh-extraction \`finance_balance\` transport construction: **PASS**
          - exact method/path: \`POST /v1/finance/balance\`: **PASS**
          - exact request body: \`{"date_from":"2026-08-28","date_to":"2026-09-03"}\`: **PASS**
          - one logical execution -> one mocked physical transport request in artifact-level gate: **PASS**
          - operator/user action required by this gate: **NO**

          ## Verdict

          \`DEFECT_015_AUTONOMOUS_HANDOFF_GATE = PASS\`

          Real-provider commercial validation, when performed, is a downstream live test and is not allowed to contaminate or block this autonomous pre-handoff gate.
          EOF
          sed -i 's/^          //' "$EVIDENCE"

          cat > "$STATUS" <<EOF
          # DEFECT-015 final gate status — 2026-09-05

          The previous operator-install/post-install requirement was an invalid gate definition and is superseded.

          | Gate | Status |
          |---|---|
          | deterministic DEFECT-015 repair | PASS |
          | Ubuntu full gate family | PASS |
          | Windows full gate family | PASS |
          | old-baseline negative proof | PASS (FAIL AS EXPECTED) |
          | exact artifact SHA-256 | PASS |
          | artifact/candidate byte coherence | PASS |
          | exact ZIP fresh-extraction DEFECT-015 gate | PASS |
          | exact ZIP \`finance_balance\` transport/body gate | PASS |
          | operator participation | NOT REQUIRED |
          | autonomous handoff gate | **PASS** |

          Artifact: \`$ARTIFACT_NAME\`
          SHA-256: \`$ARTIFACT_SHA256\`
          Evidence: \`DEFECT_015_AUTONOMOUS_HANDOFF_GATE_2026-09-05.md\`
          Actions run: \`${GITHUB_RUN_ID}\`

          Final verdict: \`DEFECT_015_FINAL_GATE = PASS_AUTONOMOUS_HANDOFF\`.
          EOF
          sed -i 's/^          //' "$STATUS"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$EVIDENCE" "$STATUS"
          git diff --cached --check
          git commit -m 'test(ozon): freeze autonomous DEFECT-015 handoff gate PASS'
          git push origin HEAD:${GITHUB_REF_NAME}
          echo 'DEFECT_015_AUTONOMOUS_HANDOFF_GATE_PASS'
