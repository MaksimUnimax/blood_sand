name: Ozon B35 Marketplace Search Query Reads exact candidate
on:
  push:
    branches: [feature/ozon-b35-marketplace-search-query-reads-2026-08-28]
    paths:
      - .github/workflows/ozon-b35-exact-candidate.yml
      - tooling/llm-api-bridges/ozon-seller/validation/PATCH_B35_MARKETPLACE_SEARCH_QUERY_READS_2026-08-28.patch.gz
      - tooling/llm-api-bridges/ozon-seller/validation/materialize_patch_b35_marketplace_search_query_reads_candidate.py
      - tooling/llm-api-bridges/ozon-seller/validation/PATCH_B35_MARKETPLACE_SEARCH_QUERY_READS_REGRESSION_2026-08-28.mjs
      - tooling/llm-api-bridges/ozon-seller/validation/PATCH_B35_MARKETPLACE_SEARCH_QUERY_READS_CANDIDATE_EVIDENCE_2026-08-28.md
      - tooling/llm-api-bridges/ozon-seller/validation/PATCH_B35_MARKETPLACE_SEARCH_QUERY_READS_CANDIDATE_MANIFEST_2026-08-28.md
permissions: {contents: read}
jobs:
  linux-materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify B35 patch transport identity
        run: python3 -c "import gzip,hashlib,pathlib;p=pathlib.Path('tooling/llm-api-bridges/ozon-seller/validation/PATCH_B35_MARKETPLACE_SEARCH_QUERY_READS_2026-08-28.patch.gz');c=p.read_bytes();assert hashlib.sha256(c).hexdigest()=='da5657dc217c9daa08eb4c39b01a72dc18a4e125d658b34f0ce2f01d7eac6205';assert hashlib.sha256(gzip.decompress(c)).hexdigest()=='234a2fe59e551a010185b780feb8c386473c76fed2d365353f1bed82233f5689'"
      - name: Materialize exact B35 candidate
        run: python3 tooling/llm-api-bridges/ozon-seller/validation/materialize_patch_b35_marketplace_search_query_reads_candidate.py --repo-root . --work-root /tmp/ozon-b35-work --out /tmp/ozon-b35-exact
      - name: Verify B34 base and B35 gates
        run: |
          node tooling/llm-api-bridges/ozon-seller/validation/PATCH_B34_STOCK_ANALYTICS_EXTENDED_READS_REGRESSION_2026-08-28.mjs /tmp/ozon-b35-work/b34-base
          node tooling/llm-api-bridges/ozon-seller/validation/PATCH_B35_MARKETPLACE_SEARCH_QUERY_READS_REGRESSION_2026-08-28.mjs /tmp/ozon-b35-exact
          find /tmp/ozon-b35-exact -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - uses: actions/upload-artifact@v4
        with: {name: ozon-b35-marketplace-search-query-reads-candidate, path: /tmp/ozon-b35-exact, if-no-files-found: error, retention-days: 3}
  windows-materialize:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable Git long paths
        shell: pwsh
        run: git config --global core.longpaths true
      - name: Verify B35 patch transport identity
        shell: pwsh
        run: python -c "import gzip,hashlib,pathlib;p=pathlib.Path('tooling/llm-api-bridges/ozon-seller/validation/PATCH_B35_MARKETPLACE_SEARCH_QUERY_READS_2026-08-28.patch.gz');c=p.read_bytes();assert hashlib.sha256(c).hexdigest()=='da5657dc217c9daa08eb4c39b01a72dc18a4e125d658b34f0ce2f01d7eac6205';assert hashlib.sha256(gzip.decompress(c)).hexdigest()=='234a2fe59e551a010185b780feb8c386473c76fed2d365353f1bed82233f5689'"
      - name: Materialize exact B35 candidate
        shell: pwsh
        run: |
          $work='C:\b35w'; $out='C:\b35o'
          python tooling/llm-api-bridges/ozon-seller/validation/materialize_patch_b35_marketplace_search_query_reads_candidate.py --repo-root . --work-root $work --out $out
      - name: Verify B34 base and B35 gates
        shell: pwsh
        run: |
          $work='C:\b35w'; $out='C:\b35o'; $b34=Join-Path $work 'b34-base'
          node tooling/llm-api-bridges/ozon-seller/validation/PATCH_B34_STOCK_ANALYTICS_EXTENDED_READS_REGRESSION_2026-08-28.mjs $b34; if($LASTEXITCODE-ne 0){exit $LASTEXITCODE}
          node tooling/llm-api-bridges/ozon-seller/validation/PATCH_B35_MARKETPLACE_SEARCH_QUERY_READS_REGRESSION_2026-08-28.mjs $out; if($LASTEXITCODE-ne 0){exit $LASTEXITCODE}
          Get-ChildItem $out -Recurse -Filter *.js | ForEach-Object {node --check $_.FullName;if($LASTEXITCODE-ne 0){exit $LASTEXITCODE}}
