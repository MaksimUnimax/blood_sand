name: Ozon report expiry final pre-handoff
on:
  push:
    branches: [repair/ozon-report-file-expiry-2026-09-12]
    paths:
      - '.github/workflows/ozon-report-expiry-final-prehandoff-2026-09-12.yml'
      - 'tooling/llm-api-bridges/ozon-seller/validation/**'
permissions:
  contents: read
concurrency:
  group: ozon-report-expiry-final-prehandoff
  cancel-in-progress: false
env:
  ROOT: tooling/llm-api-bridges/ozon-seller
  GATE: tooling/llm-api-bridges/ozon-seller/validation/report-file-expiry-v1
  BRANCH: repair/ozon-report-file-expiry-2026-09-12
  NAME: OZON_BRIDGE_v0.1.19_REPORT_FILE_EXPIRY_20260912.zip
jobs:
  linux-authoritative:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '24.12.0'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Build deterministic ZIP and run all Linux checks on canonical extracted bytes
        run: python "$GATE/run_suite.py" linux
      - uses: actions/upload-artifact@v4
        with:
          name: ozon-report-expiry-exact-package
          path: |
            ${{ env.ROOT }}/artifacts/${{ env.NAME }}
            ${{ env.ROOT }}/artifacts/${{ env.NAME }}.sha256.txt
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ozon-report-expiry-linux-evidence
          path: ${{ runner.temp }}/expiry-evidence/linux
          retention-days: 30
  browser-authoritative:
    needs: linux-authoritative
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '24.12.0'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v4
        with:
          name: ozon-report-expiry-exact-package
          path: ${{ env.ROOT }}/artifacts
      - name: Pinned Chrome real worker recreation and complete delivery regressions on identical ZIP
        shell: bash
        run: |
          set -euo pipefail
          VER='152.0.7977.82'
          curl --fail --location --silent --show-error "https://storage.googleapis.com/chrome-for-testing-public/${VER}/linux64/chrome-linux64.zip" -o "$RUNNER_TEMP/chrome.zip"
          echo "0704631fb3e4f741092e08f55272f90abc3e307f991f05f332924364415b02e0  $RUNNER_TEMP/chrome.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/chrome.zip" -d "$RUNNER_TEMP/chrome"
          mkdir -p "$RUNNER_TEMP/expiry-evidence/browser"
          sha256sum "$RUNNER_TEMP/chrome.zip" > "$RUNNER_TEMP/expiry-evidence/browser/chrome-archive.sha256"
          python "$GATE/run_suite.py" browser "$RUNNER_TEMP/chrome/chrome-linux64/chrome"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ozon-report-expiry-browser-evidence
          path: ${{ runner.temp }}/expiry-evidence/browser
          retention-days: 30
  windows-authoritative:
    needs: browser-authoritative
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '24.12.0'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v4
        with:
          name: ozon-report-expiry-exact-package
          path: ${{ env.ROOT }}/artifacts
      - name: Full Windows suite and Git-blob parity of the unchanged Linux ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python "$env:GATE/run_suite.py" windows
          if ($LASTEXITCODE -ne 0) { throw 'Windows authoritative suite failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ozon-report-expiry-windows-evidence
          path: ${{ runner.temp }}/expiry-evidence/windows
          retention-days: 30
  finalize-evidence:
    needs: [linux-authoritative, browser-authoritative, windows-authoritative]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v4
        with:
          name: ozon-report-expiry-exact-package
          path: ${{ env.ROOT }}/artifacts
      - uses: actions/download-artifact@v4
        with:
          name: ozon-report-expiry-linux-evidence
          path: ${{ runner.temp }}/all-expiry-evidence/linux
      - uses: actions/download-artifact@v4
        with:
          name: ozon-report-expiry-browser-evidence
          path: ${{ runner.temp }}/all-expiry-evidence/browser
      - uses: actions/download-artifact@v4
        with:
          name: ozon-report-expiry-windows-evidence
          path: ${{ runner.temp }}/all-expiry-evidence/windows
      - name: Check every evidence hash and publish final reports with the exact tested package
        shell: bash
        run: |
          set -euo pipefail
          python "$GATE/finalize.py"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$ROOT/PATCH_REPORT_FILE_EXPIRY_2026-09-12.md" "$ROOT/PATCH_REPORT_FILE_EXPIRY_DEPENDENCIES_2026-09-12.md" "$ROOT/PATCH_REPORT_FILE_EXPIRY_GATE_2026-09-12.md"
          git add "$ROOT/artifacts/$NAME" "$ROOT/artifacts/$NAME.sha256.txt" "$ROOT/artifacts/$NAME.BUILDINFO.json" "$ROOT/artifacts/$NAME.evidence.zip"
          git diff --cached --check
          test -z "$(git diff --cached --name-only -- "$ROOT/dist-step7-candidate")"
          git commit -m 'docs(ozon): finalize report-file expiry exact-package pre-handoff PASS'
          git push origin "HEAD:refs/heads/$BRANCH"
          mkdir -p "$RUNNER_TEMP/final-handoff"
          cp "$ROOT/artifacts/$NAME"* "$RUNNER_TEMP/final-handoff/"
          cp "$ROOT/PATCH_REPORT_FILE_EXPIRY"*.md "$RUNNER_TEMP/final-handoff/"
          cp "$GATE/EXECUTABLE.json" "$RUNNER_TEMP/final-handoff/"
          git rev-parse HEAD > "$RUNNER_TEMP/final-handoff/FINAL_EVIDENCE_HEAD.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: ozon-report-expiry-final-handoff
          path: ${{ runner.temp }}/final-handoff
          retention-days: 30
