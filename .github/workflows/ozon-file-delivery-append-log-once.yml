name: Ozon file-delivery append-only evidence once

on:
  push:
    branches:
      - handoff/ozon-file-delivery-append-log-2026-09-08

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target patch branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: repair/ozon-multi-ai-file-delivery-2026-09-08

      - name: Append immutable operational evidence and push
        shell: bash
        env:
          ENTRY_B64: ''
        run: |
          set -euo pipefail
          FILE='tooling/llm-api-bridges/ozon-seller/OZON_BRIDGE_APPEND_ONLY_DOCUMENTATION.md'
          MARKER='## 2026-09-08 — multi-AI file delivery / large-result corrective pre-handoff PASS'
          if grep -Fq "$MARKER" "$FILE"; then
            echo 'APPEND_ONLY_RECORD_ALREADY_PRESENT=PASS'
            exit 0
          fi
          printf '\n' >> "$FILE"
          printf '%s' "$ENTRY_B64" | base64 --decode >> "$FILE"
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$FILE"
          git commit -m 'docs(ozon): append final file-delivery pre-handoff evidence'
          git push origin HEAD:repair/ozon-multi-ai-file-delivery-2026-09-08
          git ls-remote origin refs/heads/repair/ozon-multi-ai-file-delivery-2026-09-08
