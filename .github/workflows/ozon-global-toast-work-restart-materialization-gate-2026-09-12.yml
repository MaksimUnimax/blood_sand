# authoritative targeted gate after exact Work restart payload recovery, four-file dependency audit, and legacy verifier ownership correction
name: Ozon global plaque + repeated Work Start materialization gate
run-name: Ozon targeted materialization · ${{ github.ref_name }} · ${{ github.sha }}

on:
  push:
    branches: [repair/ozon-global-toast-work-restart-2026-09-11]
    paths:
      - '.github/workflows/ozon-global-toast-work-restart-materialization-gate-2026-09-12.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ROOT: tooling/llm-api-bridges/ozon-seller
  DIST: tooling/llm-api-bridges/ozon-seller/dist-step7-candidate
  GATE: tooling/llm-api-bridges/ozon-seller/validation/global-toast-work-restart-v1
  BASE_EXECUTABLE_SHA: 4fb9c1a859ce7245101e47ffa6e189026e386d8f

jobs:
  targeted-materialization:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '24.12.0'}
      - name: Decode, scope-audit, apply in ephemeral dist tree, and run behavioral gates
        shell: bash
        run: |
          set -euo pipefail
          PATCH="$RUNNER_TEMP/production.patch"
          IDLE="$RUNNER_TEMP/run_attachment_idle_behavior.mjs"
          WORK="$RUNNER_TEMP/run_work_restart_extended.mjs"
          OLD_WORK_GATE="$(find "$ROOT/validation" -type f -name 'WORK_SESSION_PENDING_START_REGRESSION_2026-08-21.mjs' -print -quit)"
          test -n "$OLD_WORK_GATE"

          python3 - "$GATE/production.patch.gz.b64" "$PATCH" "$GATE/run_attachment_idle_behavior.mjs.gz.b64" "$IDLE" "$GATE/run_work_restart_extended.mjs.gz.b64" "$WORK" <<'PY'
          import base64, gzip, pathlib, re, sys
          pairs = list(zip(sys.argv[1::2], sys.argv[2::2]))
          allowed = re.compile(rb'^[A-Za-z0-9+/]*={0,2}$')
          for source, target in pairs:
              raw = pathlib.Path(source).read_bytes()
              normalized = b''.join(raw.split())
              remainder = len(normalized) % 4
              print(f'PAYLOAD source={source} raw_chars={len(raw)} normalized_chars={len(normalized)} mod4={remainder}')
              if not allowed.fullmatch(normalized):
                  bad = sorted(set(re.sub(rb'[A-Za-z0-9+/=]', b'', normalized)))
                  raise SystemExit(f'PAYLOAD_INVALID_NONWHITESPACE source={source} bad={bad!r}')
              if remainder == 1:
                  raise SystemExit(f'PAYLOAD_IMPOSSIBLE_BASE64_LENGTH source={source} chars={len(normalized)}')
              if remainder in (2, 3):
                  pad = 4 - remainder
                  normalized += b'=' * pad
                  print(f'PAYLOAD_PADDING_NORMALIZED source={source} added={pad}')
              compressed = base64.b64decode(normalized, validate=True)
              decoded = gzip.decompress(compressed)
              pathlib.Path(target).write_bytes(decoded)
              print(f'PAYLOAD_DECODE_PASS source={source} decoded_bytes={len(decoded)}')
          PY

          echo '--- PATCH STAT ---'
          git -C "$DIST" apply --stat "$PATCH"
          echo '--- PATCH-LOCAL PATHS ---'
          sed -n 's#^+++ b/##p' "$PATCH" | sort -u | tee "$RUNNER_TEMP/patch_paths.txt"
          cat > "$RUNNER_TEMP/expected_patch_paths.txt" <<'EOF'
          attachment_delivery_port_content.js
          attachment_delivery_wake_content.js
          content_script.js
          service_worker.js
          EOF
          diff -u "$RUNNER_TEMP/expected_patch_paths.txt" "$RUNNER_TEMP/patch_paths.txt"
          test "$(wc -l < "$RUNNER_TEMP/patch_paths.txt")" -eq 4

          # Exact branch production must still be byte-identical to the accepted executable before ephemeral apply.
          test -z "$(git diff --name-only "$BASE_EXECUTABLE_SHA"..HEAD -- "$DIST")"
          echo '--- LEGACY WORK GATE ON UNPATCHED BASELINE ---'
          node "$OLD_WORK_GATE" "$DIST"
          echo 'LEGACY_WORK_GATE_BASELINE_PASS'

          git -C "$DIST" apply --check "$PATCH"
          git -C "$DIST" apply "$PATCH"

          echo '--- REPO-RELATIVE CHANGED PATHS ---'
          cat > "$RUNNER_TEMP/expected_repo_paths.txt" <<'EOF'
          tooling/llm-api-bridges/ozon-seller/dist-step7-candidate/attachment_delivery_port_content.js
          tooling/llm-api-bridges/ozon-seller/dist-step7-candidate/attachment_delivery_wake_content.js
          tooling/llm-api-bridges/ozon-seller/dist-step7-candidate/content_script.js
          tooling/llm-api-bridges/ozon-seller/dist-step7-candidate/service_worker.js
          EOF
          git diff --name-only -- "$DIST" | sort | tee "$RUNNER_TEMP/actual_repo_paths.txt"
          diff -u "$RUNNER_TEMP/expected_repo_paths.txt" "$RUNNER_TEMP/actual_repo_paths.txt"
          test "$(wc -l < "$RUNNER_TEMP/actual_repo_paths.txt")" -eq 4

          git diff --check
          node --check "$DIST/attachment_delivery_port_content.js"
          node --check "$DIST/attachment_delivery_wake_content.js"
          node --check "$DIST/content_script.js"
          node --check "$DIST/service_worker.js"

          # No provider/network semantics or hidden automatic provider loops may be added.
          git diff -U0 -- "$DIST" | grep '^+' | grep -v '^+++' > "$RUNNER_TEMP/added_lines.txt" || true
          if grep -E '(fetch\(|XMLHttpRequest|report_file_get|OZON_API_V1)' "$RUNNER_TEMP/added_lines.txt"; then
            echo 'FORBIDDEN_PROVIDER_NETWORK_ADDITION=YES' >&2
            exit 1
          fi
          if grep -Ei '(retry|refetch|resend|paginate|pagination|fan.?out)[[:space:]]*\(' "$RUNNER_TEMP/added_lines.txt"; then
            echo 'FORBIDDEN_HIDDEN_AUTOMATION_CALL_ADDITION=YES' >&2
            exit 1
          fi

          echo '--- POSTFIX IDLE/ACTIVE ATTACHMENT BEHAVIOR ---'
          node "$IDLE" "$DIST" | tee "$RUNNER_TEMP/idle.log"
          echo '--- POSTFIX REPEATED WORK START BEHAVIOR ---'
          node "$WORK" "$DIST" | tee "$RUNNER_TEMP/work.log"
          echo '--- LEGACY WORK GATE ON CORRECTED TREE ---'
          node "$OLD_WORK_GATE" "$DIST"
          echo 'LEGACY_WORK_GATE_CORRECTED_TREE_PASS'

          echo 'TARGETED_MATERIALIZATION_SCOPE=PASS'
          echo 'TARGETED_BEHAVIORAL_GATES=PASS'
          echo 'provider_calls_during_patch_gate=0'
