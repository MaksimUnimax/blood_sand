name: Ozon B47 Unpaid Legal Products exact candidate
on:
  push:
    branches: [feature/ozon-b47-unpaid-legal-products-2026-08-28]
    paths:
      - .github/workflows/ozon-b47-exact-candidate.yml
      - tooling/llm-api-bridges/ozon-seller/validation/PATCH_B47_UNPAID_LEGAL_PRODUCTS_2026-08-28.patch.gz
      - tooling/llm-api-bridges/ozon-seller/validation/materialize_patch_b47_unpaid_legal_products_candidate.py
      - tooling/llm-api-bridges/ozon-seller/validation/PATCH_B47_UNPAID_LEGAL_PRODUCTS_REGRESSION_2026-08-28.mjs
      - tooling/llm-api-bridges/ozon-seller/validation/PATCH_B47_UNPAID_LEGAL_PRODUCTS_CANDIDATE_EVIDENCE_2026-08-28.md
      - tooling/llm-api-bridges/ozon-seller/validation/PATCH_B47_UNPAID_LEGAL_PRODUCTS_CANDIDATE_MANIFEST_2026-08-28.md
permissions: {contents: read}
jobs:
  linux-materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify B47 patch transport identity
        run: python3 -c "import gzip,hashlib,pathlib;p=pathlib.Path('tooling/llm-api-bridges/ozon-seller/validation/PATCH_B47_UNPAID_LEGAL_PRODUCTS_2026-08-28.patch.gz');c=p.read_bytes();assert hashlib.sha256(c).hexdigest()=='c13dccd9ce2fedc23d3de586276795d479080067b21680857dd0735e522710af';assert hashlib.sha256(gzip.decompress(c)).hexdigest()=='3e7c6f766baf2c5acc580ce5e2f9482518e92f3aa150d5a05b9560dc713c79e5'"
      - name: Materialize exact B47 candidate
        run: python3 tooling/llm-api-bridges/ozon-seller/validation/materialize_patch_b47_unpaid_legal_products_candidate.py --repo-root . --work-root /tmp/ozon-b47-work --out /tmp/ozon-b47-exact
      - name: Verify B46 base and B47 gates
        run: |
          node tooling/llm-api-bridges/ozon-seller/validation/PATCH_B46_FBS_POSTING_CANCEL_REASON_REGRESSION_2026-08-28.mjs /tmp/ozon-b47-work/b46-base
          node tooling/llm-api-bridges/ozon-seller/validation/PATCH_B47_UNPAID_LEGAL_PRODUCTS_REGRESSION_2026-08-28.mjs /tmp/ozon-b47-exact
          find /tmp/ozon-b47-exact -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - uses: actions/upload-artifact@v4
        with: {name: ozon-b47-unpaid-legal-products-candidate, path: /tmp/ozon-b47-exact, if-no-files-found: error, retention-days: 3}
  windows-materialize:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable Git long paths
        shell: pwsh
        run: git config --system core.longpaths true
      - name: Verify B47 patch transport identity
        shell: pwsh
        run: python -c "import gzip,hashlib,pathlib;p=pathlib.Path('tooling/llm-api-bridges/ozon-seller/validation/PATCH_B47_UNPAID_LEGAL_PRODUCTS_2026-08-28.patch.gz');c=p.read_bytes();assert hashlib.sha256(c).hexdigest()=='c13dccd9ce2fedc23d3de586276795d479080067b21680857dd0735e522710af';assert hashlib.sha256(gzip.decompress(c)).hexdigest()=='3e7c6f766baf2c5acc580ce5e2f9482518e92f3aa150d5a05b9560dc713c79e5'"
      - name: Materialize exact B47 candidate
        shell: pwsh
        run: |
          $work='C:\b47w'; $out='C:\b47o'
          python tooling/llm-api-bridges/ozon-seller/validation/materialize_patch_b47_unpaid_legal_products_candidate.py --repo-root . --work-root $work --out $out
      - name: Verify B46 base and B47 gates
        shell: pwsh
        run: |
          $work='C:\b47w'; $out='C:\b47o'; $b46=Join-Path $work 'b46-base'
          node tooling/llm-api-bridges/ozon-seller/validation/PATCH_B46_FBS_POSTING_CANCEL_REASON_REGRESSION_2026-08-28.mjs $b46; if($LASTEXITCODE-ne 0){exit $LASTEXITCODE}
          node tooling/llm-api-bridges/ozon-seller/validation/PATCH_B47_UNPAID_LEGAL_PRODUCTS_REGRESSION_2026-08-28.mjs $out; if($LASTEXITCODE-ne 0){exit $LASTEXITCODE}
          Get-ChildItem $out -Recurse -Filter *.js | ForEach-Object {node --check $_.FullName;if($LASTEXITCODE-ne 0){exit $LASTEXITCODE}}
