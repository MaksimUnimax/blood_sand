name: Ozon B43 FBP Posting Reads exact candidate
on:
  push:
    branches: [feature/ozon-b43-fbp-posting-reads-2026-08-28]
    paths:
      - .github/workflows/ozon-b43-exact-candidate.yml
      - tooling/llm-api-bridges/ozon-seller/validation/PATCH_B43_FBP_POSTING_READS_2026-08-28.patch.gz
      - tooling/llm-api-bridges/ozon-seller/validation/materialize_patch_b43_fbp_posting_reads_candidate.py
      - tooling/llm-api-bridges/ozon-seller/validation/PATCH_B43_FBP_POSTING_READS_REGRESSION_2026-08-28.mjs
      - tooling/llm-api-bridges/ozon-seller/validation/PATCH_B43_FBP_POSTING_READS_CANDIDATE_EVIDENCE_2026-08-28.md
      - tooling/llm-api-bridges/ozon-seller/validation/PATCH_B43_FBP_POSTING_READS_CANDIDATE_MANIFEST_2026-08-28.md
permissions: {contents: read}
jobs:
  linux-materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify B43 patch transport identity
        run: python3 -c "import gzip,hashlib,pathlib;p=pathlib.Path('tooling/llm-api-bridges/ozon-seller/validation/PATCH_B43_FBP_POSTING_READS_2026-08-28.patch.gz');c=p.read_bytes();assert hashlib.sha256(c).hexdigest()=='fe9eb4e3c73680625eef77cd83f7878850b1d32d67d30f3c7572a1770a3f3650';assert hashlib.sha256(gzip.decompress(c)).hexdigest()=='40c1d3ba8b9369b4ab5e045c7af9e2a9b296dc0c86f380da9f7c62a8150e84ce'"
      - name: Materialize exact B43 candidate
        run: python3 tooling/llm-api-bridges/ozon-seller/validation/materialize_patch_b43_fbp_posting_reads_candidate.py --repo-root . --work-root /tmp/ozon-b43-work --out /tmp/ozon-b43-exact
      - name: Verify B42 base and B43 gates
        run: |
          node tooling/llm-api-bridges/ozon-seller/validation/PATCH_B42_FBS_WAREHOUSE_SETUP_REFERENCE_READS_REGRESSION_2026-08-28.mjs /tmp/ozon-b43-work/b42-base
          node tooling/llm-api-bridges/ozon-seller/validation/PATCH_B43_FBP_POSTING_READS_REGRESSION_2026-08-28.mjs /tmp/ozon-b43-exact
          find /tmp/ozon-b43-exact -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - uses: actions/upload-artifact@v4
        with: {name: ozon-b43-fbp-posting-reads-candidate, path: /tmp/ozon-b43-exact, if-no-files-found: error, retention-days: 3}
  windows-materialize:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable Git long paths
        shell: pwsh
        run: git config --system core.longpaths true
      - name: Verify B43 patch transport identity
        shell: pwsh
        run: python -c "import gzip,hashlib,pathlib;p=pathlib.Path('tooling/llm-api-bridges/ozon-seller/validation/PATCH_B43_FBP_POSTING_READS_2026-08-28.patch.gz');c=p.read_bytes();assert hashlib.sha256(c).hexdigest()=='fe9eb4e3c73680625eef77cd83f7878850b1d32d67d30f3c7572a1770a3f3650';assert hashlib.sha256(gzip.decompress(c)).hexdigest()=='40c1d3ba8b9369b4ab5e045c7af9e2a9b296dc0c86f380da9f7c62a8150e84ce'"
      - name: Materialize exact B43 candidate
        shell: pwsh
        run: |
          $work='C:\b43w'; $out='C:\b43o'
          python tooling/llm-api-bridges/ozon-seller/validation/materialize_patch_b43_fbp_posting_reads_candidate.py --repo-root . --work-root $work --out $out
      - name: Verify B42 base and B43 gates
        shell: pwsh
        run: |
          $work='C:\b43w'; $out='C:\b43o'; $b42=Join-Path $work 'b42-base'
          node tooling/llm-api-bridges/ozon-seller/validation/PATCH_B42_FBS_WAREHOUSE_SETUP_REFERENCE_READS_REGRESSION_2026-08-28.mjs $b42; if($LASTEXITCODE-ne 0){exit $LASTEXITCODE}
          node tooling/llm-api-bridges/ozon-seller/validation/PATCH_B43_FBP_POSTING_READS_REGRESSION_2026-08-28.mjs $out; if($LASTEXITCODE-ne 0){exit $LASTEXITCODE}
          Get-ChildItem $out -Recurse -Filter *.js | ForEach-Object {node --check $_.FullName;if($LASTEXITCODE-ne 0){exit $LASTEXITCODE}}
