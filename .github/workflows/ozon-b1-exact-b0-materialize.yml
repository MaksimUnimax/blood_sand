name: Ozon B1 exact candidate

on:
  push:
    branches:
      - feature/ozon-b1-assortment-master-contracts-2026-08-25
    paths:
      - .gitattributes
      - .github/workflows/ozon-b1-exact-b0-materialize.yml
      - tooling/llm-api-bridges/ozon-seller/validation/PATCH_B1_ASSORTMENT_MASTER_2026-08-26.patch
      - tooling/llm-api-bridges/ozon-seller/validation/materialize_patch_b1_assortment_master_candidate.py
      - tooling/llm-api-bridges/ozon-seller/validation/PATCH_B1_ASSORTMENT_MASTER_REGRESSION_2026-08-26.mjs
      - tooling/llm-api-bridges/ozon-seller/validation/PATCH_B1_ASSORTMENT_MASTER_CANDIDATE_MANIFEST_2026-08-26.md
      - tooling/llm-api-bridges/ozon-seller/validation/PATCH_B1_ASSORTMENT_MASTER_IMPLEMENTATION_RESULT_2026-08-26.md

permissions:
  contents: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Materialize exact B1 candidate
        run: |
          python3 tooling/llm-api-bridges/ozon-seller/validation/materialize_patch_b1_assortment_master_candidate.py . /tmp/ozon-b1-exact

      - name: Verify B1 deterministic gate
        run: |
          node --check tooling/llm-api-bridges/ozon-seller/validation/PATCH_B1_ASSORTMENT_MASTER_REGRESSION_2026-08-26.mjs
          node tooling/llm-api-bridges/ozon-seller/validation/PATCH_B1_ASSORTMENT_MASTER_REGRESSION_2026-08-26.mjs /tmp/ozon-b1-exact
          find /tmp/ozon-b1-exact -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Record exact identities
        run: |
          cd /tmp/ozon-b1-exact
          find . -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/ozon-b1-exact-files.sha256
          sha256sum shared/ozon_operation_registry.js shared/ozon_contract.js shared/ozon_entitlements.js service_worker.js content_script.js shared/bridge_autorun_model.js shared/work_session_model.js > /tmp/ozon-b1-core.sha256

      - name: Upload exact B1 candidate
        uses: actions/upload-artifact@v4
        with:
          name: ozon-b1-assortment-master-candidate
          path: |
            /tmp/ozon-b1-exact
            /tmp/ozon-b1-exact-files.sha256
            /tmp/ozon-b1-core.sha256
          if-no-files-found: error
          retention-days: 3

  windows-materialize:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record B1 patch identity
        shell: pwsh
        run: |
          $patch = "tooling/llm-api-bridges/ozon-seller/validation/PATCH_B1_ASSORTMENT_MASTER_2026-08-26.patch"
          (Get-FileHash -Algorithm SHA256 $patch).Hash.ToLower()

      - name: Materialize exact B1 candidate on Windows
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "ozon-b1-exact"
          python tooling/llm-api-bridges/ozon-seller/validation/materialize_patch_b1_assortment_master_candidate.py . $out

      - name: Verify B1 deterministic gate on Windows
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "ozon-b1-exact"
          node --check tooling/llm-api-bridges/ozon-seller/validation/PATCH_B1_ASSORTMENT_MASTER_REGRESSION_2026-08-26.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tooling/llm-api-bridges/ozon-seller/validation/PATCH_B1_ASSORTMENT_MASTER_REGRESSION_2026-08-26.mjs $out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem -Path $out -Recurse -Filter *.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
