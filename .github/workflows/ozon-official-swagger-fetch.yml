name: Research fetch official Ozon Swagger

on:
  push:
    branches:
      - 'research/ozon-official-swagger-*'
    paths:
      - .github/workflows/ozon-official-swagger-fetch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-official-swagger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Fetch official Ozon Swagger in browser
        shell: bash
        run: |
          set -euo pipefail
          out='tooling/llm-api-bridges/ozon-seller/research-snapshots'
          mkdir -p "$out"
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$chrome" ]; then
            echo 'No system Chrome/Chromium found'
            exit 1
          fi
          echo "chrome=$chrome"
          npm install --no-save puppeteer-core@24
          cat > /tmp/fetch-ozon-swagger.mjs <<'JS'
          import fs from 'fs';
          import puppeteer from 'puppeteer-core';

          const chrome = process.env.CHROME_BIN;
          const out = 'tooling/llm-api-bridges/ozon-seller/research-snapshots';
          const targets = [
            ['seller', 'https://docs.ozon.ru/api/seller/', 'https://docs.ozon.ru/api/seller/swagger.json'],
            ['performance', 'https://docs.ozon.ru/api/performance/', 'https://docs.ozon.ru/api/performance/swagger.json'],
          ];

          const browser = await puppeteer.launch({
            executablePath: chrome,
            headless: false,
            args: ['--no-sandbox', '--disable-dev-shm-usage'],
          });
          let found = 0;
          try {
            for (const [kind, root, spec] of targets) {
              const page = await browser.newPage();
              await page.setViewport({width: 1280, height: 900});
              await page.setExtraHTTPHeaders({'Accept-Language':'ru-RU,ru;q=0.9,en;q=0.8'});
              console.log(`\n=== ${kind} root ${root} ===`);
              try {
                const rr = await page.goto(root, {waitUntil:'networkidle2', timeout:45000});
                console.log('root status', rr?.status(), 'final', page.url());
                await new Promise(r => setTimeout(r, 3000));
              } catch (e) {
                console.log('root navigation error', String(e));
              }
              console.log(`=== ${kind} spec ${spec} ===`);
              try {
                const response = await page.goto(spec, {waitUntil:'networkidle2', timeout:45000});
                console.log('spec status', response?.status(), 'final', page.url(), 'content-type', response?.headers()?.['content-type']);
                const text = response ? await response.text() : '';
                console.log('spec bytes', Buffer.byteLength(text), 'prefix', JSON.stringify(text.slice(0,240)));
                let data;
                try { data = JSON.parse(text); } catch { data = null; }
                const valid = data && typeof data === 'object' && (data.swagger || data.openapi) && data.paths && typeof data.paths === 'object';
                if (valid) {
                  fs.writeFileSync(`${out}/${kind}-swagger.json`, JSON.stringify(data));
                  fs.writeFileSync(`${out}/${kind}-swagger.source-url.txt`, page.url()+'\n');
                  console.log('VALID_SPEC', kind, data.openapi || data.swagger, 'paths', Object.keys(data.paths).length);
                  found++;
                }
              } catch (e) {
                console.log('spec navigation error', String(e));
              }
              await page.close();
            }
          } finally {
            await browser.close();
          }
          if (!found) process.exit(2);
          JS
          CHROME_BIN="$chrome" xvfb-run -a node /tmp/fetch-ozon-swagger.mjs
          for f in "$out"/*-swagger.json; do
            [ -f "$f" ] || continue
            jq -e 'type == "object" and (.swagger != null or .openapi != null) and (.paths | type == "object")' "$f" >/dev/null
            sha256sum "$f" | tee "$f.sha256"
          done

      - name: Commit verified official snapshot to research branch
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tooling/llm-api-bridges/ozon-seller/research-snapshots/
          if git diff --cached --quiet; then
            echo 'No snapshot changes'
            exit 0
          fi
          git commit -m 'research: capture official Ozon Swagger snapshot'
          git push origin HEAD:${{ github.ref_name }}

