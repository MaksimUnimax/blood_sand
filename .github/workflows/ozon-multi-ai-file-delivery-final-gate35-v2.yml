  regression:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, ref: '${{ needs.prepare.outputs.prod_sha }}' }
      - uses: actions/setup-node@v4
        with: { node-version: '24.12.0' }
      - name: Run exact final regression set
        shell: bash
        env: { OZON_FILE_DELIVERY_BASE_SHA: 4f78cc9f84a926cc834256abcb8278b95c9539df }
        run: |
          set -euo pipefail
          R=tooling/llm-api-bridges/ozon-seller/validation/regression
          node "$R/run_multi_ai_file_delivery_patch.mjs"
          node "$R/run_file_delivery_capture_accounting.mjs"
          node "$R/run_file_delivery_port_worker_state_machine.mjs"
          node "$R/run_file_delivery_mixed_batch_policy.mjs"
          node "$R/run_file_delivery_adapter_gate_policy.mjs"
          node "$R/run_file_delivery_wake_lifecycle.mjs"
          node "$R/run_file_delivery_live_stop_repro.mjs"
          test -z "$(git status --porcelain)"

  package:
    needs: [prepare, regression]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, ref: '${{ needs.prepare.outputs.prod_sha }}' }
      - uses: actions/setup-node@v4
        with: { node-version: '24.12.0' }
      - name: Re-run all deterministic regressions on package source
        shell: bash
        env: { OZON_FILE_DELIVERY_BASE_SHA: 4f78cc9f84a926cc834256abcb8278b95c9539df }
        run: |
          set -euo pipefail
          R=tooling/llm-api-bridges/ozon-seller/validation/regression
          node "$R/run_multi_ai_file_delivery_patch.mjs"
          node "$R/run_file_delivery_capture_accounting.mjs"
          node "$R/run_file_delivery_port_worker_state_machine.mjs"
          node "$R/run_file_delivery_mixed_batch_policy.mjs"
          node "$R/run_file_delivery_adapter_gate_policy.mjs"
          node "$R/run_file_delivery_wake_lifecycle.mjs"
          node "$R/run_file_delivery_live_stop_repro.mjs"
      - name: Prove native browser attachment primitive
        shell: bash
        run: node tooling/llm-api-bridges/ozon-seller/validation/regression/run_file_attachment_browser_primitive.mjs "$(command -v google-chrome)"
      - name: Prove installed MV3 worker bootstrap and IndexedDB artifact store
        shell: bash
        run: xvfb-run -a node tooling/llm-api-bridges/ozon-seller/validation/regression/run_file_delivery_extension_worker_smoke.mjs "$(command -v google-chrome)" "$GITHUB_WORKSPACE/tooling/llm-api-bridges/ozon-seller/dist-step7-candidate"
      - name: Build deterministic ZIP twice and fresh-extract verify
        id: package
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/tooling/llm-api-bridges/ozon-seller/dist-step7-candidate"
          STAGE="$RUNNER_TEMP/stage"
          EXTRACT="$RUNNER_TEMP/extract"
          INV="$RUNNER_TEMP/inventory"
          OUT="$RUNNER_TEMP/OZON_BRIDGE_v0.1.19_MULTI_AI_FILE_DELIVERY_${{ needs.prepare.outputs.prod_sha }}.zip"
          OUT2="$RUNNER_TEMP/rebuild.zip"
          rm -rf "$STAGE" "$EXTRACT"; mkdir -p "$STAGE" "$EXTRACT"
          cp -a "$SRC/." "$STAGE/"
          find "$STAGE" -type f -exec touch -t 198001010000 {} +
          find "$STAGE" -type f -printf '%P\n' | LC_ALL=C sort > "$INV"
          for f in manifest.json service_worker_entry.js shared/file_delivery_model_policy.js shared/file_delivery_port_worker.js shared/file_delivery_wake_worker.js attachment_delivery_port_content.js attachment_delivery_wake_content.js; do grep -qx "$f" "$INV"; done
          ! grep -qx 'attachment_delivery_content.js' "$INV"
          ! grep -qx 'shared/file_delivery_worker.js' "$INV"
          (cd "$STAGE" && zip -X -q "$OUT" -@ < "$INV")
          (cd "$STAGE" && zip -X -q "$OUT2" -@ < "$INV")
          cmp "$OUT" "$OUT2"
          unzip -q "$OUT" -d "$EXTRACT"
          diff -ruN "$SRC" "$EXTRACT"
          while IFS= read -r f; do case "$f" in *.js) node --check "$EXTRACT/$f";; esac; done < "$INV"
          BYTES=$(wc -c < "$OUT" | tr -d ' '); SHA=$(sha256sum "$OUT"|awk '{print $1}')
          echo "PACKAGE_FILE=$(basename "$OUT")"
          echo "PACKAGE_BYTES=$BYTES"
          echo "PACKAGE_SHA256=$SHA"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "bytes=$BYTES" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ozon-multi-ai-file-delivery-final-${{ needs.prepare.outputs.prod_sha }}
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error
          retention-days: 30
