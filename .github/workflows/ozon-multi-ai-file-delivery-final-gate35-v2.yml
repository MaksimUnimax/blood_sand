          '''
          lines=patch_wf.splitlines(); indent=min((len(x)-len(x.lstrip()) for x in lines if x.strip()),default=0)
          Path('.github/workflows/ozon-multi-ai-file-delivery-patch.yml').write_text('\n'.join(x[indent:] if x.strip() else '' for x in lines)+'\n',encoding='utf-8')

