name: Ozon single-file browser diagnostic
on:
  push:
    branches: [repair/ozon-alice-single-file-delivery-2026-09-12]
    paths:
      - .github/workflows/ozon-single-file-browser-diagnostic.yml
      - tooling/llm-api-bridges/ozon-seller/validation/alice-single-file-transport-v1/browser_followup.py
permissions: {contents: read}
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '24.12.0'}
      - name: Exact ephemeral stage and strengthened receipt assertion
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib,base64,lzma,hashlib,subprocess,os
          d=pathlib.Path('tooling/llm-api-bridges/ozon-seller/validation/alice-single-file-transport-v1')
          b=base64.b64decode(''.join((d/f'part{i}.b64').read_text().strip() for i in [1,2,3]),validate=True);assert hashlib.sha256(b).hexdigest()=='5029b9a54f37d49b3fff559f6acfd0a776ac02a4f1930c0c1ef2a3c2725012bb'
          patch=lzma.decompress(b);assert hashlib.sha256(patch).hexdigest()=='cebd23e60583c6d669beac49733d078a90e6ecf972f57ab6ee5754e5843144d6';p=pathlib.Path(os.environ['RUNNER_TEMP'])/'candidate.patch';p.write_bytes(patch)
          subprocess.run(['git','apply','--check',str(p)],check=True);subprocess.run(['git','apply',str(p)],check=True)
          subprocess.run(['python',str(d/'browser_followup.py')],check=True)
          PY
          curl --fail --location --silent --show-error 'https://storage.googleapis.com/chrome-for-testing-public/152.0.7977.82/linux64/chrome-linux64.zip' -o "$RUNNER_TEMP/chrome.zip"
          echo "0704631fb3e4f741092e08f55272f90abc3e307f991f05f332924364415b02e0  $RUNNER_TEMP/chrome.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/chrome.zip" -d "$RUNNER_TEMP/chrome"
      - name: Real Chrome diagnostic
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/browser-diagnostic"
          export OZON_SINGLE_BROWSER_REPORT="$RUNNER_TEMP/browser-diagnostic/result.json"
          xvfb-run -a node tooling/llm-api-bridges/ozon-seller/validation/alice-single-file-v1/browser.mjs "$RUNNER_TEMP/chrome/chrome-linux64/chrome" tooling/llm-api-bridges/ozon-seller/dist-step7-candidate 2>&1 | tee "$RUNNER_TEMP/browser-diagnostic/browser.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ozon-single-file-browser-diagnostic
          path: ${{ runner.temp }}/browser-diagnostic
          retention-days: 30
