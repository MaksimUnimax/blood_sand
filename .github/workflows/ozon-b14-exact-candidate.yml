name: Ozon B14 Pricing Strategy Reads exact candidate

on:
  push:
    branches:
      - feature/ozon-b14-pricing-strategy-reads-2026-08-27
    paths:
      - .github/workflows/ozon-b14-exact-candidate.yml
      - tooling/llm-api-bridges/ozon-seller/validation/PATCH_B14_PRICING_STRATEGY_READS_2026-08-27.patch.gz
      - tooling/llm-api-bridges/ozon-seller/validation/materialize_patch_b14_pricing_strategy_reads_candidate.py
      - tooling/llm-api-bridges/ozon-seller/validation/PATCH_B14_PRICING_STRATEGY_READS_REGRESSION_2026-08-27.mjs
      - tooling/llm-api-bridges/ozon-seller/validation/PATCH_B14_PRICING_STRATEGY_READS_*_2026-08-27.md
      - tooling/llm-api-bridges/ozon-seller/validation/OZON_POST_B13_PRICING_STRATEGY_AUDIT_2026-08-27.md

permissions:
  contents: read

jobs:
  linux-materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize exact B14 candidate
        run: python3 tooling/llm-api-bridges/ozon-seller/validation/materialize_patch_b14_pricing_strategy_reads_candidate.py --repo-root . --work-root /tmp/ozon-b14-work --out /tmp/ozon-b14-exact
      - name: Verify exact B13 base and B14 gates
        run: |
          node tooling/llm-api-bridges/ozon-seller/validation/PATCH_B13_PROMOTIONS_MARKET_READS_REGRESSION_2026-08-27.mjs /tmp/ozon-b14-work/b13-base
          node tooling/llm-api-bridges/ozon-seller/validation/PATCH_B14_PRICING_STRATEGY_READS_REGRESSION_2026-08-27.mjs /tmp/ozon-b14-exact
          find /tmp/ozon-b14-exact -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Record exact identities
        run: |
          cd /tmp/ozon-b14-exact
          find . -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/ozon-b14-exact-files.sha256
          sha256sum shared/ozon_operation_registry.js shared/ozon_contract.js shared/ozon_entitlements.js service_worker.js content_script.js shared/bridge_autorun_model.js shared/work_session_model.js > /tmp/ozon-b14-core.sha256
      - name: Upload exact B14 candidate
        uses: actions/upload-artifact@v4
        with:
          name: ozon-b14-pricing-strategy-reads-candidate
          path: |
            /tmp/ozon-b14-exact
            /tmp/ozon-b14-exact-files.sha256
            /tmp/ozon-b14-core.sha256
          if-no-files-found: error
          retention-days: 3

  windows-materialize:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify B14 patch transport identity
        shell: pwsh
        run: |
          python -c "import gzip,hashlib,pathlib; p=pathlib.Path('tooling/llm-api-bridges/ozon-seller/validation/PATCH_B14_PRICING_STRATEGY_READS_2026-08-27.patch.gz'); c=p.read_bytes(); assert hashlib.sha256(c).hexdigest()=='b1f9839614e91372404928aa77200450fa120df52fd90fd36a326bfc5339f3ee'; b=gzip.decompress(c); assert hashlib.sha256(b).hexdigest()=='0c98be2b82c800987b1a8c76e5ef86dcfe53ee5206e80d9fd9aac32e92f38ace'"
      - name: Materialize exact B14 candidate on Windows
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP "ozon-b14-work"
          $out = Join-Path $env:RUNNER_TEMP "ozon-b14-exact"
          python tooling/llm-api-bridges/ozon-seller/validation/materialize_patch_b14_pricing_strategy_reads_candidate.py --repo-root . --work-root $work --out $out
      - name: Verify exact B13 base and B14 gates on Windows
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP "ozon-b14-work"
          $out = Join-Path $env:RUNNER_TEMP "ozon-b14-exact"
          $b13 = Join-Path $work "b13-base"
          node tooling/llm-api-bridges/ozon-seller/validation/PATCH_B13_PROMOTIONS_MARKET_READS_REGRESSION_2026-08-27.mjs $b13; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tooling/llm-api-bridges/ozon-seller/validation/PATCH_B14_PRICING_STRATEGY_READS_REGRESSION_2026-08-27.mjs $out; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem -Path $out -Recurse -Filter *.js | ForEach-Object { node --check $_.FullName; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
