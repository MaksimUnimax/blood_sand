name: Ozon B28 FBO Transport Cargo Reads exact candidate
on:
  push:
    branches: [feature/ozon-b28-fbo-transport-cargo-reads-2026-08-28]
    paths:
      - .github/workflows/ozon-b28-exact-candidate.yml
      - tooling/llm-api-bridges/ozon-seller/validation/PATCH_B28_FBO_TRANSPORT_CARGO_READS_2026-08-28.patch.gz
      - tooling/llm-api-bridges/ozon-seller/validation/materialize_patch_b28_fbo_transport_cargo_reads_candidate.py
      - tooling/llm-api-bridges/ozon-seller/validation/PATCH_B28_FBO_TRANSPORT_CARGO_READS_REGRESSION_2026-08-28.mjs
      - tooling/llm-api-bridges/ozon-seller/validation/PATCH_B28_FBO_TRANSPORT_CARGO_READS_CANDIDATE_EVIDENCE_2026-08-28.md
      - tooling/llm-api-bridges/ozon-seller/validation/PATCH_B28_FBO_TRANSPORT_CARGO_READS_CANDIDATE_MANIFEST_2026-08-28.md
permissions: {contents: read}
jobs:
  linux-materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify B28 patch transport identity
        run: python3 -c "import gzip,hashlib,pathlib;p=pathlib.Path('tooling/llm-api-bridges/ozon-seller/validation/PATCH_B28_FBO_TRANSPORT_CARGO_READS_2026-08-28.patch.gz');c=p.read_bytes();assert hashlib.sha256(c).hexdigest()=='525913e9794f71ddbce2043c5f1c9f5f82f347b47725f5898ebf0d1d068eb7ac';assert hashlib.sha256(gzip.decompress(c)).hexdigest()=='c52438eb29f3009518c5378f28c8982a341e0542ec7965bc8b5eb37f94663e52'"
      - name: Materialize exact B28 candidate
        run: python3 tooling/llm-api-bridges/ozon-seller/validation/materialize_patch_b28_fbo_transport_cargo_reads_candidate.py --repo-root . --work-root /tmp/ozon-b28-work --out /tmp/ozon-b28-exact
      - name: Verify B27 base and B28 gates
        run: |
          node tooling/llm-api-bridges/ozon-seller/validation/PATCH_B27_FBO_DRAFT_LOCATION_PLANNING_READS_REGRESSION_2026-08-28.mjs /tmp/ozon-b28-work/b27-base
          node tooling/llm-api-bridges/ozon-seller/validation/PATCH_B28_FBO_TRANSPORT_CARGO_READS_REGRESSION_2026-08-28.mjs /tmp/ozon-b28-exact
          find /tmp/ozon-b28-exact -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - uses: actions/upload-artifact@v4
        with: {name: ozon-b28-fbo-transport-cargo-reads-candidate, path: /tmp/ozon-b28-exact, if-no-files-found: error, retention-days: 3}
  windows-materialize:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable Git long paths
        shell: pwsh
        run: git config --global core.longpaths true
      - name: Verify B28 patch transport identity
        shell: pwsh
        run: python -c "import gzip,hashlib,pathlib;p=pathlib.Path('tooling/llm-api-bridges/ozon-seller/validation/PATCH_B28_FBO_TRANSPORT_CARGO_READS_2026-08-28.patch.gz');c=p.read_bytes();assert hashlib.sha256(c).hexdigest()=='525913e9794f71ddbce2043c5f1c9f5f82f347b47725f5898ebf0d1d068eb7ac';assert hashlib.sha256(gzip.decompress(c)).hexdigest()=='c52438eb29f3009518c5378f28c8982a341e0542ec7965bc8b5eb37f94663e52'"
      - name: Materialize exact B28 candidate
        shell: pwsh
        run: |
          $work=Join-Path $env:RUNNER_TEMP 'ozon-b28-work'; $out=Join-Path $env:RUNNER_TEMP 'ozon-b28-exact'
          python tooling/llm-api-bridges/ozon-seller/validation/materialize_patch_b28_fbo_transport_cargo_reads_candidate.py --repo-root . --work-root $work --out $out
      - name: Verify B27 base and B28 gates
        shell: pwsh
        run: |
          $work=Join-Path $env:RUNNER_TEMP 'ozon-b28-work'; $out=Join-Path $env:RUNNER_TEMP 'ozon-b28-exact'; $b27=Join-Path $work 'b27-base'
          node tooling/llm-api-bridges/ozon-seller/validation/PATCH_B27_FBO_DRAFT_LOCATION_PLANNING_READS_REGRESSION_2026-08-28.mjs $b27; if($LASTEXITCODE-ne 0){exit $LASTEXITCODE}
          node tooling/llm-api-bridges/ozon-seller/validation/PATCH_B28_FBO_TRANSPORT_CARGO_READS_REGRESSION_2026-08-28.mjs $out; if($LASTEXITCODE-ne 0){exit $LASTEXITCODE}
          Get-ChildItem $out -Recurse -Filter *.js | ForEach-Object {node --check $_.FullName;if($LASTEXITCODE-ne 0){exit $LASTEXITCODE}}
