name: Ozon B3 exact candidate

on:
  push:
    branches:
      - feature/ozon-b3-warehouse-stock-geography-contracts-2026-08-26
    paths:
      - .gitattributes
      - .github/workflows/ozon-b3-exact-candidate.yml
      - tooling/llm-api-bridges/ozon-seller/validation/PATCH_B3_WAREHOUSE_STOCK_GEOGRAPHY_2026-08-26.patch
      - tooling/llm-api-bridges/ozon-seller/validation/materialize_patch_b3_warehouse_stock_geography_candidate.py
      - tooling/llm-api-bridges/ozon-seller/validation/PATCH_B3_WAREHOUSE_STOCK_GEOGRAPHY_REGRESSION_2026-08-26.mjs

permissions:
  contents: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Materialize exact B3 candidate
        run: python3 tooling/llm-api-bridges/ozon-seller/validation/materialize_patch_b3_warehouse_stock_geography_candidate.py . /tmp/ozon-b3-exact
      - name: Verify accepted B1 and B2 regressions
        run: |
          node tooling/llm-api-bridges/ozon-seller/validation/PATCH_B1_ASSORTMENT_MASTER_REGRESSION_2026-08-26.mjs /tmp/ozon-b3-exact
          node tooling/llm-api-bridges/ozon-seller/validation/PATCH_B2_PRICES_LISTING_STATE_REGRESSION_2026-08-26.mjs /tmp/ozon-b3-exact
      - name: Verify B3 deterministic gate
        run: |
          node --check tooling/llm-api-bridges/ozon-seller/validation/PATCH_B3_WAREHOUSE_STOCK_GEOGRAPHY_REGRESSION_2026-08-26.mjs
          node tooling/llm-api-bridges/ozon-seller/validation/PATCH_B3_WAREHOUSE_STOCK_GEOGRAPHY_REGRESSION_2026-08-26.mjs /tmp/ozon-b3-exact
          find /tmp/ozon-b3-exact -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Record exact identities
        run: |
          cd /tmp/ozon-b3-exact
          find . -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/ozon-b3-exact-files.sha256
          sha256sum shared/ozon_operation_registry.js shared/ozon_contract.js shared/ozon_entitlements.js service_worker.js content_script.js shared/bridge_autorun_model.js shared/work_session_model.js > /tmp/ozon-b3-core.sha256
      - name: Upload exact B3 candidate
        uses: actions/upload-artifact@v4
        with:
          name: ozon-b3-warehouse-stock-geography-candidate
          path: |
            /tmp/ozon-b3-exact
            /tmp/ozon-b3-exact-files.sha256
            /tmp/ozon-b3-core.sha256
          if-no-files-found: error
          retention-days: 3

  windows-materialize:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Record B3 patch identity
        shell: pwsh
        run: |
          $patch = "tooling/llm-api-bridges/ozon-seller/validation/PATCH_B3_WAREHOUSE_STOCK_GEOGRAPHY_2026-08-26.patch"
          (Get-FileHash -Algorithm SHA256 $patch).Hash.ToLower()
      - name: Materialize exact B3 candidate on Windows
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "ozon-b3-exact"
          python tooling/llm-api-bridges/ozon-seller/validation/materialize_patch_b3_warehouse_stock_geography_candidate.py . $out
      - name: Verify B1/B2/B3 deterministic gates on Windows
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "ozon-b3-exact"
          node tooling/llm-api-bridges/ozon-seller/validation/PATCH_B1_ASSORTMENT_MASTER_REGRESSION_2026-08-26.mjs $out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tooling/llm-api-bridges/ozon-seller/validation/PATCH_B2_PRICES_LISTING_STATE_REGRESSION_2026-08-26.mjs $out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tooling/llm-api-bridges/ozon-seller/validation/PATCH_B3_WAREHOUSE_STOCK_GEOGRAPHY_REGRESSION_2026-08-26.mjs $out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem -Path $out -Recurse -Filter *.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
