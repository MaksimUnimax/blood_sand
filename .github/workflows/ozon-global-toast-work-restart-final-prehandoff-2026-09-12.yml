name: Ozon global idle plaque + repeated Work Start final pre-handoff
run-name: Ozon global idle + Work restart final · ${{ github.ref_name }} · ${{ github.sha }}

on:
  push:
    branches: [repair/ozon-global-toast-work-restart-2026-09-11]
    paths:
      - '.github/workflows/ozon-global-toast-work-restart-final-prehandoff-2026-09-12.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ozon-global-idle-work-restart-final-${{ github.ref }}
  cancel-in-progress: false

env:
  PATCH_BRANCH: repair/ozon-global-toast-work-restart-2026-09-11
  ROOT: tooling/llm-api-bridges/ozon-seller
  DIST: tooling/llm-api-bridges/ozon-seller/dist-step7-candidate
  GATE: tooling/llm-api-bridges/ozon-seller/validation/global-toast-work-restart-v1
  OLD_PROVIDER_GATE: tooling/llm-api-bridges/ozon-seller/validation/alice-original-provider-runtime-capability-v1
  ARTIFACT_NAME: OZON_BRIDGE_v0.1.19_GLOBAL_IDLE_WORK_RESTART_20260912.zip
  BASELINE_SHA: 4fb9c1a859ce7245101e47ffa6e189026e386d8f
  EXACT_EXECUTABLE_SHA: 1b3f0961ff9399430c9e5b3b70a4188f1282429d
  EXACT_EXECUTABLE_TREE: a81781774368b2967d0e06547593972d9a9a3123
  PREFX_RUN: '34606440326'
  TARGETED_RUN: '34665177275'
  MATERIALIZER_RUN: '34665232728'

jobs:
  linux-authoritative:
    runs-on: ubuntu-24.04
    outputs:
      package_sha: ${{ steps.identity.outputs.package_sha }}
      package_bytes: ${{ steps.identity.outputs.package_bytes }}
      production_files: ${{ steps.identity.outputs.production_files }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '24.12.0'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}

      - name: Decode current corrective behavioral authorities
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$GATE/run_attachment_idle_behavior.mjs.gz.b64" "$RUNNER_TEMP/run_attachment_idle_behavior.mjs" "$GATE/run_work_restart_extended.mjs.gz.b64" "$RUNNER_TEMP/run_work_restart_extended.mjs" <<'PY'
          import base64, gzip, hashlib, pathlib, sys
          pairs=list(zip(sys.argv[1::2],sys.argv[2::2]))
          for src,dst in pairs:
              raw=b''.join(pathlib.Path(src).read_bytes().split())
              rem=len(raw)%4
              if rem==1: raise SystemExit(f'impossible base64 length: {src}')
              if rem in (2,3): raw+=b'='*(4-rem)
              data=gzip.decompress(base64.b64decode(raw,validate=True))
              pathlib.Path(dst).write_bytes(data)
              print(f'DECODE_PASS {src} bytes={len(data)} sha256={hashlib.sha256(data).hexdigest()}')
          PY
          test "$(sha256sum "$RUNNER_TEMP/run_attachment_idle_behavior.mjs" | awk '{print $1}')" = '29cf98971296ba529d636e284f7066585c7e9e2cebe49121b41277ea18b8e71e'
          test "$(sha256sum "$RUNNER_TEMP/run_work_restart_extended.mjs" | awk '{print $1}')" = '0a564b28a1bdf102042716247984594867aef6262bbfc18b0ea472a6a43aa883'
          node --check "$RUNNER_TEMP/run_attachment_idle_behavior.mjs"
          node --check "$RUNNER_TEMP/run_work_restart_extended.mjs"
          echo CURRENT_CORRECTIVE_GATE_IDENTITY_PASS

      - name: Exact executable scope and full Linux regressions
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$PATCH_BRANCH"
          test "$(git show -s --format=%T "$EXACT_EXECUTABLE_SHA")" = "$EXACT_EXECUTABLE_TREE"
          git merge-base --is-ancestor "$EXACT_EXECUTABLE_SHA" HEAD
          test -z "$(git diff --name-only "$EXACT_EXECUTABLE_SHA"..HEAD -- "$DIST")"
          mapfile -t changed < <(git diff --name-only "$BASELINE_SHA" "$EXACT_EXECUTABLE_SHA" -- "$DIST")
          test "${#changed[@]}" -eq 4
          printf '%s\n' "${changed[@]}" | grep -Fx "$DIST/attachment_delivery_port_content.js"
          printf '%s\n' "${changed[@]}" | grep -Fx "$DIST/attachment_delivery_wake_content.js"
          printf '%s\n' "${changed[@]}" | grep -Fx "$DIST/content_script.js"
          printf '%s\n' "${changed[@]}" | grep -Fx "$DIST/service_worker.js"
          find "$DIST" -type f -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check

          node "$RUNNER_TEMP/run_attachment_idle_behavior.mjs" "$DIST"
          node "$RUNNER_TEMP/run_work_restart_extended.mjs" "$DIST"
          node "$ROOT/validation/WORK_SESSION_PENDING_START_REGRESSION_2026-08-21.mjs" "$DIST"

          node "$OLD_PROVIDER_GATE/run_prefx_original_provider_runtime_capability.mjs" .
          node "$OLD_PROVIDER_GATE/run_postfix_original_provider_runtime_capability.mjs" .
          node "$OLD_PROVIDER_GATE/run_secondary_dependency_sweep.mjs" .
          node "$ROOT/validation/alice-spa-attachment-owner-v1/run_prefx_spa_owner_gate.mjs" .
          node "$ROOT/validation/alice-spa-attachment-owner-v1/run_postfix_spa_owner_gate.mjs" .
          node "$ROOT/validation/regression/run_file_delivery_adapter_gate_policy.mjs"
          node "$ROOT/validation/regression/run_file_delivery_capture_accounting.mjs"
          node "$ROOT/validation/regression/run_file_delivery_port_worker_state_machine.mjs"
          node "$ROOT/validation/regression/run_file_delivery_mixed_batch_policy.mjs"
          node "$ROOT/validation/regression/run_file_delivery_wake_lifecycle.mjs"
          node "$ROOT/validation/regression/run_file_delivery_live_stop_repro.mjs"
          node "$ROOT/validation/regression/run_direct_binary_provider_attachment_gate.mjs"
          node "$ROOT/validation/indexeddb-transaction-durability-v1/run_prefix_transaction_abort_gate.mjs" .
          node "$ROOT/validation/indexeddb-transaction-durability-v1/run_secondary_dependency_sweep.mjs" .
          node "$ROOT/validation/alice-auto-send-v1/run_alice_auto_send_postfix_source_gate.mjs" "$DIST"
          node "$ROOT/validation/alice-drag-drop-v1/run_alice_drag_drop_runtime_gate.mjs" . "$DIST"
          node "$ROOT/validation/alice-large-result-v1/run_alice_large_result_delivery_gate.mjs" "$DIST"
          node "$ROOT/validation/alice-large-result-v1/run_alice_large_result_delivery_gate_v2.mjs" . "$DIST"
          node "$ROOT/validation/llm-output-report-workflow-v1/run_output_contract_gate.mjs" .
          node "$ROOT/validation/llm-output-report-workflow-v1/run_secondary_dependency_sweep.mjs" .
          node "$ROOT/validation/mixed-help-api-v2/run_mixed_help_api_gate_v2.mjs" .
          node "$ROOT/validation/mixed-help-api-v2/run_mixed_help_api_disabled_alias_gate.mjs" .
          node "$ROOT/validation/command-envelope-contract-v1/run_command_envelope_contract_gate.mjs" .

          git diff -U0 "$BASELINE_SHA" "$EXACT_EXECUTABLE_SHA" -- "$DIST" | grep '^+' | grep -v '^+++' > "$RUNNER_TEMP/added_production_lines.txt" || true
          ! grep -E '(fetch\(|XMLHttpRequest|report_file_get|OZON_API_V1)' "$RUNNER_TEMP/added_production_lines.txt"
          ! grep -Ei '(retry|refetch|resend|paginate|pagination|fan.?out)[[:space:]]*\(' "$RUNNER_TEMP/added_production_lines.txt"
          git diff --check
          echo provider_calls_during_patch_gate=0
          echo GLOBAL_IDLE_WORK_RESTART_LINUX_REGRESSIONS_PASS

      - name: Pinned Chrome browser and MV3 lifecycle
        shell: bash
        run: |
          set -euo pipefail
          VER='152.0.7977.82'
          CZIP="$RUNNER_TEMP/chrome.zip"
          CDIR="$RUNNER_TEMP/chrome"
          mkdir -p "$CDIR"
          curl --fail --location --silent --show-error "https://storage.googleapis.com/chrome-for-testing-public/${VER}/linux64/chrome-linux64.zip" --output "$CZIP"
          unzip -q "$CZIP" -d "$CDIR"
          CHROME="$CDIR/chrome-linux64/chrome"
          "$CHROME" --version | grep -F "$VER"
          for fixture in \
            "$OLD_PROVIDER_GATE/alice_original_provider_runtime_fixture.html" \
            "$ROOT/validation/alice-auto-send-v1/alice_blocked_send_postfix_fixture.html" \
            "$ROOT/validation/alice-auto-send-v1/alice_current_dom_send_chain_fixture.html" \
            "$ROOT/validation/alice-drag-drop-v1/alice_drag_drop_adapter_fixture.html"; do
            out="$RUNNER_TEMP/$(basename "$fixture").out"
            "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-background-networking --allow-file-access-from-files --virtual-time-budget=2500 --dump-dom "file://$GITHUB_WORKSPACE/$fixture" > "$out"
            ! grep -F '<title>FAIL:' "$out"
          done
          grep -F '<title>ALICE_ORIGINAL_PROVIDER_RUNTIME_BROWSER_PASS</title>' "$RUNNER_TEMP/alice_original_provider_runtime_fixture.html.out"
          grep -F '<title>ALICE_BLOCKED_SEND_POSTFIX_PASS</title>' "$RUNNER_TEMP/alice_blocked_send_postfix_fixture.html.out"
          grep -F '<title>ALICE_CURRENT_DOM_SEND_CHAIN_PASS</title>' "$RUNNER_TEMP/alice_current_dom_send_chain_fixture.html.out"
          grep -F '<title>ALICE_DND_ADAPTER_PASS</title>' "$RUNNER_TEMP/alice_drag_drop_adapter_fixture.html.out"
          node "$ROOT/validation/regression/run_file_attachment_browser_primitive.mjs" "$CHROME"
          xvfb-run -a node "$ROOT/validation/regression/run_file_delivery_extension_worker_smoke.mjs" "$CHROME" "$DIST"
          echo GLOBAL_IDLE_WORK_RESTART_BROWSER_MV3_PASS

      - name: Build deterministic exact ZIP and fresh-extraction parity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ROOT/artifacts"
          python - <<'PY'
          import hashlib, os, pathlib, zipfile
          dist=pathlib.Path(os.environ['DIST']); root=pathlib.Path(os.environ['ROOT']); name=os.environ['ARTIFACT_NAME']; out=root/'artifacts'/name
          files=sorted(p for p in dist.rglob('*') if p.is_file())
          with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in files:
                  info=zipfile.ZipInfo(p.relative_to(dist).as_posix(),date_time=(1980,1,1,0,0,0))
                  info.compress_type=zipfile.ZIP_DEFLATED
                  info.external_attr=0o100644<<16
                  z.writestr(info,p.read_bytes(),compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)
          b=out.read_bytes(); sha=hashlib.sha256(b).hexdigest()
          (out.parent/(name+'.sha256.txt')).write_text(f'{sha}  {name}\n',encoding='utf-8')
          pathlib.Path(os.environ['RUNNER_TEMP']+'/package.env').write_text(f'package_sha={sha}\npackage_bytes={len(b)}\nproduction_files={len(files)}\n')
          print('PACKAGE_SHA='+sha); print('PACKAGE_BYTES='+str(len(b))); print('PRODUCTION_FILES='+str(len(files)))
          PY
          cat "$RUNNER_TEMP/package.env" >> "$GITHUB_OUTPUT"
          ZIP="$ROOT/artifacts/$ARTIFACT_NAME"
          EXTRACT="$RUNNER_TEMP/extract"
          rm -rf "$EXTRACT"; mkdir -p "$EXTRACT"; unzip -q "$ZIP" -d "$EXTRACT"
          python - <<'PY'
          import hashlib, os, pathlib, subprocess
          dist=pathlib.Path(os.environ['DIST']); ext=pathlib.Path(os.environ['RUNNER_TEMP'])/'extract'; sha=os.environ['EXACT_EXECUTABLE_SHA']; prefix=os.environ['DIST']
          ds={p.relative_to(dist).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in dist.rglob('*') if p.is_file()}
          es={p.relative_to(ext).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in ext.rglob('*') if p.is_file()}
          assert ds==es, 'fresh extraction differs from working exact source'
          tracked=subprocess.check_output(['git','ls-tree','-r','--name-only',sha,'--',prefix],text=True).splitlines()
          expected=sorted(p[len(prefix)+1:] for p in tracked if p.startswith(prefix+'/'))
          assert expected==sorted(es), 'ZIP member set differs from exact executable commit'
          for rel in expected:
              canonical=subprocess.check_output(['git','show',f'{sha}:{prefix}/{rel}'])
              assert hashlib.sha256(canonical).hexdigest()==es[rel], rel
          print('CANONICAL_MEMBER_COUNT='+str(len(expected)))
          print('GLOBAL_IDLE_WORK_RESTART_LINUX_CANONICAL_PARITY_PASS')
          PY
          find "$EXTRACT" -type f -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check
          node "$RUNNER_TEMP/run_attachment_idle_behavior.mjs" "$EXTRACT"
          node "$RUNNER_TEMP/run_work_restart_extended.mjs" "$EXTRACT"
          node "$ROOT/validation/WORK_SESSION_PENDING_START_REGRESSION_2026-08-21.mjs" "$EXTRACT"
          node "$OLD_PROVIDER_GATE/run_postfix_original_provider_runtime_capability.mjs" "$EXTRACT"
          node "$OLD_PROVIDER_GATE/run_secondary_dependency_sweep.mjs" "$EXTRACT"
          node "$ROOT/validation/alice-spa-attachment-owner-v1/run_postfix_spa_owner_gate.mjs" "$EXTRACT"
          node "$ROOT/validation/alice-drag-drop-v1/run_alice_drag_drop_runtime_gate.mjs" . "$EXTRACT"
          CHROME="$RUNNER_TEMP/chrome/chrome-linux64/chrome"
          xvfb-run -a node "$ROOT/validation/regression/run_file_delivery_extension_worker_smoke.mjs" "$CHROME" "$EXTRACT"
          echo GLOBAL_IDLE_WORK_RESTART_EXACT_ZIP_PASS

      - uses: actions/upload-artifact@v4
        with:
          name: ozon-global-idle-work-restart-exact-package
          path: |
            ${{ env.ROOT }}/artifacts/${{ env.ARTIFACT_NAME }}
            ${{ env.ROOT }}/artifacts/${{ env.ARTIFACT_NAME }}.sha256.txt
          retention-days: 30

  windows-authoritative:
    needs: linux-authoritative
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '24.12.0'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v4
        with:
          name: ozon-global-idle-work-restart-exact-package
          path: ${{ env.ROOT }}/artifacts

      - name: Windows exact-source regressions and canonical package parity
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $tree=(git show -s --format=%T $env:EXACT_EXECUTABLE_SHA).Trim()
          if ($tree -ne $env:EXACT_EXECUTABLE_TREE) { throw 'source tree mismatch' }
          git merge-base --is-ancestor $env:EXACT_EXECUTABLE_SHA HEAD
          if ($LASTEXITCODE -ne 0) { throw 'exact executable is not ancestor' }
          $drift=(git diff --name-only "$env:EXACT_EXECUTABLE_SHA..HEAD" -- $env:DIST)
          if ($drift) { throw "production drift after exact executable commit: $drift" }

          function Decode-GzipB64([string]$Source,[string]$Dest) {
            $raw=(Get-Content -Raw $Source) -replace '\s',''
            $bytes=[Convert]::FromBase64String($raw)
            $input=New-Object IO.MemoryStream(,$bytes)
            $gzip=New-Object IO.Compression.GzipStream($input,[IO.Compression.CompressionMode]::Decompress)
            $output=New-Object IO.MemoryStream
            $gzip.CopyTo($output); $gzip.Dispose(); $input.Dispose()
            [IO.File]::WriteAllBytes($Dest,$output.ToArray()); $output.Dispose()
          }
          $idle=Join-Path $env:RUNNER_TEMP 'run_attachment_idle_behavior.mjs'
          $work=Join-Path $env:RUNNER_TEMP 'run_work_restart_extended.mjs'
          Decode-GzipB64 "$env:GATE/run_attachment_idle_behavior.mjs.gz.b64" $idle
          Decode-GzipB64 "$env:GATE/run_work_restart_extended.mjs.gz.b64" $work
          if ((Get-FileHash -Algorithm SHA256 $idle).Hash.ToLowerInvariant() -ne '29cf98971296ba529d636e284f7066585c7e9e2cebe49121b41277ea18b8e71e') { throw 'idle gate sha mismatch' }
          if ((Get-FileHash -Algorithm SHA256 $work).Hash.ToLowerInvariant() -ne '0a564b28a1bdf102042716247984594867aef6262bbfc18b0ea472a6a43aa883') { throw 'work gate sha mismatch' }

          node $idle $env:DIST
          node $work $env:DIST
          node "$env:ROOT/validation/WORK_SESSION_PENDING_START_REGRESSION_2026-08-21.mjs" $env:DIST
          node "$env:OLD_PROVIDER_GATE/run_postfix_original_provider_runtime_capability.mjs" .
          node "$env:OLD_PROVIDER_GATE/run_secondary_dependency_sweep.mjs" .
          node "$env:ROOT/validation/alice-spa-attachment-owner-v1/run_postfix_spa_owner_gate.mjs" .
          node "$env:ROOT/validation/regression/run_file_delivery_adapter_gate_policy.mjs"
          node "$env:ROOT/validation/regression/run_file_delivery_capture_accounting.mjs"
          node "$env:ROOT/validation/regression/run_file_delivery_port_worker_state_machine.mjs"
          node "$env:ROOT/validation/regression/run_direct_binary_provider_attachment_gate.mjs"
          node "$env:ROOT/validation/alice-drag-drop-v1/run_alice_drag_drop_runtime_gate.mjs" . $env:DIST
          node "$env:ROOT/validation/llm-output-report-workflow-v1/run_output_contract_gate.mjs" .

          $zip=Join-Path "$env:ROOT/artifacts" $env:ARTIFACT_NAME
          if (-not (Test-Path $zip)) { throw 'ZIP missing' }
          $sha=(Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant(); $bytes=(Get-Item $zip).Length
          if ($sha -ne '${{ needs.linux-authoritative.outputs.package_sha }}') { throw "ZIP SHA mismatch $sha" }
          if ($bytes -ne [int64]'${{ needs.linux-authoritative.outputs.package_bytes }}') { throw 'ZIP bytes mismatch' }
          $extract=Join-Path $env:RUNNER_TEMP 'global-idle-work-extract'
          if (Test-Path $extract) { Remove-Item -Recurse -Force $extract }
          Expand-Archive -Path $zip -DestinationPath $extract
          Get-ChildItem $extract -Recurse -Filter *.js | Sort-Object FullName | ForEach-Object { node --check $_.FullName; if ($LASTEXITCODE -ne 0) { throw "extracted syntax fail $($_.FullName)" } }
          node $idle $extract
          node $work $extract
          node "$env:ROOT/validation/WORK_SESSION_PENDING_START_REGRESSION_2026-08-21.mjs" $extract
          node "$env:OLD_PROVIDER_GATE/run_postfix_original_provider_runtime_capability.mjs" $extract
          node "$env:OLD_PROVIDER_GATE/run_secondary_dependency_sweep.mjs" $extract
          node "$env:ROOT/validation/alice-spa-attachment-owner-v1/run_postfix_spa_owner_gate.mjs" $extract

          @'
          import hashlib, os, pathlib, subprocess
          sha=os.environ['EXACT_EXECUTABLE_SHA']; prefix=os.environ['DIST'].replace('\\','/').rstrip('/'); ext=pathlib.Path(os.environ['EXTRACT'])
          tracked=subprocess.check_output(['git','ls-tree','-r','--name-only',sha,'--',prefix],text=True).splitlines()
          expected=sorted(p[len(prefix)+1:] for p in tracked if p.startswith(prefix+'/'))
          actual=sorted(p.relative_to(ext).as_posix() for p in ext.rglob('*') if p.is_file())
          assert expected==actual,(expected,actual)
          for rel in actual:
              canonical=subprocess.check_output(['git','show',f'{sha}:{prefix}/{rel}'])
              extracted=(ext/rel).read_bytes()
              assert hashlib.sha256(canonical).digest()==hashlib.sha256(extracted).digest(),rel
          print('CANONICAL_MEMBER_COUNT='+str(len(actual)))
          print('GLOBAL_IDLE_WORK_RESTART_WINDOWS_CANONICAL_GIT_BLOB_BYTE_PARITY_PASS')
          '@ | Set-Content -Encoding utf8 "$env:RUNNER_TEMP\canonical_parity.py"
          $env:EXTRACT=$extract
          python "$env:RUNNER_TEMP\canonical_parity.py"
          if ($LASTEXITCODE -ne 0) { throw 'canonical Git-blob parity failed' }
          Write-Output 'GLOBAL_IDLE_WORK_RESTART_WINDOWS_AUTHORITATIVE_PASS'

  finalize-evidence:
    needs: [linux-authoritative, windows-authoritative]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v4
        with:
          name: ozon-global-idle-work-restart-exact-package
          path: ${{ env.ROOT }}/artifacts

      - name: Finalize GATE-01..35, dependency closure and exact-package evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$PATCH_BRANCH"
          test "$(git show -s --format=%T "$EXACT_EXECUTABLE_SHA")" = "$EXACT_EXECUTABLE_TREE"
          git merge-base --is-ancestor "$EXACT_EXECUTABLE_SHA" HEAD
          test -z "$(git diff --name-only "$EXACT_EXECUTABLE_SHA"..HEAD -- "$DIST")"
          ZIP="$ROOT/artifacts/$ARTIFACT_NAME"
          test "$(sha256sum "$ZIP" | awk '{print $1}')" = '${{ needs.linux-authoritative.outputs.package_sha }}'
          test "$(stat -c '%s' "$ZIP")" = '${{ needs.linux-authoritative.outputs.package_bytes }}'
          test '${{ needs.linux-authoritative.outputs.production_files }}' -gt '0'
          test "$(git ls-tree -r --name-only "$EXACT_EXECUTABLE_SHA" -- "$DIST" | wc -l)" = '${{ needs.linux-authoritative.outputs.production_files }}'

          python "$GATE/finalize_prehandoff.py" \
            --source-sha "$EXACT_EXECUTABLE_SHA" --source-tree "$EXACT_EXECUTABLE_TREE" \
            --package-name "$ARTIFACT_NAME" --package-sha '${{ needs.linux-authoritative.outputs.package_sha }}' \
            --package-bytes '${{ needs.linux-authoritative.outputs.package_bytes }}' --production-files '${{ needs.linux-authoritative.outputs.production_files }}' \
            --workflow-run "$GITHUB_RUN_ID" --prefx-run "$PREFX_RUN" --targeted-run "$TARGETED_RUN" --materializer-run "$MATERIALIZER_RUN"

          DEP="$GATE/DEPENDENCY_CLOSURE_2026-09-12.md"
          FINAL="$GATE/FINAL_PREHANDOFF_2026-09-12.md"
          BUILDINFO="$ROOT/artifacts/${ARTIFACT_NAME%.zip}_BUILDINFO.txt"
          grep -F 'Unaccounted pre-handoff dependencies: **0**.' "$DEP"
          grep -F 'Stale active assumptions after secondary sweep: **0**.' "$DEP"
          grep -F 'Available-but-unverified pre-handoff dependencies: **0**.' "$DEP"
          grep -F 'Live-only dependencies pending: **5**.' "$DEP"
          grep -F '**DEPENDENCY VERDICT: PASS FOR PRE-HANDOFF SCOPE**' "$DEP"
          test "$(grep -c '^| GATE-[0-9][0-9] | PASS' "$FINAL")" -eq 35
          grep -F '**PRE-HANDOFF VERDICT: PASS**' "$FINAL"
          grep -F '**LIVE CERTIFICATION: PENDING**' "$FINAL"
          grep -F 'linux_exact_source_package=PASS' "$BUILDINFO"
          grep -F 'windows_exact_source_package=PASS' "$BUILDINFO"
          grep -F 'global_idle_probe_false_plaque=PASS' "$BUILDINFO"
          grep -F 'active_attachment_wake_error_visibility=PASS' "$BUILDINFO"
          grep -F 'work_restart_existing_conversation=PASS' "$BUILDINFO"
          grep -F 'work_start_lost_primary_response_no_duplicate=PASS' "$BUILDINFO"
          grep -F 'work_start_unknown_outcome_no_retry=PASS' "$BUILDINFO"
          grep -F 'work_start_service_worker_recreation_no_duplicate=PASS' "$BUILDINFO"
          grep -F 'work_start_watcher_rehydration=PASS' "$BUILDINFO"
          grep -F 'provider_calls_during_patch_gate=0' "$BUILDINFO"
          grep -F 'automatic_retry_added=false' "$BUILDINFO"
