name: Ozon B49 FBS Posting Timeslot Change Restrictions exact candidate
on:
  push:
    branches: [feature/ozon-b49-fbs-posting-timeslot-change-restrictions-2026-08-28]
    paths:
      - .github/workflows/ozon-b49-exact-candidate.yml
      - tooling/llm-api-bridges/ozon-seller/validation/PATCH_B49_FBS_POSTING_TIMESLOT_CHANGE_RESTRICTIONS_2026-08-28.patch.gz
      - tooling/llm-api-bridges/ozon-seller/validation/materialize_patch_b49_fbs_posting_timeslot_change_restrictions_candidate.py
      - tooling/llm-api-bridges/ozon-seller/validation/PATCH_B49_FBS_POSTING_TIMESLOT_CHANGE_RESTRICTIONS_REGRESSION_2026-08-28.mjs
      - tooling/llm-api-bridges/ozon-seller/validation/PATCH_B49_FBS_POSTING_TIMESLOT_CHANGE_RESTRICTIONS_CANDIDATE_EVIDENCE_2026-08-28.md
      - tooling/llm-api-bridges/ozon-seller/validation/PATCH_B49_FBS_POSTING_TIMESLOT_CHANGE_RESTRICTIONS_CANDIDATE_MANIFEST_2026-08-28.md
permissions: {contents: read}
jobs:
  linux-materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify B49 patch transport identity
        run: python3 -c "import gzip,hashlib,pathlib;p=pathlib.Path('tooling/llm-api-bridges/ozon-seller/validation/PATCH_B49_FBS_POSTING_TIMESLOT_CHANGE_RESTRICTIONS_2026-08-28.patch.gz');c=p.read_bytes();assert hashlib.sha256(c).hexdigest()=='b7479647c36c2bb4d37834386747db7d606b5f88b26377a9323b1de3ac6361f4';assert hashlib.sha256(gzip.decompress(c)).hexdigest()=='a14223aeb06f886687acc2eed82a397f9e4e661088d8ece4375d30bfb0865c0d'"
      - name: Materialize exact B49 candidate
        run: python3 tooling/llm-api-bridges/ozon-seller/validation/materialize_patch_b49_fbs_posting_timeslot_change_restrictions_candidate.py --repo-root . --work-root /tmp/ozon-b49-work --out /tmp/ozon-b49-exact
      - name: Verify B48 base and B49 gates
        run: |
          node tooling/llm-api-bridges/ozon-seller/validation/PATCH_B48_FBO_DRAFT_TIMESLOT_INFO_REGRESSION_2026-08-28.mjs /tmp/ozon-b49-work/b48-base
          node tooling/llm-api-bridges/ozon-seller/validation/PATCH_B49_FBS_POSTING_TIMESLOT_CHANGE_RESTRICTIONS_REGRESSION_2026-08-28.mjs /tmp/ozon-b49-exact
          find /tmp/ozon-b49-exact -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - uses: actions/upload-artifact@v4
        with: {name: ozon-b49-fbs-posting-timeslot-change-restrictions-candidate, path: /tmp/ozon-b49-exact, if-no-files-found: error, retention-days: 3}
  windows-materialize:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable Git long paths
        shell: pwsh
        run: git config --system core.longpaths true
      - name: Verify B49 patch transport identity
        shell: pwsh
        run: python -c "import gzip,hashlib,pathlib;p=pathlib.Path('tooling/llm-api-bridges/ozon-seller/validation/PATCH_B49_FBS_POSTING_TIMESLOT_CHANGE_RESTRICTIONS_2026-08-28.patch.gz');c=p.read_bytes();assert hashlib.sha256(c).hexdigest()=='b7479647c36c2bb4d37834386747db7d606b5f88b26377a9323b1de3ac6361f4';assert hashlib.sha256(gzip.decompress(c)).hexdigest()=='a14223aeb06f886687acc2eed82a397f9e4e661088d8ece4375d30bfb0865c0d'"
      - name: Materialize exact B49 candidate
        shell: pwsh
        run: |
          $work='C:\b49w'; $out='C:\b49o'
          python tooling/llm-api-bridges/ozon-seller/validation/materialize_patch_b49_fbs_posting_timeslot_change_restrictions_candidate.py --repo-root . --work-root $work --out $out
      - name: Verify B48 base and B49 gates
        shell: pwsh
        run: |
          $work='C:\b49w'; $out='C:\b49o'; $b48=Join-Path $work 'b48-base'
          node tooling/llm-api-bridges/ozon-seller/validation/PATCH_B48_FBO_DRAFT_TIMESLOT_INFO_REGRESSION_2026-08-28.mjs $b48; if($LASTEXITCODE-ne 0){exit $LASTEXITCODE}
          node tooling/llm-api-bridges/ozon-seller/validation/PATCH_B49_FBS_POSTING_TIMESLOT_CHANGE_RESTRICTIONS_REGRESSION_2026-08-28.mjs $out; if($LASTEXITCODE-ne 0){exit $LASTEXITCODE}
          Get-ChildItem $out -Recurse -Filter *.js | ForEach-Object {node --check $_.FullName;if($LASTEXITCODE-ne 0){exit $LASTEXITCODE}}
