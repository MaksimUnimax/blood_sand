name: Ozon file delivery apply mixed-batch policy once

on:
  push:
    branches:
      - repair/ozon-multi-ai-file-delivery-2026-09-08
    paths:
      - '.github/workflows/ozon-file-delivery-apply-mixed-policy-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: repair/ozon-multi-ai-file-delivery-2026-09-08

      - name: Apply idempotent mixed-batch policy wiring
        shell: python
        run: |
          from pathlib import Path

          entry = Path('tooling/llm-api-bridges/ozon-seller/dist-step7-candidate/service_worker_entry.js')
          text = entry.read_text(encoding='utf-8')
          policy_line = 'importScripts("shared/file_delivery_model_policy.js");'
          if policy_line not in text:
              anchor = 'importScripts("service_worker.js");'
              if anchor not in text:
                  raise SystemExit('service_worker.js bootstrap anchor missing')
              text = text.replace(
                  anchor,
                  anchor + '\n/* Mixed report-file batches preserve all non-file logical results in a complete TXT companion. */\n' + policy_line,
                  1,
              )
              entry.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/ozon-multi-ai-file-delivery-patch.yml')
          wf = workflow.read_text(encoding='utf-8')
          test_path = "      - 'tooling/llm-api-bridges/ozon-seller/validation/regression/run_file_delivery_mixed_batch_policy.mjs'\n"
          anchor_path = "      - 'tooling/llm-api-bridges/ozon-seller/validation/regression/run_file_delivery_worker_state_machine.mjs'\n"
          if test_path.strip() not in wf:
              if anchor_path not in wf:
                  raise SystemExit('workflow regression path anchor missing')
              wf = wf.replace(anchor_path, anchor_path + test_path, 1)

          run_line = '          node tooling/llm-api-bridges/ozon-seller/validation/regression/run_file_delivery_mixed_batch_policy.mjs\n'
          state_line = '          node tooling/llm-api-bridges/ozon-seller/validation/regression/run_file_delivery_worker_state_machine.mjs\n'
          if wf.count(run_line) < 2:
              positions = []
              start = 0
              while True:
                  pos = wf.find(state_line, start)
                  if pos < 0:
                      break
                  positions.append(pos)
                  start = pos + len(state_line)
              if len(positions) < 2:
                  raise SystemExit('workflow regression command anchors missing')
              rebuilt = []
              cursor = 0
              for pos in positions:
                  end = pos + len(state_line)
                  rebuilt.append(wf[cursor:end])
                  if not wf[end:end+len(run_line)] == run_line:
                      rebuilt.append(run_line)
                  cursor = end
              rebuilt.append(wf[cursor:])
              wf = ''.join(rebuilt)

          inventory_line = "          grep -qx 'shared/file_delivery_model_policy.js' \"$INVENTORY\"\n"
          inventory_anchor = "          grep -qx 'shared/file_delivery_port_worker.js' \"$INVENTORY\"\n"
          if inventory_line.strip() not in wf:
              if inventory_anchor not in wf:
                  raise SystemExit('package inventory anchor missing')
              wf = wf.replace(inventory_anchor, inventory_anchor + inventory_line, 1)

          workflow.write_text(wf, encoding='utf-8')

      - name: Commit exact policy wiring
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          if git diff --quiet; then
            echo 'MIXED_BATCH_POLICY_WIRING_ALREADY_PRESENT=PASS'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tooling/llm-api-bridges/ozon-seller/dist-step7-candidate/service_worker_entry.js \
                  .github/workflows/ozon-multi-ai-file-delivery-patch.yml
          git commit -m 'fix(ozon): wire mixed report-file completeness policy'
          git push origin HEAD:repair/ozon-multi-ai-file-delivery-2026-09-08
          echo 'MIXED_BATCH_POLICY_WIRING_COMMIT=PASS'
