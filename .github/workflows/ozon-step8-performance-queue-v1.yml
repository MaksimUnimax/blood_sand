name: Ozon Step8 Performance exact queue v1
run-name: Ozon Step8 Performance exact queue v1 · ${{ github.ref_name }} · ${{ github.sha }}

on:
  push:
    branches:
      - repair/ozon-step8-performance-48-terminal-2026-08-31
    paths:
      - .github/workflows/ozon-step8-performance-queue-v1.yml
      - tooling/llm-api-bridges/ozon-seller/validation/step8-performance-v1/build_step8_performance_remaining_queue.py
      - tooling/llm-api-bridges/ozon-seller/validation/step8-performance-v1/generated/OZON_PERFORMANCE_STEP8_TERMINAL_INVENTORY_V1.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ozon-step8-performance-queue-v1-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
  BUILDER: tooling/llm-api-bridges/ozon-seller/validation/step8-performance-v1/build_step8_performance_remaining_queue.py
  BRANCH: repair/ozon-step8-performance-48-terminal-2026-08-31

jobs:
  platform-queue:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Disable Git line-ending conversion
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build exact accepted 21-set and remaining 27 queue
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/step8-performance-queue"
          python "$BUILDER" --repo-root "$GITHUB_WORKSPACE" --out "$out"
          python - "$out/OZON_PERFORMANCE_STEP8_REMAINING_QUEUE_V1.json" "$RUNNER_OS" <<'PY'
          import json,sys
          proof=json.load(open(sys.argv[1],encoding='utf-8'))
          assert proof['status']=='QUEUE_READY'
          assert proof['counts']=={
              'performance_operations_total':48,
              'already_accepted_current_reads':21,
              'remaining_terminal_queue':27,
          }
          assert len(proof['accepted_current_reads'])==21
          assert len(proof['remaining_terminal_queue'])==27
          accepted={row['identity'] for row in proof['accepted_current_reads']}
          remaining={row['identity'] for row in proof['remaining_terminal_queue']}
          assert len(accepted)==21 and len(remaining)==27 and not accepted.intersection(remaining)
          assert proof['markers']==[
              'STEP8_PERFORMANCE_ACCEPTED_21_EXACT_SET_PASS',
              'STEP8_PERFORMANCE_REMAINING_27_EXACT_QUEUE_PASS',
          ]
          print(f"STEP8_PERFORMANCE_{sys.argv[2].upper()}_EXACT_QUEUE_PASS")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ozon-step8-performance-queue-${{ runner.os }}-v1
          path: ${{ runner.temp }}/step8-performance-queue
          if-no-files-found: error
          retention-days: 14

  compare-cross-platform:
    needs: platform-queue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ozon-step8-performance-queue-Linux-v1
          path: ${{ runner.temp }}/linux
      - uses: actions/download-artifact@v4
        with:
          name: ozon-step8-performance-queue-Windows-v1
          path: ${{ runner.temp }}/windows
      - name: Prove Linux and Windows queue byte identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cross"
          python - "$RUNNER_TEMP/linux" "$RUNNER_TEMP/windows" "$RUNNER_TEMP/cross/OZON_PERFORMANCE_STEP8_QUEUE_CROSS_PLATFORM_PROOF_V1.json" "$GITHUB_SHA" "$GITHUB_RUN_ID" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          linux,windows=Path(sys.argv[1]),Path(sys.argv[2])
          output,source_commit,run_id=Path(sys.argv[3]),sys.argv[4],int(sys.argv[5])
          def files(root):
              return {p.relative_to(root).as_posix():p for p in root.rglob('*') if p.is_file()}
          lf,wf=files(linux),files(windows)
          assert set(lf)==set(wf),(sorted(set(lf)-set(wf)),sorted(set(wf)-set(lf)))
          rows=[]
          for rel in sorted(lf):
              lb,wb=lf[rel].read_bytes(),wf[rel].read_bytes()
              assert lb==wb,rel
              rows.append({'path':rel,'bytes':len(lb),'sha256':hashlib.sha256(lb).hexdigest()})
          queue=json.loads((linux/'OZON_PERFORMANCE_STEP8_REMAINING_QUEUE_V1.json').read_text(encoding='utf-8'))
          proof={
              'schema':'OZON_PERFORMANCE_STEP8_QUEUE_CROSS_PLATFORM_PROOF_V1',
              'schema_version':1,
              'status':'PASS',
              'source_commit':source_commit,
              'workflow_run_id':run_id,
              'platforms':['ubuntu-latest','windows-latest'],
              'byte_identical':True,
              'file_count':len(rows),
              'counts':queue['counts'],
              'files':rows,
              'markers':[
                  'STEP8_PERFORMANCE_LINUX_EXACT_QUEUE_PASS',
                  'STEP8_PERFORMANCE_WINDOWS_EXACT_QUEUE_PASS',
                  'STEP8_PERFORMANCE_QUEUE_LINUX_WINDOWS_BYTE_IDENTICAL_PASS',
                  'STEP8_PERFORMANCE_EXACT_QUEUE_CROSS_PLATFORM_PASS',
              ],
          }
          output.write_text(json.dumps(proof,ensure_ascii=False,indent=2)+'\n',encoding='utf-8',newline='\n')
          print('STEP8_PERFORMANCE_QUEUE_LINUX_WINDOWS_BYTE_IDENTICAL_PASS')
          print('STEP8_PERFORMANCE_EXACT_QUEUE_CROSS_PLATFORM_PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ozon-step8-performance-queue-cross-platform-v1
          path: ${{ runner.temp }}/cross/OZON_PERFORMANCE_STEP8_QUEUE_CROSS_PLATFORM_PROOF_V1.json
          if-no-files-found: error
          retention-days: 14

  freeze-queue:
    needs: compare-cross-platform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: ozon-step8-performance-queue-Linux-v1
          path: ${{ runner.temp }}/queue
      - uses: actions/download-artifact@v4
        with:
          name: ozon-step8-performance-queue-cross-platform-v1
          path: ${{ runner.temp }}/cross
      - name: Freeze exact 21/27 queue in branch
        shell: bash
        run: |
          set -euo pipefail
          target=tooling/llm-api-bridges/ozon-seller/validation/step8-performance-v1/generated
          mkdir -p "$target"
          cp "$RUNNER_TEMP/queue/OZON_PERFORMANCE_STEP8_REMAINING_QUEUE_V1.json" "$target/"
          cp "$RUNNER_TEMP/queue/OZON_PERFORMANCE_STEP8_REMAINING_QUEUE_V1.csv" "$target/"
          cp "$RUNNER_TEMP/queue/OZON_PERFORMANCE_STEP8_REMAINING_QUEUE_V1.md" "$target/"
          cp "$RUNNER_TEMP/cross/OZON_PERFORMANCE_STEP8_QUEUE_CROSS_PLATFORM_PROOF_V1.json" "$target/"
          python - "$target/OZON_PERFORMANCE_STEP8_QUEUE_STATUS_V1.json" "$GITHUB_SHA" "$GITHUB_RUN_ID" <<'PY'
          import json,sys
          from pathlib import Path
          output=Path(sys.argv[1])
          proof={
              'schema':'OZON_PERFORMANCE_STEP8_QUEUE_STATUS_V1',
              'schema_version':1,
              'status':'PASS',
              'source_commit':sys.argv[2],
              'workflow_run_id':int(sys.argv[3]),
              'performance_operations_total':48,
              'exact_already_accepted_current_reads':21,
              'exact_remaining_terminal_queue':27,
              'linux_windows_byte_identical':True,
              'canonical_modified':False,
              'next_stage':'STEP8_TERMINAL_DECISION_NORMALIZATION',
              'markers':[
                  'STEP8_PERFORMANCE_ACCEPTED_21_EXACT_SET_PASS',
                  'STEP8_PERFORMANCE_REMAINING_27_EXACT_QUEUE_PASS',
                  'STEP8_PERFORMANCE_QUEUE_LINUX_WINDOWS_BYTE_IDENTICAL_PASS',
                  'STEP8_PERFORMANCE_EXACT_QUEUE_FROZEN_PASS',
              ],
          }
          output.write_text(json.dumps(proof,ensure_ascii=False,indent=2)+'\n',encoding='utf-8',newline='\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$target"
          git diff --cached --check
          if git diff --cached --quiet; then
            echo STEP8_PERFORMANCE_EXACT_QUEUE_ALREADY_FROZEN_PASS
          else
            git commit -m 'validation(ozon): freeze exact Step8 Performance 21/27 queue'
            git pull --rebase origin "$BRANCH"
            git push origin HEAD:"$BRANCH"
            echo STEP8_PERFORMANCE_EXACT_QUEUE_FROZEN_PASS
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ozon-step8-performance-queue-frozen-v1
          path: tooling/llm-api-bridges/ozon-seller/validation/step8-performance-v1/generated
          if-no-files-found: error
          retention-days: 30
