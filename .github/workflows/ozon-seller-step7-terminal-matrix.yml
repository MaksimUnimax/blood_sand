name: Ozon Seller Step7 463 terminal matrix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover-exact-seller-swagger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/ozon-v2-b1-stocks-warehouse-2026-08-29
      - name: Materialize immutable exact accepted Seller Swagger
        shell: bash
        run: |
          set -euo pipefail
          v=tooling/llm-api-bridges/ozon-seller/validation
          out=/tmp/seller-step7-swagger
          rm -rf "$out"
          mkdir -p "$out"
          python3 "$v/materialize_ozon_seller_exact_swagger_transport.py" \
            --validation-dir "$v" \
            --out "$out/seller-swagger.json"
          actual_sha="$(sha256sum "$out/seller-swagger.json" | awk '{print $1}')"
          actual_bytes="$(wc -c < "$out/seller-swagger.json" | tr -d ' ')"
          test "$actual_sha" = '39e053a147180d1df4ded6ed0272aaaf02dd6a371144d8ebed7113fd218e4b40'
          test "$actual_bytes" = '3933043'
          echo SELLER_STEP7_EXACT_SWAGGER_BYTE_IDENTITY_PASS
      - uses: actions/upload-artifact@v4
        with:
          name: seller-step7-exact-swagger
          path: /tmp/seller-step7-swagger/seller-swagger.json
          if-no-files-found: error
          retention-days: 7

  linux-matrix:
    needs: recover-exact-seller-swagger
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/ozon-v2-b1-stocks-warehouse-2026-08-29
      - uses: actions/download-artifact@v4
        with:
          name: seller-step7-exact-swagger
          path: /tmp/seller-step7-swagger
      - name: Build Seller Step7 matrix on Linux
        shell: bash
        run: |
          set -euo pipefail
          v=tooling/llm-api-bridges/ozon-seller/validation
          rm -rf /tmp/step7-work /tmp/step7-step6 /tmp/step7-linux
          mkdir -p /tmp/step7-linux
          python3 "$v/materialize_performance_step6_read_coverage_package.py" --repo-root . --work-root /tmp/step7-work --out /tmp/step7-step6
          node -e "require(process.argv[1]); const fs=require('fs'); fs.writeFileSync(process.argv[2], JSON.stringify(globalThis.OzonOperationRegistry.OPERATIONS,null,2)+'\n')" /tmp/step7-step6/shared/ozon_operation_registry.js /tmp/step7-linux/registry.json
          python3 "$v/build_ozon_seller_step7_terminal_matrix.py" \
            --swagger /tmp/seller-step7-swagger/seller-swagger.json \
            --registry-json /tmp/step7-linux/registry.json \
            --step5-decisions "$v/OZON_STEP5_EXACT_DECISION_MATRIX_2026-08-29.json" \
            --out-json /tmp/step7-linux/OZON_SELLER_STEP7_TERMINAL_MATRIX_2026-08-30.json \
            --out-csv /tmp/step7-linux/OZON_SELLER_STEP7_TERMINAL_MATRIX_2026-08-30.csv \
            --out-summary /tmp/step7-linux/OZON_SELLER_STEP7_TERMINAL_MATRIX_SUMMARY_2026-08-30.md
          rm /tmp/step7-linux/registry.json
          sha256sum /tmp/step7-linux/*
          echo SELLER_STEP7_LINUX_MATRIX_PASS
      - uses: actions/upload-artifact@v4
        with:
          name: seller-step7-linux-matrix
          path: /tmp/step7-linux
          if-no-files-found: error
          retention-days: 7

  windows-matrix:
    needs: recover-exact-seller-swagger
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/ozon-v2-b1-stocks-warehouse-2026-08-29
      - uses: actions/download-artifact@v4
        with:
          name: seller-step7-exact-swagger
          path: ${{ runner.temp }}/seller-step7-swagger
      - name: Build Seller Step7 matrix on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $v = 'tooling/llm-api-bridges/ozon-seller/validation'
          $work = Join-Path $env:TEMP 'step7-work'
          $step6 = Join-Path $env:TEMP 'step7-step6'
          $out = Join-Path $env:TEMP 'step7-windows'
          foreach ($p in @($work,$step6,$out)) { if (Test-Path $p) { Remove-Item -Recurse -Force $p } }
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          python "$v/materialize_performance_step6_read_coverage_package.py" --repo-root . --work-root $work --out $step6
          $registry = Join-Path $out 'registry.json'
          node -e "require(process.argv[1]); const fs=require('fs'); fs.writeFileSync(process.argv[2], JSON.stringify(globalThis.OzonOperationRegistry.OPERATIONS,null,2)+'\n')" (Join-Path $step6 'shared/ozon_operation_registry.js') $registry
          python "$v/build_ozon_seller_step7_terminal_matrix.py" --swagger (Join-Path $env:TEMP 'seller-step7-swagger/seller-swagger.json') --registry-json $registry --step5-decisions "$v/OZON_STEP5_EXACT_DECISION_MATRIX_2026-08-29.json" --out-json (Join-Path $out 'OZON_SELLER_STEP7_TERMINAL_MATRIX_2026-08-30.json') --out-csv (Join-Path $out 'OZON_SELLER_STEP7_TERMINAL_MATRIX_2026-08-30.csv') --out-summary (Join-Path $out 'OZON_SELLER_STEP7_TERMINAL_MATRIX_SUMMARY_2026-08-30.md')
          Remove-Item $registry
          Get-ChildItem $out -File | ForEach-Object { Write-Host "$($_.Name) $((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())" }
          Write-Host 'SELLER_STEP7_WINDOWS_MATRIX_PASS'
      - uses: actions/upload-artifact@v4
        with:
          name: seller-step7-windows-matrix
          path: ${{ runner.temp }}/step7-windows
          if-no-files-found: error
          retention-days: 7

  compare-and-commit-evidence:
    needs: [linux-matrix, windows-matrix]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/ozon-v2-b1-stocks-warehouse-2026-08-29
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: seller-step7-linux-matrix
          path: /tmp/step7-linux
      - uses: actions/download-artifact@v4
        with:
          name: seller-step7-windows-matrix
          path: /tmp/step7-windows
      - name: Require cross-platform byte identity and freeze evidence
        shell: bash
        run: |
          set -euo pipefail
          for f in OZON_SELLER_STEP7_TERMINAL_MATRIX_2026-08-30.json OZON_SELLER_STEP7_TERMINAL_MATRIX_2026-08-30.csv OZON_SELLER_STEP7_TERMINAL_MATRIX_SUMMARY_2026-08-30.md; do
            cmp "/tmp/step7-linux/$f" "/tmp/step7-windows/$f"
          done
          echo SELLER_STEP7_LINUX_WINDOWS_BYTE_IDENTICAL_PASS
          v=tooling/llm-api-bridges/ozon-seller/validation
          cp /tmp/step7-linux/OZON_SELLER_STEP7_TERMINAL_MATRIX_2026-08-30.json "$v/"
          cp /tmp/step7-linux/OZON_SELLER_STEP7_TERMINAL_MATRIX_2026-08-30.csv "$v/"
          cp /tmp/step7-linux/OZON_SELLER_STEP7_TERMINAL_MATRIX_SUMMARY_2026-08-30.md "$v/"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$v/OZON_SELLER_STEP7_TERMINAL_MATRIX_2026-08-30.json" "$v/OZON_SELLER_STEP7_TERMINAL_MATRIX_2026-08-30.csv" "$v/OZON_SELLER_STEP7_TERMINAL_MATRIX_SUMMARY_2026-08-30.md"
          if git diff --cached --quiet; then
            echo 'Seller Step7 terminal matrix evidence unchanged'
            exit 0
          fi
          git commit -m 'validation(ozon): freeze Seller Step7 463 terminal decisions'
          git push origin HEAD:repair/ozon-v2-b1-stocks-warehouse-2026-08-29
