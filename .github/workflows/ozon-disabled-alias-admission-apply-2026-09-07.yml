name: Ozon disabled alias admission apply 2026-09-07

on:
  push:
    branches:
      - repair/ozon-disabled-alias-admission-2026-09-07

permissions:
  contents: write

env:
  DIST: tooling/llm-api-bridges/ozon-seller/dist-step7-candidate
  VALIDATION: tooling/llm-api-bridges/ozon-seller/validation/read-effect-repair-v1
  TARGET: tooling/llm-api-bridges/ozon-seller/validation/disabled-alias-admission-v1/run_disabled_alias_admission_gate.mjs
  PATCHER: tooling/llm-api-bridges/ozon-seller/validation/disabled-alias-admission-v1/apply_disabled_alias_admission_patch.py

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: repair/ozon-disabled-alias-admission-2026-09-07
          fetch-depth: 0
      - name: Apply exact guarded runtime patch
        shell: bash
        run: |
          set -euo pipefail
          python "$PATCHER"
          test "$(git diff --name-only | sort)" = $'tooling/llm-api-bridges/ozon-seller/dist-step7-candidate/service_worker.js\ntooling/llm-api-bridges/ozon-seller/dist-step7-candidate/shared/ozon_contract.js'
          node --check "$DIST/service_worker.js"
          node --check "$DIST/shared/ozon_contract.js"
          node "$TARGET" .
          echo REG_DISABLED_ALIAS_RUNTIME_PATCH_TARGETED_PASS
      - name: Full intersecting regression family before runtime commit
        shell: bash
        run: |
          set -euo pipefail
          node "$VALIDATION/run_defect_015_date_repair_gate.mjs" .
          node "$VALIDATION/run_effect_read_repair_gate.mjs" .
          for gate in "$VALIDATION"/run_*.mjs; do node "$gate" .; done
          echo REG_DISABLED_ALIAS_PRECOMMIT_FULL_REGRESSION_PASS
      - name: Commit exact runtime delta
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$DIST/service_worker.js" "$DIST/shared/ozon_contract.js"
          test -z "$(git status --porcelain | grep -vE '^M  tooling/llm-api-bridges/ozon-seller/dist-step7-candidate/(service_worker.js|shared/ozon_contract.js)$' || true)"
          git commit -m 'fix(ozon): reject disabled aliases before batch admission'
          git push origin HEAD:repair/ozon-disabled-alias-admission-2026-09-07
