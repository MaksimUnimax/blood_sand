name: Ozon report attachment MIME UI materialization
on:
  push:
    branches: [repair/ozon-report-file-expiry-2026-09-12]
    paths: [.github/workflows/ozon-report-attachment-mime-ui-materialize-2026-09-12.yml]
permissions:
  contents: write
concurrency:
  group: ozon-report-attachment-mime-ui-materialize
  cancel-in-progress: false
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact root-cause repair
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          root=Path('tooling/llm-api-bridges/ozon-seller')
          worker=root/'dist-step7-candidate/shared/file_delivery_port_worker.js'
          content=root/'dist-step7-candidate/attachment_delivery_port_content.js'
          assert hashlib.sha256(worker.read_bytes()).hexdigest()=='c9b5fdbc8661828c17145519395bde1a2eab1af9b434b99ae13c1d8ccda0c6dd'
          assert hashlib.sha256(content.read_bytes()).hexdigest()=='f244e0bac2f9bed953a50058259beff89efbf765f5f54c664f11ffe1dbc4977a'
          s=worker.read_text()
          s=s.replace('''      "text/csv": "csv",\n      "text/plain": "txt",''','''      "text/csv": "csv",\n      "application/csv": "csv",\n      "text/plain": "txt",''')
          anchor='''  function safeFilenameForResponse(url, headers, contentType, fileRef = "") {\n    const fallback = `ozon-report-${fileRef || "file"}.${extensionForContentType(contentType)}`;\n    const fromDisposition = dispositionFilename(headerValue(headers, "content-disposition"));\n    if (fromDisposition) return sanitizeFilename(fromDisposition, fallback);\n    try {\n      const base = decodeURIComponent(new URL(String(url || "")).pathname.split("/").filter(Boolean).pop() || "");\n      if (base && /\\.[A-Za-z0-9]{1,10}$/.test(base)) return sanitizeFilename(base, fallback);\n    } catch (_) {}\n    return sanitizeFilename(fallback);\n  }\n'''
          insert=anchor+'''\n  const PARSED_REPORT_FILE_TYPES = Object.freeze({\n    xlsx: Object.freeze({ extension: "xlsx", mime_type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }),\n    csv: Object.freeze({ extension: "csv", mime_type: "text/csv" }),\n    zip_csv: Object.freeze({ extension: "zip", mime_type: "application/zip" }),\n    pdf: Object.freeze({ extension: "pdf", mime_type: "application/pdf" })\n  });\n\n  function canonicalProviderArtifactType(captured, parsed) {\n    const rawMime = String(captured?.content_type || "application/octet-stream").split(";", 1)[0].trim().toLowerCase() || "application/octet-stream";\n    const rawExtension = extensionForContentType(rawMime);\n    const parsedFormat = String(parsed?.format || "").trim().toLowerCase();\n    const parsedType = PARSED_REPORT_FILE_TYPES[parsedFormat] || null;\n    // The existing report parser has already validated XLSX structure. That is\n    // stronger evidence than an opaque octet-stream/ZIP transport label. For\n    // already concrete non-container MIME types, preserve provider semantics.\n    if (parsedFormat === "xlsx" && parsedType) return parsedType;\n    if (rawMime !== "application/octet-stream" && rawMime !== "application/zip" && rawExtension !== "bin") {\n      return Object.freeze({ extension: rawExtension, mime_type: rawMime });\n    }\n    if (parsedType) return parsedType;\n    return Object.freeze({ extension: rawExtension, mime_type: rawMime });\n  }\n\n  function filenameWithCanonicalExtension(filename, extension, fallbackBase = "ozon-report-file") {\n    const ext = String(extension || "bin").replace(/[^A-Za-z0-9]/g, "").toLowerCase() || "bin";\n    const safe = sanitizeFilename(filename, `${fallbackBase}.${ext}`);\n    const current = OzonAIDeliveryCapabilities.extensionFromFilename(safe);\n    if (current === ext) return safe;\n    const dot = safe.lastIndexOf(".");\n    const stem = sanitizeFilename(dot > 0 ? safe.slice(0, dot) : safe, fallbackBase).replace(/\\.$/, "") || fallbackBase;\n    return sanitizeFilename(`${stem}.${ext}`, `${fallbackBase}.${ext}`);\n  }\n'''
          assert s.count(anchor)==1
          s=s.replace(anchor,insert)
          old='''  async function storeProviderArtifactForRef(fileRef, captured) {\n    const bytes = asBytes(captured.bytes);\n    const contentType = String(captured.content_type || "application/octet-stream").split(";", 1)[0].trim().toLowerCase() || "application/octet-stream";\n    const filename = safeFilenameForResponse(captured.url, captured.headers, contentType, fileRef);\n    const extension = OzonAIDeliveryCapabilities.extensionFromFilename(filename) || extensionForContentType(contentType);\n    const created = nowMs();\n    const record = {\n      artifact_key: `provider:${fileRef}`,\n      source_kind: "original_provider_file",\n      filename,\n      mime_type: contentType,\n      extension,\n'''
          new='''  async function storeProviderArtifactForRef(fileRef, captured, parsed = null) {\n    const bytes = asBytes(captured.bytes);\n    const rawContentType = String(captured.content_type || "application/octet-stream").split(";", 1)[0].trim().toLowerCase() || "application/octet-stream";\n    const canonicalType = canonicalProviderArtifactType(captured, parsed);\n    const rawFilename = safeFilenameForResponse(captured.url, captured.headers, rawContentType, fileRef);\n    const filename = filenameWithCanonicalExtension(rawFilename, canonicalType.extension, `ozon-report-${fileRef || "file"}`);\n    const extension = canonicalType.extension;\n    const created = nowMs();\n    const record = {\n      artifact_key: `provider:${fileRef}`,\n      source_kind: "original_provider_file",\n      filename,\n      mime_type: canonicalType.mime_type,\n      extension,\n'''
          assert s.count(old)==1
          s=s.replace(old,new)
          old='''      for (const ref of refs) {\n        try { await storeProviderArtifactForRef(ref, captured); } catch (_) {}\n      }\n'''
          new='''      for (const ref of refs) {\n        try { await storeProviderArtifactForRef(ref, captured, result?.parsed || null); } catch (_) {}\n      }\n'''
          assert s.count(old)==1
          worker.write_text(s)

          s=content.read_text()
          start=s.index('  function status(message, tone = "info", timeout = 7000) {')
          end=s.index('\n\n  function failPending',start)
          replacement='''  function createStatusPlate() {\n    const root = document.createElement("div");\n    root.id = "ozon-attachment-delivery-status";\n    Object.assign(root.style, { position: "fixed", right: "18px", top: "82px", zIndex: "2147483646", maxWidth: "460px", whiteSpace: "pre-wrap", padding: "10px 38px 10px 12px", borderRadius: "10px", font: "13px/1.4 system-ui, sans-serif", boxShadow: "0 8px 24px rgba(15,23,42,.18)", pointerEvents: "auto" });\n    const text = document.createElement("span");\n    text.setAttribute("data-ozon-attachment-status-text", "1");\n    root.appendChild(text);\n    const close = document.createElement("button");\n    close.setAttribute("type", "button");\n    close.setAttribute("aria-label", "Закрыть");\n    close.setAttribute("title", "Закрыть");\n    close.setAttribute("data-ozon-attachment-status-close", "1");\n    close.textContent = "×";\n    Object.assign(close.style, { position: "absolute", right: "8px", top: "6px", width: "24px", height: "24px", padding: "0", border: "0", borderRadius: "6px", background: "transparent", color: "inherit", font: "700 20px/24px system-ui, sans-serif", textAlign: "center", cursor: "pointer", opacity: "0.72" });\n    close.addEventListener("click", (event) => {\n      try { event.preventDefault(); event.stopPropagation(); } catch (_) {}\n      try { root.remove(); } catch (_) {}\n    });\n    root.appendChild(close);\n    document.documentElement.appendChild(root);\n    return root;\n  }\n\n  function status(message, tone = "info", timeout = 7000) {\n    let root = document.getElementById("ozon-attachment-delivery-status");\n    if (!(root instanceof HTMLElement) || !(root.querySelector('[data-ozon-attachment-status-text="1"]') instanceof HTMLElement) || !(root.querySelector('[data-ozon-attachment-status-close="1"]') instanceof HTMLButtonElement)) {\n      try { root?.remove?.(); } catch (_) {}\n      root = createStatusPlate();\n    }\n    const text = root.querySelector('[data-ozon-attachment-status-text="1"]');\n    text.textContent = String(message || "");\n    const token = `${Date.now()}:${Math.random().toString(36).slice(2)}`;\n    root.dataset.ozonAttachmentStatusToken = token;\n    root.style.background = tone === "error" ? "#fee2e2" : tone === "success" ? "#dcfce7" : "#e0f2fe";\n    root.style.color = tone === "error" ? "#7f1d1d" : "#0f172a";\n    if (timeout > 0) setTimeout(() => { if (root?.isConnected && root.dataset.ozonAttachmentStatusToken === token) root.remove(); }, timeout);\n  }'''
          s=s[:start]+replacement+s[end:]
          content.write_text(s)

          stale=root/'validation/regression/run_multi_ai_file_delivery_patch.mjs'
          s=stale.read_text()
          old='''assert.equal(aliceLarge.delivery.mode,"batch_watch_v1");\nassert.equal(capabilities.generatedTextDecision("alice",aboveText).threshold_status,"pending_live_calibration");\npass("REG_OTHER_AI_THRESHOLD_NOT_INHERITED");'''
          new='''assert.equal(aliceLarge.delivery.mode,"attachment_watch_v1");\nassert.equal(capabilities.generatedTextDecision("alice",aboveText).threshold_status,"calibrated");\nassert.equal(capabilities.generatedTextDecision("alice",aboveText).threshold,90_000);\npass("REG_ALICE_CALIBRATED_THRESHOLD_NOT_CHATGPT_INHERITANCE");'''
          assert s.count(old)==1
          stale.write_text(s.replace(old,new))
      - name: Targeted GREEN and related regression sweep
        shell: bash
        run: |
          set -euo pipefail
          ROOT='tooling/llm-api-bridges/ozon-seller'
          GATE="$ROOT/validation/report-file-attachment-mime-ui-v1"
          node --check "$ROOT/dist-step7-candidate/shared/file_delivery_port_worker.js"
          node --check "$ROOT/dist-step7-candidate/attachment_delivery_port_content.js"
          node "$GATE/run_report_attachment_type_gate.mjs" "$ROOT/dist-step7-candidate"
          node "$GATE/run_status_plate_close_gate.mjs" "$ROOT/dist-step7-candidate"
          for t in \
            run_file_delivery_adapter_gate_policy.mjs \
            run_file_delivery_capture_accounting.mjs \
            run_alice_xlsx_live_capability_gate.mjs \
            run_file_delivery_port_worker_state_machine.mjs \
            run_file_delivery_mixed_batch_policy.mjs \
            run_multi_ai_file_delivery_patch.mjs; do
              node "$ROOT/validation/regression/$t"
          done
          python "$ROOT/validation/report-file-expiry-v1/run_suite.py" targeted
          echo TARGETED_GREEN_PASS
          echo PROVIDER_CALLS_DURING_GATE=0
      - name: Freeze exact executable change
        shell: bash
        run: |
          set -euo pipefail
          ROOT='tooling/llm-api-bridges/ozon-seller'
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$ROOT/dist-step7-candidate/shared/file_delivery_port_worker.js" \
                  "$ROOT/dist-step7-candidate/attachment_delivery_port_content.js" \
                  "$ROOT/validation/regression/run_multi_ai_file_delivery_patch.mjs"
          git commit -m 'fix(ozon): preserve parsed report type through Alice attachment delivery'
          git push origin HEAD:refs/heads/repair/ozon-report-file-expiry-2026-09-12
