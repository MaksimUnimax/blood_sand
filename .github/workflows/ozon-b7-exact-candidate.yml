name: Ozon B7 Analytics Search exact candidate

on:
  push:
    branches:
      - feature/ozon-b7-analytics-search-contracts-2026-08-26
    paths:
      - .github/workflows/ozon-b7-exact-candidate.yml
      - tooling/llm-api-bridges/ozon-seller/validation/PATCH_B7_ANALYTICS_SEARCH_2026-08-26.patch.gz
      - tooling/llm-api-bridges/ozon-seller/validation/materialize_patch_b7_analytics_search_candidate.py
      - tooling/llm-api-bridges/ozon-seller/validation/PATCH_B7_ANALYTICS_SEARCH_REGRESSION_2026-08-26.mjs
      - tooling/llm-api-bridges/ozon-seller/validation/PATCH_B7_ANALYTICS_SEARCH_*_2026-08-26.md

permissions:
  contents: read

jobs:
  linux-materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Materialize exact B7 candidate
        run: python3 tooling/llm-api-bridges/ozon-seller/validation/materialize_patch_b7_analytics_search_candidate.py --repo-root . --work-root /tmp/ozon-b7-work --out /tmp/ozon-b7-exact
      - name: Verify accepted B1-B6 regressions
        run: |
          node tooling/llm-api-bridges/ozon-seller/validation/PATCH_B1_ASSORTMENT_MASTER_REGRESSION_2026-08-26.mjs /tmp/ozon-b7-exact
          node tooling/llm-api-bridges/ozon-seller/validation/PATCH_B2_PRICES_LISTING_STATE_REGRESSION_2026-08-26.mjs /tmp/ozon-b7-exact
          node tooling/llm-api-bridges/ozon-seller/validation/PATCH_B3_WAREHOUSE_STOCK_GEOGRAPHY_REGRESSION_2026-08-26.mjs /tmp/ozon-b7-exact
          node tooling/llm-api-bridges/ozon-seller/validation/PATCH_B4_ORDERS_RETURNS_CANCELLATIONS_REGRESSION_2026-08-26.mjs /tmp/ozon-b7-exact
          node tooling/llm-api-bridges/ozon-seller/validation/PATCH_B5_FINANCE_REALIZATION_REGRESSION_2026-08-26.mjs /tmp/ozon-b7-exact
          node tooling/llm-api-bridges/ozon-seller/validation/PATCH_B6_PERFORMANCE_READ_CORE_REGRESSION_2026-08-26.mjs /tmp/ozon-b7-exact
      - name: Verify B7 regression and syntax
        run: |
          node --check tooling/llm-api-bridges/ozon-seller/validation/PATCH_B7_ANALYTICS_SEARCH_REGRESSION_2026-08-26.mjs
          node tooling/llm-api-bridges/ozon-seller/validation/PATCH_B7_ANALYTICS_SEARCH_REGRESSION_2026-08-26.mjs /tmp/ozon-b7-exact
          find /tmp/ozon-b7-exact -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Record exact identities
        run: |
          cd /tmp/ozon-b7-exact
          find . -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/ozon-b7-exact-files.sha256
          sha256sum shared/ozon_operation_registry.js shared/ozon_contract.js shared/ozon_entitlements.js service_worker.js content_script.js shared/bridge_autorun_model.js shared/work_session_model.js > /tmp/ozon-b7-core.sha256
      - name: Upload exact B7 candidate
        uses: actions/upload-artifact@v4
        with:
          name: ozon-b7-analytics-search-candidate
          path: |
            /tmp/ozon-b7-exact
            /tmp/ozon-b7-exact-files.sha256
            /tmp/ozon-b7-core.sha256
          if-no-files-found: error
          retention-days: 3

  windows-materialize:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify B7 patch transport identity
        shell: pwsh
        run: |
          python -c "import gzip,hashlib,pathlib; p=pathlib.Path('tooling/llm-api-bridges/ozon-seller/validation/PATCH_B7_ANALYTICS_SEARCH_2026-08-26.patch.gz'); c=p.read_bytes(); assert hashlib.sha256(c).hexdigest()=='a3d88d1be345254aa99522f148c01907111bbd3d87463b22d632f5ea0f15fb3a'; b=gzip.decompress(c); assert hashlib.sha256(b).hexdigest()=='4c1de93a97938f9541936cd1edf8060a21b93acf19b296f16cf81a4994cfeac4'"
      - name: Materialize exact B7 candidate on Windows
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP "ozon-b7-work"
          $out = Join-Path $env:RUNNER_TEMP "ozon-b7-exact"
          python tooling/llm-api-bridges/ozon-seller/validation/materialize_patch_b7_analytics_search_candidate.py --repo-root . --work-root $work --out $out
      - name: Verify B1-B7 deterministic gates on Windows
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "ozon-b7-exact"
          node tooling/llm-api-bridges/ozon-seller/validation/PATCH_B1_ASSORTMENT_MASTER_REGRESSION_2026-08-26.mjs $out; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tooling/llm-api-bridges/ozon-seller/validation/PATCH_B2_PRICES_LISTING_STATE_REGRESSION_2026-08-26.mjs $out; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tooling/llm-api-bridges/ozon-seller/validation/PATCH_B3_WAREHOUSE_STOCK_GEOGRAPHY_REGRESSION_2026-08-26.mjs $out; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tooling/llm-api-bridges/ozon-seller/validation/PATCH_B4_ORDERS_RETURNS_CANCELLATIONS_REGRESSION_2026-08-26.mjs $out; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tooling/llm-api-bridges/ozon-seller/validation/PATCH_B5_FINANCE_REALIZATION_REGRESSION_2026-08-26.mjs $out; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tooling/llm-api-bridges/ozon-seller/validation/PATCH_B6_PERFORMANCE_READ_CORE_REGRESSION_2026-08-26.mjs $out; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tooling/llm-api-bridges/ozon-seller/validation/PATCH_B7_ANALYTICS_SEARCH_REGRESSION_2026-08-26.mjs $out; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem -Path $out -Recurse -Filter *.js | ForEach-Object { node --check $_.FullName; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
