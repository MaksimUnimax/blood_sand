name: Extract Ozon Patch A checkpoint

on:
  push:
    branches:
      - repair/ozon-work-session-lifecycle-2026-08-24
    paths:
      - .github/workflows/ozon_patch_a_extract.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract checkpoint into reviewable source tree
        shell: bash
        run: |
          set -euo pipefail
          ZIP='tooling/llm-api-bridges/ozon-seller/artifacts/OZON_BRIDGE_v0.1.19_WORK_SESSION_LIFECYCLE_M3_REFRESH_CHECKPOINT_2026-08-23.zip'
          DEST='tooling/llm-api-bridges/ozon-seller/patch-a-repair/source'
          test "$(sha256sum "$ZIP" | awk '{print $1}')" = 'c62b54b4500e7efc4bf507ce9143a929d9a5fcd489da679e14b6d2d3ae55d650'
          rm -rf "$DEST"
          mkdir -p "$DEST"
          unzip -q "$ZIP" -d "$DEST"
          test "$(find "$DEST" -type f | wc -l | tr -d ' ')" = '19'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$DEST"
          git commit -m 'chore(ozon): materialize Patch A M3 sources for repair'
          git push origin HEAD:${GITHUB_REF_NAME}
