name: Ozon Step5 exact Swagger authority

on:
  push:
    branches:
      - repair/ozon-v2-b1-stocks-warehouse-2026-08-29
    paths:
      - .github/workflows/ozon-step5-exact-swagger-authority.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover-exact-seller-swagger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair authority
        uses: actions/checkout@v4
        with:
          ref: repair/ozon-v2-b1-stocks-warehouse-2026-08-29

      - name: Recover public Seller Swagger in browser and require accepted byte identity
        shell: bash
        run: |
          set -euo pipefail
          expected_sha='39e053a147180d1df4ded6ed0272aaaf02dd6a371144d8ebed7113fd218e4b40'
          expected_bytes='3933043'
          root_url='https://docs.ozon.ru/api/seller/'
          spec_url='https://docs.ozon.ru/api/seller/swagger.json'
          out='/tmp/ozon-step5-swagger'
          mkdir -p "$out"

          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome"
          npm install --no-save puppeteer-core@24

          cat > /tmp/recover-step5-swagger.mjs <<'JS'
          import fs from 'node:fs';
          import puppeteer from 'puppeteer-core';

          const chrome = process.env.CHROME_BIN;
          const rootUrl = process.env.ROOT_URL;
          const specUrl = process.env.SPEC_URL;
          const out = process.env.OUT_DIR;
          const browser = await puppeteer.launch({
            executablePath: chrome,
            headless: false,
            args: ['--no-sandbox', '--disable-dev-shm-usage'],
          });
          try {
            const page = await browser.newPage();
            await page.setViewport({width: 1280, height: 900});
            await page.setExtraHTTPHeaders({
              'Accept-Language': 'ru-RU,ru;q=0.9,en;q=0.8',
              'Accept': 'application/json,text/plain,*/*',
            });

            const root = await page.goto(rootUrl, {waitUntil: 'domcontentloaded', timeout: 60000});
            console.log('ROOT_STATUS', root?.status() ?? null);
            console.log('ROOT_FINAL_URL', page.url());

            const response = await page.goto(specUrl, {waitUntil: 'domcontentloaded', timeout: 60000});
            if (!response) throw new Error('Swagger navigation produced no response');
            const text = await response.text();
            console.log('SPEC_STATUS', response.status());
            console.log('SPEC_FINAL_URL', page.url());
            console.log('SPEC_CONTENT_TYPE', response.headers()['content-type'] ?? '');
            console.log('SPEC_BYTES_UTF8', Buffer.byteLength(text, 'utf8'));

            const parsed = JSON.parse(text);
            if (!parsed || typeof parsed !== 'object' || !parsed.paths || typeof parsed.paths !== 'object') {
              throw new Error('Swagger response is not a valid spec object');
            }
            fs.writeFileSync(`${out}/seller-swagger.json`, text, {encoding: 'utf8'});
            fs.writeFileSync(`${out}/seller-swagger.final-url.txt`, `${page.url()}\n`, {encoding: 'utf8'});
          } finally {
            await browser.close();
          }
          JS

          CHROME_BIN="$chrome" ROOT_URL="$root_url" SPEC_URL="$spec_url" OUT_DIR="$out" \
            xvfb-run -a node /tmp/recover-step5-swagger.mjs
          rm -f /tmp/recover-step5-swagger.mjs

          actual_sha="$(sha256sum "$out/seller-swagger.json" | awk '{print $1}')"
          actual_bytes="$(wc -c < "$out/seller-swagger.json" | tr -d ' ')"
          echo "accepted_sha=$expected_sha"
          echo "actual_sha=$actual_sha"
          echo "accepted_bytes=$expected_bytes"
          echo "actual_bytes=$actual_bytes"
          test "$actual_sha" = "$expected_sha"
          test "$actual_bytes" = "$expected_bytes"

          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('/tmp/ozon-step5-swagger/seller-swagger.json')
          x=json.loads(p.read_text(encoding='utf-8'))
          assert isinstance(x,dict)
          assert isinstance(x.get('paths'),dict)
          operations=sum(1 for item in x['paths'].values() for method in item if method.lower() in {'get','post','put','patch','delete','head','options','trace'})
          assert operations == 463, operations
          print('STEP5_EXACT_SWAGGER_463_OPERATIONS_PASS')
          PY

          printf '%s  %s\n' "$actual_sha" seller-swagger.json > "$out/seller-swagger.sha256"
          printf '%s\n' "$spec_url" > "$out/seller-swagger.source-url.txt"
          echo STEP5_EXACT_SWAGGER_ACCEPTED_BYTE_IDENTITY_PASS

      - name: Upload exact accepted Swagger authority
        uses: actions/upload-artifact@v4
        with:
          name: ozon-step5-exact-seller-swagger-authority
          path: /tmp/ozon-step5-swagger
          if-no-files-found: error
          retention-days: 7
