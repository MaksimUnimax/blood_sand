name: Ozon B38 Finance Ledger Reads exact candidate
on:
  push:
    branches: [feature/ozon-b38-finance-ledger-reads-2026-08-28]
    paths:
      - .github/workflows/ozon-b38-exact-candidate.yml
      - tooling/llm-api-bridges/ozon-seller/validation/PATCH_B38_FINANCE_LEDGER_READS_2026-08-28.patch.gz
      - tooling/llm-api-bridges/ozon-seller/validation/materialize_patch_b38_finance_ledger_reads_candidate.py
      - tooling/llm-api-bridges/ozon-seller/validation/PATCH_B38_FINANCE_LEDGER_READS_REGRESSION_2026-08-28.mjs
      - tooling/llm-api-bridges/ozon-seller/validation/PATCH_B38_FINANCE_LEDGER_READS_CANDIDATE_EVIDENCE_2026-08-28.md
      - tooling/llm-api-bridges/ozon-seller/validation/PATCH_B38_FINANCE_LEDGER_READS_CANDIDATE_MANIFEST_2026-08-28.md
permissions: {contents: read}
jobs:
  linux-materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify B38 patch transport identity
        run: python3 -c "import gzip,hashlib,pathlib;p=pathlib.Path('tooling/llm-api-bridges/ozon-seller/validation/PATCH_B38_FINANCE_LEDGER_READS_2026-08-28.patch.gz');c=p.read_bytes();assert hashlib.sha256(c).hexdigest()=='62b6ae9beb5f757326af31562b32b3b6f8e350efbe308a607d5cb33671c5137d';assert hashlib.sha256(gzip.decompress(c)).hexdigest()=='d1ff737b3c4226ce35b3331654f814696b5e4a276d6ea855f68b80e3e81e3167'"
      - name: Materialize exact B38 candidate
        run: python3 tooling/llm-api-bridges/ozon-seller/validation/materialize_patch_b38_finance_ledger_reads_candidate.py --repo-root . --work-root /tmp/ozon-b38-work --out /tmp/ozon-b38-exact
      - name: Verify B37 base and B38 gates
        run: |
          node tooling/llm-api-bridges/ozon-seller/validation/PATCH_B37_FBO_REMOVAL_REPORT_READS_REGRESSION_2026-08-28.mjs /tmp/ozon-b38-work/b37-base
          node tooling/llm-api-bridges/ozon-seller/validation/PATCH_B38_FINANCE_LEDGER_READS_REGRESSION_2026-08-28.mjs /tmp/ozon-b38-exact
          find /tmp/ozon-b38-exact -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - uses: actions/upload-artifact@v4
        with: {name: ozon-b38-finance-ledger-reads-candidate, path: /tmp/ozon-b38-exact, if-no-files-found: error, retention-days: 3}
  windows-materialize:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable Git long paths
        shell: pwsh
        run: git config --global core.longpaths true
      - name: Verify B38 patch transport identity
        shell: pwsh
        run: python -c "import gzip,hashlib,pathlib;p=pathlib.Path('tooling/llm-api-bridges/ozon-seller/validation/PATCH_B38_FINANCE_LEDGER_READS_2026-08-28.patch.gz');c=p.read_bytes();assert hashlib.sha256(c).hexdigest()=='62b6ae9beb5f757326af31562b32b3b6f8e350efbe308a607d5cb33671c5137d';assert hashlib.sha256(gzip.decompress(c)).hexdigest()=='d1ff737b3c4226ce35b3331654f814696b5e4a276d6ea855f68b80e3e81e3167'"
      - name: Materialize exact B38 candidate
        shell: pwsh
        run: |
          $work='C:\b38w'; $out='C:\b38o'
          python tooling/llm-api-bridges/ozon-seller/validation/materialize_patch_b38_finance_ledger_reads_candidate.py --repo-root . --work-root $work --out $out
      - name: Verify B37 base and B38 gates
        shell: pwsh
        run: |
          $work='C:\b38w'; $out='C:\b38o'; $b37=Join-Path $work 'b37-base'
          node tooling/llm-api-bridges/ozon-seller/validation/PATCH_B37_FBO_REMOVAL_REPORT_READS_REGRESSION_2026-08-28.mjs $b37; if($LASTEXITCODE-ne 0){exit $LASTEXITCODE}
          node tooling/llm-api-bridges/ozon-seller/validation/PATCH_B38_FINANCE_LEDGER_READS_REGRESSION_2026-08-28.mjs $out; if($LASTEXITCODE-ne 0){exit $LASTEXITCODE}
          Get-ChildItem $out -Recurse -Filter *.js | ForEach-Object {node --check $_.FullName;if($LASTEXITCODE-ne 0){exit $LASTEXITCODE}}
